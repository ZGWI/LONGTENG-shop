<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<title>龙腾手机库存</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/niimbot-web-bluetooth@2.6.0/src/niimbot.js"></script>
<style>
:root{
  --ios-blue:#007AFF;--ios-blue-dark:#0051D5;--ios-green:#34C759;--ios-red:#FF3B30;
  --ios-orange:#FF9500;--ios-purple:#AF52DE;--ios-pink:#FF2D55;--ios-indigo:#5856D6;
  --ios-teal:#5AC8FA;--ios-yellow:#FFCC00;
  --text:#1C1C1E;--text2:rgba(60,60,67,.6);--text3:rgba(60,60,67,.3);
  --bg-system:#F2F2F7;--bg-elevated:rgba(255,255,255,.72);--bg-card:rgba(255,255,255,.78);
  --bg-input:rgba(120,120,128,.12);
  --separator:rgba(60,60,67,.29);--separator-soft:rgba(60,60,67,.12);
  --glass-border:rgba(255,255,255,.6);
  --radius-lg:28px;--radius:22px;--radius-sm:16px;--radius-xs:12px;
  --shadow-1:0 1px 2px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.04);
  --shadow-2:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
  --shadow-3:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --shadow-blue:0 8px 24px rgba(0,122,255,.32),0 2px 6px rgba(0,122,255,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#C7C7CC;color:var(--text);font-size:15px;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.01em;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 20% 0%,rgba(0,122,255,.15),transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%,rgba(175,82,222,.12),transparent 60%),
    radial-gradient(ellipse 50% 30% at 0% 100%,rgba(52,199,89,.08),transparent 60%);
}
#app{
  max-width:640px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#F7F8FC 0%,#F2F2F7 100%);
  box-shadow:0 0 60px rgba(0,0,0,.1);z-index:1;
}
#topbar{
  height:58px;flex:none;display:flex;align-items:center;padding:0 8px;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:.5px solid var(--separator-soft);z-index:10;position:relative;
}
#topbar .tb-btn{
  width:40px;height:40px;border:0;background:transparent;color:var(--ios-blue);
  font-size:19px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s cubic-bezier(.4,0,.2,1);font-weight:500;
}
#topbar .tb-btn:active{background:rgba(120,120,128,.12);transform:scale(.94);}
#topbar .tb-btn.hidden{visibility:hidden;}
#topbar h1{
  flex:1;text-align:center;font-size:17px;margin:0;font-weight:600;letter-spacing:-.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
#main{flex:1;position:relative;overflow:hidden;}
.view{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:none;padding-bottom:24px;animation:viewIn .28s cubic-bezier(.4,0,.2,1);
}
.view.active{display:block;}
@keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#tabbar{
  flex:none;height:58px;display:flex;background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:.5px solid var(--separator-soft);z-index:10;position:relative;
  padding-bottom:env(safe-area-inset-bottom,0);
}
#tabbar.hidden{display:none;}
#tabbar button{
  flex:1;border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--text2);
  cursor:pointer;padding:4px 0;position:relative;transition:all .2s cubic-bezier(.4,0,.2,1);
  font-weight:500;letter-spacing:-.2px;
}
#tabbar button .ic{
  font-size:22px;line-height:1;transition:transform .25s cubic-bezier(.4,0,.2,1);
  filter:grayscale(.6);opacity:.7;
}
#tabbar button.active{color:var(--ios-blue);font-weight:600;}
#tabbar button.active .ic{transform:scale(1.08);filter:none;opacity:1;}
.search-wrap{padding:12px 16px 8px;position:relative;}
.search-wrap input{
  width:100%;height:38px;border:0;border-radius:12px;padding:0 16px 0 38px;font-size:16px;
  background:var(--bg-input);outline:none;color:var(--text);
  transition:all .2s cubic-bezier(.4,0,.2,1);font-weight:400;letter-spacing:-.2px;
}
.search-wrap input::placeholder{color:var(--text3);}
.search-wrap input:focus{background:rgba(120,120,128,.16);box-shadow:0 0 0 4px rgba(0,122,255,.12);}
.search-wrap::before{
  content:"";position:absolute;left:28px;top:50%;transform:translateY(-60%);width:15px;height:15px;
  background:radial-gradient(circle at 50% 50%,transparent 4.5px,rgba(60,60,67,.5) 4.5px,rgba(60,60,67,.5) 5.5px,transparent 5.5px);
  pointer-events:none;z-index:1;
}
.search-wrap::after{
  content:"";position:absolute;left:40px;top:58%;width:5px;height:1.5px;
  background:rgba(60,60,67,.5);transform:rotate(45deg);border-radius:2px;pointer-events:none;z-index:1;
}
.cat-tabs{
  display:flex;gap:6px;padding:4px 16px 4px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tabs button{
  flex:none;height:34px;padding:0 16px;border:0;background:rgba(120,120,128,.08);
  border-radius:100px;font-size:13.5px;color:var(--text);cursor:pointer;font-weight:500;
  white-space:nowrap;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:-.2px;
  display:flex;align-items:center;gap:5px;
}
.cat-tabs button:active{transform:scale(.96);}
.cat-tabs button.active{
  background:linear-gradient(180deg,#3395FF,#007AFF);color:#fff;font-weight:600;
  box-shadow:0 4px 12px rgba(0,122,255,.28);
}
.cat-tabs button .count{
  font-size:11.5px;opacity:.65;padding:1px 6px;border-radius:100px;
  background:rgba(255,255,255,.3);
}
.cat-tabs button:not(.active) .count{background:rgba(120,120,128,.12);}
.list{padding:6px 16px 100px;}
.card{
  background:var(--bg-card);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
  border:.5px solid var(--glass-border);box-shadow:var(--shadow-2);cursor:pointer;
  transition:all .22s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 40%);opacity:.5;
}
.card:active{transform:scale(.98);box-shadow:var(--shadow-1);}
.product-item{display:flex;gap:12px;align-items:flex-start;position:relative;z-index:1;}
.pi-main{flex:1;min-width:0;}
.pi-name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;min-width:0;}
.cat-badge{
  flex:none;display:inline-block;font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:6px;letter-spacing:-.1px;line-height:1.4;
}
.cat-badge.apple{background:rgba(0,122,255,.14);color:var(--ios-blue);}
.cat-badge.android{background:rgba(52,199,89,.14);color:var(--ios-green);}
.cat-badge.other{background:rgba(120,120,128,.14);color:var(--text2);}
.pi-name{
  flex:1;min-width:0;font-size:16px;font-weight:600;color:var(--text);
  letter-spacing:-.3px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pi-name mark{
  background:rgba(255,204,0,.4);
  color:inherit;
  padding:0 1px;
  border-radius:2px;
}
.pi-sub{
  font-size:13px;color:var(--text2);margin-bottom:6px;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pi-code{
  font-size:11.5px;color:var(--text2);
  font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pi-right{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.pi-stock{
  font-size:13px;font-weight:600;padding:4px 11px;border-radius:100px;
  background:rgba(52,199,89,.14);color:var(--ios-green);letter-spacing:-.1px;
}
.pi-stock.ok{background:rgba(52,199,89,.14);color:var(--ios-green);}
.pi-stock.warn{background:rgba(255,149,0,.14);color:var(--ios-orange);}
.pi-stock.danger{background:rgba(255,59,48,.14);color:var(--ios-red);}
.pi-price{font-size:15px;color:var(--ios-blue);font-weight:700;letter-spacing:-.3px;}
.empty{
  text-align:center;color:var(--text2);font-size:14px;
  padding:80px 24px;line-height:2;letter-spacing:-.2px;
}
.empty b{color:var(--ios-blue);font-weight:600;}
.fab{
  position:fixed;right:calc(50% - 320px + 20px);bottom:82px;
  width:56px;height:56px;border-radius:50%;border:0;
  background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%);
  color:#fff;font-size:30px;line-height:1;font-weight:300;
  box-shadow:var(--shadow-blue);cursor:pointer;z-index:9;
  display:flex;align-items:center;justify-content:center;
  transition:all .22s cubic-bezier(.4,0,.2,1);
}
@media (max-width:676px){.fab{right:20px;}}
.fab:active{transform:scale(.9);box-shadow:0 4px 12px rgba(0,122,255,.24);}
.fab::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 50%);pointer-events:none;
}
.form-body{padding:20px 16px 60px;}
.field{margin-bottom:18px;flex:1;min-width:0;}
.field label{
  display:block;font-size:13px;color:var(--text2);margin-bottom:6px;
  font-weight:500;letter-spacing:-.1px;padding-left:4px;
}
.field .req{color:var(--ios-red);}
.field input,.field textarea{
  width:100%;border:0;border-radius:12px;padding:11px 14px;font-size:16px;
  background:var(--bg-input);outline:none;font-family:inherit;color:var(--text);
  transition:all .2s cubic-bezier(.4,0,.2,1);font-weight:400;letter-spacing:-.2px;
}
.field input::placeholder,.field textarea::placeholder{color:var(--text3);}
.field input:focus,.field textarea:focus{background:rgba(120,120,128,.16);box-shadow:0 0 0 4px rgba(0,122,255,.12);}
.field input:disabled{background:rgba(120,120,128,.08);color:var(--text3);cursor:not-allowed;}
.row2{display:flex;gap:12px;}
.input-with-actions{display:flex;gap:8px;align-items:center;}
.input-with-actions input{flex:1;min-width:0;}
.mini-btn{
  flex:none;height:38px;padding:0 16px;border:0;
  background:rgba(0,122,255,.1);color:var(--ios-blue);
  border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .18s cubic-bezier(.4,0,.2,1);letter-spacing:-.2px;
}
.mini-btn:active{background:rgba(0,122,255,.2);transform:scale(.96);}
.btn-primary{
  width:100%;height:50px;border:0;border-radius:14px;
  background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%);
  color:#fff;font-size:17px;font-weight:600;cursor:pointer;margin-top:14px;
  letter-spacing:-.3px;box-shadow:var(--shadow-blue);
  transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
}
.btn-primary::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%);pointer-events:none;
}
.btn-primary:active{transform:scale(.98);box-shadow:0 4px 12px rgba(0,122,255,.24);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn-plain{
  width:100%;height:46px;border:0;background:rgba(120,120,128,.12);
  color:var(--text);font-size:16px;font-weight:500;border-radius:12px;cursor:pointer;
  transition:all .18s cubic-bezier(.4,0,.2,1);letter-spacing:-.2px;
}
.btn-plain:active{background:rgba(120,120,128,.2);transform:scale(.98);}
.detail-body{padding:20px 16px 60px;}
.d-name{font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.7px;line-height:1.2;}
.d-sub{font-size:14px;color:var(--text2);margin-bottom:12px;letter-spacing:-.2px;}
.d-badge{
  display:inline-block;font-size:14px;font-weight:600;padding:6px 16px;border-radius:100px;
  background:rgba(52,199,89,.14);color:var(--ios-green);letter-spacing:-.2px;
}
.d-badge.ok{background:rgba(52,199,89,.14);color:var(--ios-green);}
.d-badge.warn{background:rgba(255,149,0,.14);color:var(--ios-orange);}
.d-badge.danger{background:rgba(255,59,48,.14);color:var(--ios-red);}
.barcode-box{
  background:var(--bg-card);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-radius:var(--radius);padding:22px;margin:18px 0;text-align:center;
  border:.5px solid var(--glass-border);box-shadow:var(--shadow-2);
  position:relative;overflow:hidden;
}
.barcode-box::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 50%);
  pointer-events:none;opacity:.5;
}
.barcode-box svg{width:100%;height:auto;max-height:140px;display:block;position:relative;z-index:1;}
.barcode-box img{max-width:160px;height:auto;display:block;margin:0 auto;position:relative;z-index:1;}
.barcode-text{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;
  letter-spacing:1.5px;margin-top:10px;color:var(--text2);position:relative;z-index:1;
}
.d-actions{display:flex;gap:12px;margin-bottom:14px;}
.d-actions button{
  flex:1;height:50px;border:0;border-radius:14px;font-size:16px;font-weight:600;
  cursor:pointer;letter-spacing:-.2px;transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.d-actions button::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%);pointer-events:none;
}
.d-actions button:active{transform:scale(.98);}
.btn-in{
  background:linear-gradient(180deg,#40D86E 0%,#34C759 100%);color:#fff;
  box-shadow:0 8px 24px rgba(52,199,89,.32),0 2px 6px rgba(52,199,89,.16);
}
.btn-out{
  background:rgba(255,255,255,.9);color:var(--ios-red);
  box-shadow:var(--shadow-1);border:.5px solid rgba(255,59,48,.2)!important;
}
.d-mini{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.d-mini button{
  flex:1;min-width:76px;height:40px;border:0;background:rgba(255,255,255,.9);
  border-radius:12px;font-size:12.5px;color:var(--text);cursor:pointer;font-weight:500;
  letter-spacing:-.2px;box-shadow:var(--shadow-1);transition:all .18s cubic-bezier(.4,0,.2,1);
}
.d-mini button:active{transform:scale(.96);box-shadow:none;}
.btn-ble{
  background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%)!important;
  color:#fff!important;font-weight:600!important;box-shadow:var(--shadow-blue)!important;
}
.section-title{
  font-size:13px;font-weight:600;margin:24px 0 10px;color:var(--text2);
  letter-spacing:.2px;padding-left:4px;text-transform:uppercase;
}
.info-box{
  background:var(--bg-card);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-radius:var(--radius);padding:16px 18px;font-size:15px;line-height:2;
  border:.5px solid var(--glass-border);box-shadow:var(--shadow-2);letter-spacing:-.2px;
}
.info-box b{color:var(--text2);font-weight:400;display:inline-block;min-width:68px;}
.info-box > div + div{border-top:.5px solid var(--separator-soft);padding-top:6px;margin-top:6px;}
.rec-item{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:.5px solid var(--separator-soft);transition:background .15s;
}
.rec-item:last-child{border-bottom:0;}
.rec-item.clickable{cursor:pointer;}
.rec-item.clickable:active{background:rgba(120,120,128,.06);}
.rec-type{
  flex:none;padding:3px 10px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.2px;
}
.rec-type.in{color:var(--ios-green);background:rgba(52,199,89,.14);}
.rec-type.out{color:var(--ios-red);background:rgba(255,59,48,.14);}
.rec-main{flex:1;min-width:0;}
.rec-name{
  font-size:14.5px;font-weight:500;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rec-time{font-size:12px;color:var(--text2);margin-top:2px;letter-spacing:-.1px;}
.rec-time .price-tag{color:var(--ios-green);font-weight:600;}
.rec-qty{
  flex:none;font-size:16px;font-weight:700;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.3px;
}
.rec-qty.in{color:var(--ios-green);}
.rec-qty.out{color:var(--ios-red);}
.rec-arrow{flex:none;color:var(--text3);font-size:18px;font-weight:300;margin-left:-4px;line-height:1;}
.detail-info-box{
  background:rgba(120,120,128,.06);border-radius:14px;padding:14px 16px;
  font-size:14.5px;line-height:2;margin-bottom:16px;text-align:left;letter-spacing:-.2px;
}
.detail-info-box .di-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;
}
.detail-info-box .di-row + .di-row{border-top:.5px solid var(--separator-soft);}
.detail-info-box .di-label{color:var(--text2);flex:none;font-size:13.5px;}
.detail-info-box .di-value{
  color:var(--text);font-weight:500;text-align:right;flex:1;min-width:0;word-break:break-all;
}
.detail-info-box .di-value.mono{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;color:var(--text2);
}
.detail-info-box .di-value.green{color:var(--ios-green);font-weight:700;}
.detail-info-box .di-value.red{color:var(--ios-red);font-weight:700;}
.detail-info-box .di-value.blue{color:var(--ios-blue);font-weight:700;}
.detail-info-box .di-value.big{font-size:17px;}
.detail-tag{
  display:inline-block;padding:2px 8px;border-radius:6px;
  font-size:12px;font-weight:600;letter-spacing:-.2px;
}
.detail-tag.in{background:rgba(52,199,89,.14);color:var(--ios-green);}
.detail-tag.out{background:rgba(255,59,48,.14);color:var(--ios-red);}
.scan-tabs{
  display:flex;gap:6px;padding:14px 16px 12px;
  background:rgba(120,120,128,.08);border-radius:12px;margin:12px 16px 0;
}
.scan-tabs button{
  flex:1;height:34px;border:0;background:transparent;border-radius:9px;
  font-size:13.5px;color:var(--text);cursor:pointer;font-weight:500;
  letter-spacing:-.2px;transition:all .22s cubic-bezier(.4,0,.2,1);
}
.scan-tabs button:active{transform:scale(.96);}
.scan-tabs button.active{
  background:#fff;color:var(--text);font-weight:600;
  box-shadow:0 3px 8px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
.scan-reader{
  width:calc(100% - 32px);margin:14px 16px 0;aspect-ratio:1/1;max-height:70vh;
  background:#000;border-radius:var(--radius);overflow:hidden;position:relative;
  box-shadow:var(--shadow-3);cursor:pointer;
}
.scan-reader video{width:100%!important;height:100%!important;object-fit:cover;}
.scan-tip{
  text-align:center;font-size:13.5px;color:var(--text2);
  padding:14px 24px;line-height:1.7;letter-spacing:-.2px;
}
.scan-tip .scan-hint{display:block;font-size:11.5px;color:var(--text3);margin-top:4px;letter-spacing:-.1px;}
.scan-tip .focus-btn{

}

.modal-mask{

}

.modal{
  width:100%;max-width:360px;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);

  border:.5px solid rgba(255,255,255,.6);
}
.modal-mask.show .modal{transform:scale(1);}
.modal-title{font-size:17px;font-weight:600;margin-bottom:10px;text-align:center;color:var(--text);letter-spacing:-.3px;}

.modal-input{

.modal-input:focus{background:rgba(120,120,128,.16);box-shadow:0 0 0 4px rgba(0,122,255,.12);}

}
.modal-input-label .tag{
  display:inline-block;background:rgba(0,122,255,.1);color:var(--ios-blue);

}
.modal-btns{display:flex;gap:8px;margin-top:8px;}
.modal-btns button{
  flex:1;height:46px;border-radius:12px;font-size:16px;cursor:pointer;border:0;
  background:rgba(120,120,128,.12);color:var(--text);font-weight:500;
  transition:all .18s cubic-bezier(.4,0,.2,1);letter-spacing:-.3px;
}
.modal-btns button:active{transform:scale(.97);background:rgba(120,120,128,.2);}
.modal-btns button.primary{

.modal-btns button.primary:active{box-shadow:0 2px 8px rgba(0,122,255,.2);}
.modal-btns button.danger{

  box-shadow:0 6px 16px rgba(255,59,48,.28);
}
.modal-btns button.danger:active{box-shadow:0 2px 8px rgba(255,59,48,.2);}
.toast{
  position:fixed;left:50%;bottom:110px;

  color:#fff;font-size:14px;font-weight:500;padding:12px 22px;border-radius:100px;
  z-index:200;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;

.import-tip{

}
.import-tip code{

.import-area{

.tpl-btn{

.bp-progress{

.bp-progress .bp-bar{

.analysis-body{padding:16px 16px 100px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{

  border-radius:var(--radius);padding:14px 16px;

}

.stat-label{

.stat-value.green{color:var(--ios-green);}
.stat-value.orange{color:var(--ios-orange);}
.stat-value.red{color:var(--ios-red);}
.stat-value.purple{color:var(--ios-purple);}
.stat-unit{font-size:13px;font-weight:500;color:var(--text2);margin-left:4px;}
.stat-sub{font-size:11.5px;color:var(--text2);margin-top:4px;position:relative;z-index:1;letter-spacing:-.1px;}

  background:var(--bg-card);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);

  margin-bottom:14px;position:relative;overflow:hidden;
}
.analysis-block::after{

}

}

}

}

<body>
<div id="app">
  <header id="topbar">
    <button class="tb-btn hidden" id="btnBack">‹</button>
    <h1 id="tbTitle">龙腾手机库存</h1>
    <button class="tb-btn hidden" id="tbRight">⋯</button>
  </header>

  <main id="main">
    <section id="view-list" class="view active">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索 名称 / 品牌 / 型号 / 条码">
      </div>
      <div class="cat-tabs" id="catTabs">
        <button data-cat="all" class="active">全部 <span class="count" id="catCountAll">0</span></button>
        <button data-cat="apple">苹果区 <span class="count" id="catCountApple">0</span></button>
        <button data-cat="android">安卓区 <span class="count" id="catCountAndroid">0</span></button>
        <button data-cat="other">其他 <span class="count" id="catCountOther">0</span></button>
      </div>
      <div id="productList" class="list"></div>
    </section>

    <section id="view-add" class="view">
      <div class="form-body">
        <div class="field"><label>商品名称 <span class="req">*</span></label><input id="fName" type="text" placeholder="如 iPhone 15 Pro Max"></div>
        <div class="row2">
          <div class="field"><label>品牌</label><input id="fBrand" placeholder="Apple"></div>
          <div class="field"><label>型号</label><input id="fModel" placeholder="A3108"></div>
        </div>
        <div class="row2">
          <div class="field"><label>规格</label><input id="fSpec" placeholder="8G+256G"></div>
          <div class="field"><label>颜色</label><input id="fColor" placeholder="原色钛金属"></div>
        </div>
        <div class="field">
          <label>商品条码 <span class="req">*</span></label>
          <div class="input-with-actions">
            <input id="fBarcode" placeholder="扫描 / 输入 / 生成">
            <button type="button" class="mini-btn" id="btnScanBarcode">扫描</button>
            <button type="button" class="mini-btn" id="btnGenBarcode">生成</button>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>进货价</label><input id="fPriceIn" type="number" inputmode="decimal" placeholder="0.00"></div>
          <div class="field"><label>销售价</label><input id="fPriceOut" type="number" inputmode="decimal" placeholder="0.00"></div>
        </div>
        <div class="row2">
          <div class="field"><label id="lbStock">初始库存</label><input id="fStock" type="number" inputmode="numeric" value="0"></div>
          <div class="field"><label>预警值</label><input id="fWarn" type="number" inputmode="numeric" value="2"></div>

    <section id="view-detail" class="view">

    <section id="view-scan" class="view">

        <button class="focus-btn" id="btnRefocus">重新对焦</button>

  </nav>
  <button class="fab" id="fabAdd">+</button>
</div>

<script>
/* ==================== 工具 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ return (Number(n)||0).toFixed(2); }
function fmtNum(n){ return (Number(n)||0).toLocaleString('zh-CN'); }
function fmtTime(ts){
  const d = new Date(ts), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtTimeFull(ts){
  const d = new Date(ts), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),320); }, 2200);
}
/** 高亮关键词（大小写不敏感） */
function highlight(text, kw){
  const s = String(text ?? '');
  if(!kw) return esc(s);
  const lower = s.toLowerCase();
  const idx = lower.indexOf(kw);
  if(idx === -1) return esc(s);
  const before = s.slice(0, idx);
  const match = s.slice(idx, idx + kw.length);
  const after = s.slice(idx + kw.length);
  return esc(before) + '<mark>' + esc(match) + '</mark>' + esc(after);
}

/* ==================== 分类识别 ==================== */
function getProductCategory(p){
  const text = ((p.brand || '') + ' ' + (p.name || '') + ' ' + (p.model || '')).toLowerCase();
  const appleKeywords = ['apple','苹果','iphone','ipad','macbook','airpods','apple watch','imac','mac mini','mac pro','mac studio'];
  if(appleKeywords.some(k => text.includes(k))) return 'apple';
  const androidKeywords = ['华为','huawei','小米','xiaomi','红米','redmi','oppo','vivo','荣耀','honor','三星','samsung','galaxy','一加','oneplus','realme','真我','魅族','meizu','努比亚','nubia','联想','lenovo','摩托罗拉','motorola','诺基亚','nokia','索尼','sony','谷歌','google pixel','pixel','中兴','zte','传音','tecno','infinix'];
  if(androidKeywords.some(k => text.includes(k))) return 'android';
  return 'other';
}

/* ==================== 搜索匹配打分（名称优先） ==================== */
/**
 * 根据关键词返回匹配分数，分数越高越靠前
 * 100 - 名称完全匹配
 * 90  - 名称开头匹配
 * 80  - 名称包含
 * 70  - 名称模糊包含
 * 60  - 品牌匹配
 * 50  - 型号匹配
 * 40  - 条码匹配
 * 30  - 规格/颜色匹配
 * 0   - 不匹配
 */
function getMatchScore(p, kw){
  const name = (p.name || '').toLowerCase();
  const brand = (p.brand || '').toLowerCase();
  const model = (p.model || '').toLowerCase();
  const barcode = (p.barcode || '').toLowerCase();
  const spec = (p.spec || '').toLowerCase();
  const color = (p.color || '').toLowerCase();

  // 名称优先
  if(name === kw) return 100;
  if(name.startsWith(kw)) return 90;
  if(name.includes(kw)) return 80;

  // 名称拆词匹配（如搜 "苹果15" 匹配 "iPhone 15"）
  const kwParts = kw.split(/\s+/).filter(Boolean);
  if(kwParts.length > 1 && kwParts.every(part => name.includes(part))) return 75;

  // 品牌
  if(brand === kw) return 65;
  if(brand.startsWith(kw)) return 62;
  if(brand.includes(kw)) return 60;

  // 型号
  if(model === kw) return 55;
  if(model.includes(kw)) return 50;

  // 条码
  if(barcode === kw) return 45;
  if(barcode.includes(kw)) return 40;

  // 规格 / 颜色
  if(spec.includes(kw)) return 30;
  if(color.includes(kw)) return 25;

  return 0;
}

/* ==================== 摄像头优化 ==================== */
function getVideoTrack(){
  const video = document.querySelector('#reader video') || document.querySelector('#scanOnceReader video');
  if(!video) return null;
  const stream = video.srcObject;
  if(!stream) return null;
  const tracks = stream.getVideoTracks();
  return tracks[0] || null;
}
async function applyCameraOptimization(){
  const track = getVideoTrack();
  if(!track) return;
  try{
    const caps = track.getCapabilities?.() || {};
    const constraints = {};
    if(caps.focusMode && caps.focusMode.includes('continuous')) constraints.focusMode = 'continuous';
    if(caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) constraints.whiteBalanceMode = 'continuous';
    if(caps.exposureCompensation){
      const r = caps.exposureCompensation;
      constraints.exposureCompensation = Math.max(r.min, Math.min(r.max, -1));
    }
    if(Object.keys(constraints).length > 0){
      await track.applyConstraints({ advanced: [constraints] });
      console.log('摄像头优化已应用:', constraints);
    }
  }catch(e){ console.warn('摄像头优化应用失败', e); }
}
async function triggerRefocus(){
  const track = getVideoTrack();
  if(!track) return;
  const caps = track.getCapabilities?.() || {};
  if(!caps.focusMode) return;
  try{
    if(caps.focusMode.includes('manual')){
      await track.applyConstraints({ advanced: [{ focusMode: 'manual' }] });
      await new Promise(r => setTimeout(r, 80));
    }
    if(caps.focusMode.includes('continuous')){
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    }else if(caps.focusMode.includes('single-shot')){
      await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
    }
  }catch(e){ console.warn('重新对焦失败', e); }
}

let products = [];
let records = [];

function loadData(){
  try{ products = JSON.parse(localStorage.getItem('ss_products') || '[]'); }catch(e){ products = []; }
  try{ records  = JSON.parse(localStorage.getItem('ss_records')  || '[]'); }catch(e){ records  = []; }
}
function saveProducts(){ localStorage.setItem('ss_products', JSON.stringify(products)); }
function saveRecords(){ localStorage.setItem('ss_records',  JSON.stringify(records)); }

function findProduct(id){ return products.find(p => p.id === id); }
function findByBarcode(code){ return products.find(p => p.barcode === code); }

function changeStock(productId, delta, remark = '', actualPrice = null){
  if(!delta) return { ok:false, msg:'数量不能为 0' };
  const p = findProduct(productId);
  if(!p) return { ok:false, msg:'商品不存在' };
  const newStock = p.stock + delta;
  if(newStock < 0) return { ok:false, msg:`库存不足，当前库存 ${p.stock}` };
  p.stock = newStock;
  p.updatedAt = Date.now();
  const rec = {
    id: uid(), productId: p.id, productName: p.name, barcode: p.barcode,
    type: delta > 0 ? 1 : -1, quantity: Math.abs(delta),
    remark: remark || '', time: Date.now()
  };
  if(delta < 0 && actualPrice != null && !isNaN(actualPrice)){
    rec.actualPrice = actualPrice;
    rec.priceIn = p.priceIn || 0;
  }
  records.unshift(rec);
  saveProducts();
  saveRecords();
  return { ok:true, stock:newStock };
}

function undoRecord(recId){
  const idx = records.findIndex(r => r.id === recId);
  if(idx === -1) return { ok:false, msg:'记录不存在' };
  const rec = records[idx];
  const p = findProduct(rec.productId);
  let newStock = 0;
  if(p){
    const delta = rec.type > 0 ? -rec.quantity : rec.quantity;
    newStock = p.stock + delta;
    if(newStock < 0){
      return { ok:false, msg:`无法撤销：库存将变为负数（当前 ${p.stock} 台）` };
    }
    p.stock = newStock;
    p.updatedAt = Date.now();
  }
  records.splice(idx, 1);
  saveProducts();
  saveRecords();
  return { ok:true, stock:newStock, product: p, record: rec };
}

function updateCategoryCounts(){
  let apple = 0, android = 0, other = 0;
  products.forEach(p => {
    const cat = getProductCategory(p);
    if(cat === 'apple') apple++;
    else if(cat === 'android') android++;
    else other++;
  });
  const elAll = $('#catCountAll');
  const elApple = $('#catCountApple');
  const elAndroid = $('#catCountAndroid');
  const elOther = $('#catCountOther');
  if(elAll) elAll.textContent = products.length;
  if(elApple) elApple.textContent = apple;
  if(elAndroid) elAndroid.textContent = android;
  if(elOther) elOther.textContent = other;
}

function renderProductList(){
  updateCategoryCounts();

  const rawKw = searchKeyword.trim();
  const kw = rawKw.toLowerCase();

  // 过滤
  let list = products.filter(p => {
    // 分类筛选
    if(currentCategory !== 'all'){
      const cat = getProductCategory(p);
      if(cat !== currentCategory) return false;
    }
    // 关键词筛选
    if(!kw) return true;
    return getMatchScore(p, kw) > 0;
  });

  // 排序
  if(kw){
    // 有搜索词：按匹配分排序（名称优先），相同分数再按创建时间
    list.sort((a,b) => {
      const sa = getMatchScore(a, kw);
      const sb = getMatchScore(b, kw);
      if(sb !== sa) return sb - sa;
      return b.createdAt - a.createdAt;
    });
  }else{
    // 无搜索词：按创建时间
    list.sort((a,b) => b.createdAt - a.createdAt);
  }

  const el = $('#productList');
  if(list.length === 0){
    let emptyMsg = '';
    if(products.length === 0){
      emptyMsg = '还没有商品<br>点击右下角 <b>+</b> 添加第一件商品';
    }else if(rawKw){
      emptyMsg = `没有找到「${esc(rawKw)}」相关的商品<br>试试搜索名称、品牌或型号`;
    }else if(currentCategory === 'apple'){
      emptyMsg = '苹果区暂无商品<br>添加 Apple/iPhone 相关商品后会自动归入';
    }else if(currentCategory === 'android'){
      emptyMsg = '安卓区暂无商品<br>添加华为、小米等品牌后会自动归入';
    }else if(currentCategory === 'other'){
      emptyMsg = '其他区暂无商品<br>非苹果/安卓设备会归入此区';
    }else{
      emptyMsg = '没有找到匹配的商品';
    }
    el.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  el.innerHTML = list.map(p => {
    const cls = p.stock <= 0 ? 'danger' : (p.stock <= p.warnStock ? 'warn' : 'ok');
    const sub = [p.brand, p.model, p.spec, p.color].filter(Boolean).join(' / ') || '—';
    const cat = getProductCategory(p);
    const catLabel = getCategoryLabel(cat);
    // 名称搜索时高亮关键词
    const nameHtml = kw ? highlight(p.name, kw) : esc(p.name);
    return `<div class="card product-item" data-id="${esc(p.id)}">
      <div class="pi-main">
        <div class="pi-name-row">
          <span class="cat-badge ${catLabel.cls}">${catLabel.text}</span>
          <span class="pi-name">${nameHtml}</span>
        </div>
        <div class="pi-sub">${esc(sub)}</div>
        <div class="pi-code">${esc(p.barcode)}</div>
      </div>
      <div class="pi-right">
        <div class="pi-stock ${cls}">库存 ${p.stock}</div>
        <div class="pi-price">¥${fmtMoney(p.priceOut)}</div>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.product-item').forEach(node => {
    const id = node.dataset.id;
    node.addEventListener('click', () => openDetail(id));
    let timer = null;
    const start = () => { timer = setTimeout(()=>{ timer = null; showQuickMenu(id); }, 600); };
    const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
    node.addEventListener('touchstart', start, {passive:true});
    node.addEventListener('touchend', cancel);
    node.addEventListener('touchmove', cancel, {passive:true});
    node.addEventListener('contextmenu', e => { e.preventDefault(); showQuickMenu(id); });
  });
}

function copyText(text, msg){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fallbackCopy(text, msg));

}
function fallbackCopy(text, msg){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('复制失败'); }
  ta.remove();
}

function promptQuantity(productId, sign){

  const isIn = sign > 0;
  const priceField = isIn ? '' : `
    <input class="modal-input" id="mqPrice" type="number" inputmode="decimal"
      value="${p.priceOut || 0}" placeholder="实际销售价">
    <div class="modal-input-label">
      标价 ¥${fmtMoney(p.priceOut)} <span class="tag">可修改为成交价</span>
    </div>
  `;
  const { mask, close } = showModal(`
    <div class="modal-title">${isIn ? '商品入库' : '商品出库'}</div>
    <div class="modal-body">${esc(p.name)}\n当前库存：${p.stock}</div>
    <input class="modal-input" id="mqQty" type="number" inputmode="numeric" value="1" placeholder="数量">
    ${priceField}
    <input class="modal-input" id="mqRemark" type="text" placeholder="备注（可选）">
    <div class="modal-btns">
      <button data-act="cancel">取消</button>
      <button class="primary" data-act="ok">确定</button>
    </div>`);
  const qtyEl = mask.querySelector('#mqQty');
  const rmkEl = mask.querySelector('#mqRemark');
  const priceEl = mask.querySelector('#mqPrice');
  setTimeout(()=>{ qtyEl.focus(); qtyEl.select(); }, 200);
  mask.querySelector('[data-act="cancel"]').onclick = close;
  mask.querySelector('[data-act="ok"]').onclick = () => {
    const qty = parseInt(qtyEl.value) || 0;
    if(qty <= 0){ toast('请输入正确的数量'); return; }
    if(!isIn && qty > p.stock){ toast(`库存不足，当前 ${p.stock}`); return; }
    let actualPrice = null;
    if(!isIn && priceEl){
      actualPrice = parseFloat(priceEl.value);
      if(isNaN(actualPrice) || actualPrice < 0){
        toast('请输入正确的销售价'); return;
      }
    }
    const res = changeStock(p.id, sign * qty, rmkEl.value.trim(), actualPrice);
    if(!res.ok){ toast(res.msg); return; }
    close();
    if(isIn){
      toast(`入库成功，当前库存 ${res.stock}`);
    }else{
      const total = actualPrice != null ? `，销售 ¥${fmtMoney(actualPrice * qty)}` : '';
      toast(`出库成功，当前库存 ${res.stock}${total}`);
    }
    if(currentView === 'detail' && currentProductId === p.id) renderDetail(findProduct(p.id));
    else renderProductList();
  };
}

        </div>`}
    </div>
    <div class="modal-btns" style="flex-direction:column;gap:8px;">
      <button class="danger" data-act="undo">撤销此记录</button>
      <button data-act="cancel">关闭</button>
    </div>`);
  mask.querySelector('[data-act="cancel"]').onclick = close;
  mask.querySelector('[data-act="undo"]').onclick = () => {

function confirmUndoRecord(recId){
  const rec = records.find(r => r.id === recId);
  if(!rec){ toast('记录不存在'); return; }
  const isIn = rec.type > 0;
  const p = findProduct(rec.productId);
  const actionText = isIn ? '撤销入库' : '撤销出库';
  const effectText = isIn ? `库存将减少 ${rec.quantity} 台` : `库存将增加 ${rec.quantity} 台`;

  if(isIn && p){
    const newStock = p.stock - rec.quantity;
    if(newStock < 0){
      const { mask, close } = showModal(`
        <div class="modal-title">无法撤销</div>
        <div class="modal-body">撤销该入库记录会导致库存变为 ${newStock} 台（负数）。\n\n说明该批货物已部分或全部售出，请先处理相关的出库记录。</div>
        <div class="modal-btns"><button class="primary" data-act="ok">知道了</button></div>`);
      mask.querySelector('[data-act="ok"]').onclick = close;
      return;
    }
  }

  if(!p){
    const { mask, close } = showModal(`
      <div class="modal-title">${actionText}</div>
      <div class="modal-body">该商品已被删除，撤销操作只会删除这条记录，不会影响库存。</div>
      <div class="modal-btns">
        <button data-act="cancel">取消</button>
        <button class="danger" data-act="ok">确认删除记录</button>
      </div>`);
    mask.querySelector('[data-act="cancel"]').onclick = close;
    mask.querySelector('[data-act="ok"]').onclick = () => {
      const result = undoRecord(recId);
      close();
      if(result.ok){ toast(`已${actionText}`); refreshCurrentView(); }
      else toast(result.msg || '撤销失败');
    };
    return;
  }

  const { mask, close } = showModal(`
    <div class="modal-title">${actionText}</div>
    <div class="modal-body">商品：${esc(rec.productName)}\n数量：${rec.quantity} 台\n${effectText}\n\n撤销后该记录将被删除，无法恢复。</div>
    <div class="modal-btns">
      <button data-act="cancel">取消</button>
      <button class="danger" data-act="ok">确认撤销</button>
    </div>`);
  mask.querySelector('[data-act="cancel"]').onclick = close;
  mask.querySelector('[data-act="ok"]').onclick = () => {
    const result = undoRecord(recId);
    close();
    if(result.ok){
      toast(`已${actionText}，当前库存 ${result.stock} 台`);
      refreshCurrentView();
    }else toast(result.msg || '撤销失败');
  };
}

function refreshCurrentView(){
  if(currentView === 'records') renderRecords();
  if(currentView === 'list') renderProductList();
  if(currentView === 'detail' && currentProductId){
    const prod = findProduct(currentProductId);
    if(prod) renderDetail(prod);
    else showView('list');
  }
  if(currentView === 'analysis') renderAnalysis();
}

let scanner = null;
let scanMode = 'query';
let scanning = false;

$$('.scan-tabs button').forEach(btn => {
  btn.addEventListener('click', async () => {
    $$('.scan-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    scanMode = btn.dataset.mode;
    $('#scanTip').innerHTML = scanMode === 'query'
      ? '将二维码放入取景框内<span class="scan-hint">画面模糊时，点击取景框手动对焦</span><button class="focus-btn" id="btnRefocus">重新对焦</button>'
      : scanMode === 'in'
        ? '扫描商品二维码 → 快速入库<span class="scan-hint">画面模糊时，点击取景框手动对焦</span><button class="focus-btn" id="btnRefocus">重新对焦</button>'
        : '扫描商品二维码 → 快速出库<span class="scan-hint">画面模糊时，点击取景框手动对焦</span><button class="focus-btn" id="btnRefocus">重新对焦</button>';
    bindRefocusBtn();
    await stopScan();
    startScan();
  });
});

function bindRefocusBtn(){
  const btn = $('#btnRefocus');
  if(btn) btn.onclick = (e) => {
    e.stopPropagation();
    triggerRefocus();
    toast('正在重新对焦...');
  };
}

async function startScan(){
  if(scanning) return;
  const readerEl = $('#reader');
  if(!window.Html5Qrcode){ readerEl.innerHTML = '<div class="empty" style="color:#fff;">扫码组件加载失败<br>请检查网络后刷新</div>'; return; }
  readerEl.innerHTML = '';
  scanner = new Html5Qrcode('reader', { verbose: false });
  scanning = true;
  try{
    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: (w, h) => {
          const size = Math.min(w, h, 280) * 0.85;
          const side = Math.max(size, 180);
          return { width: side, height: side };
        },
        aspectRatio: 1.0
      },
      onScanSuccess,
      () => {}
    );
    setTimeout(() => applyCameraOptimization(), 500);
    setTimeout(() => applyCameraOptimization(), 1500);
  }catch(e){
    scanning = false;
    console.error('启动摄像头失败', e);
    readerEl.innerHTML = `<div class="empty" style="color:#fff;padding:30px 16px;">无法启动摄像头<br><br>请确认：<br>1. 使用 <b>HTTPS</b> 访问<br>2. 浏览器已允许摄像头权限<br>3. 设备有可用摄像头</div>`;
  }
}
async function stopScan(){
  if(!scanner) return;
  scanning = false;
  try{ await scanner.stop(); scanner.clear(); }catch(e){}
  scanner = null;
}
function onScanSuccess(text){
  if(!scanning) return;
  scanning = false;
  const code = String(text).trim();
  if(scanner){ scanner.stop().then(()=>{ try{ scanner.clear(); }catch(e){} scanner = null; }).catch(()=>{ scanner = null; }); }
  setTimeout(() => handleScanResult(code), 140);
}
function handleScanResult(code){
  const p = findByBarcode(code);
  if(!p){
    const { mask, close } = showModal(`
      <div class="modal-title">未找到商品</div>
      <div class="modal-body">条码 ${esc(code)} 尚未录入\n是否立即新增？</div>
      <div class="modal-btns">
        <button data-act="cancel">取消</button>
        <button class="primary" data-act="add">新增商品</button>
      </div>`);
    mask.querySelector('[data-act="cancel"]').onclick = () => { close(); setTimeout(startScan, 280); };
    mask.querySelector('[data-act="add"]').onclick = () => { close(); setTimeout(()=>openAdd(null, code), 240); };
    return;
  }
  if(scanMode === 'query') openDetail(p.id);
  else promptQuantity(p.id, scanMode === 'in' ? 1 : -1);
}

});

let analysisRange = 7;

function renderAnalysis(){
  const el = $('#analysisBody');
  let appleCount = 0, androidCount = 0, otherCount = 0;
  let appleStock = 0, androidStock = 0, otherStock = 0;
  products.forEach(p => {
    const cat = getProductCategory(p);
    if(cat === 'apple'){ appleCount++; appleStock += p.stock || 0; }
    else if(cat === 'android'){ androidCount++; androidStock += p.stock || 0; }
    else { otherCount++; otherStock += p.stock || 0; }
  });
  const totalProducts = products.length;
  const totalStock = products.reduce((s, p) => s + (p.stock || 0), 0);
  const costValue = products.reduce((s, p) => s + (p.stock || 0) * (p.priceIn || 0), 0);
  const saleValue = products.reduce((s, p) => s + (p.stock || 0) * (p.priceOut || 0), 0);
  const lowStockProducts = products.filter(p => p.stock <= p.warnStock);
  const outOfStockProducts = products.filter(p => p.stock <= 0);

  const topByValue = [...products].map(p => ({ ...p, value: (p.stock || 0) * (p.priceIn || 0) }))
    .filter(p => p.value > 0).sort((a, b) => b.value - a.value).slice(0, 5);
  const maxValue = topByValue[0]?.value || 1;
  const topByStock = [...products].filter(p => p.stock > 0).sort((a, b) => b.stock - a.stock).slice(0, 5);
  const maxStock = topByStock[0]?.stock || 1;
  const lowList = lowStockProducts.slice(0, 5);

  const now = Date.now();
  const rangeMs = analysisRange * 24 * 60 * 60 * 1000;
  const rangeRecords = records.filter(r => now - r.time <= rangeMs);
  const totalIn = rangeRecords.filter(r => r.type > 0).reduce((s, r) => s + r.quantity, 0);
  const totalOut = rangeRecords.filter(r => r.type < 0).reduce((s, r) => s + r.quantity, 0);

  const saleRecords = rangeRecords.filter(r => r.type < 0 && r.actualPrice != null);
  const totalRevenue = saleRecords.reduce((s, r) => s + (r.actualPrice || 0) * r.quantity, 0);
  const totalCost = saleRecords.reduce((s, r) => s + (r.priceIn || 0) * r.quantity, 0);
  const grossProfit = totalRevenue - totalCost;

  const dayBuckets = [];
  const dayLabels = [];
  for (let i = analysisRange - 1; i >= 0; i--){
    const dayStart = new Date();
    dayStart.setHours(0,0,0,0);
    dayStart.setDate(dayStart.getDate() - i);
    const start = dayStart.getTime();
    const end = start + 24*60*60*1000;
    const dayIn = records.filter(r => r.type > 0 && r.time >= start && r.time < end).reduce((s, r) => s + r.quantity, 0);
    const dayOut = records.filter(r => r.type < 0 && r.time >= start && r.time < end).reduce((s, r) => s + r.quantity, 0);
    dayBuckets.push({ in: dayIn, out: dayOut });
    const d = new Date(start);
    dayLabels.push(`${d.getMonth()+1}/${d.getDate()}`);
  }
  const maxBarValue = Math.max(1, ...dayBuckets.map(b => Math.max(b.in, b.out)));

  const outMap = {};
  records.filter(r => r.type < 0).forEach(r => {
    outMap[r.productId] = (outMap[r.productId] || 0) + r.quantity;
  });
  const topOut = Object.keys(outMap).map(pid => {
    const p = findProduct(pid);
    return p ? { name: p.name, barcode: p.barcode, qty: outMap[pid] } : null;
  }).filter(Boolean).sort((a, b) => b.qty - a.qty).slice(0, 5);

  const profitMap = {};
  saleRecords.forEach(r => {
    if(!profitMap[r.productId]){
      profitMap[r.productId] = { name: r.productName, barcode: r.barcode, revenue: 0, profit: 0, qty: 0 };
    }
    profitMap[r.productId].revenue += (r.actualPrice || 0) * r.quantity;
    profitMap[r.productId].profit += ((r.actualPrice || 0) - (r.priceIn || 0)) * r.quantity;
    profitMap[r.productId].qty += r.quantity;
  });
  const topProfit = Object.values(profitMap).sort((a, b) => b.profit - a.profit).slice(0, 5);

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">商品种类</div>
        <div class="stat-value blue">${fmtNum(totalProducts)}<span class="stat-unit">种</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">库存总量</div>
        <div class="stat-value green">${fmtNum(totalStock)}<span class="stat-unit">台</span></div>
      </div>
      <div class="stat-card full">
        <div class="stat-label">💰 库存成本价值</div>
        <div class="stat-value orange small">¥${fmtNum(costValue.toFixed(0))}</div>
        <div class="stat-sub">按进货价计算 · 潜在销售额 ¥${fmtNum(saleValue.toFixed(0))}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">低库存</div>
        <div class="stat-value ${lowStockProducts.length > 0 ? 'orange' : 'green'}">${lowStockProducts.length}<span class="stat-unit">款</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">缺货</div>
        <div class="stat-value ${outOfStockProducts.length > 0 ? 'red' : 'green'}">${outOfStockProducts.length}<span class="stat-unit">款</span></div>
      </div>
    </div>

    <div class="analysis-block">
      <div class="analysis-title">分类库存<span class="tag">苹果 / 安卓 / 其他</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;position:relative;z-index:1;">
        <div style="text-align:center;">
          <div class="stat-label" style="justify-content:center;"><span class="cat-badge apple">苹果</span></div>
          <div class="stat-value small blue">${fmtNum(appleStock)}<span class="stat-unit">台</span></div>
          <div class="stat-sub">${appleCount} 款</div>
        </div>
        <div style="text-align:center;">
          <div class="stat-label" style="justify-content:center;"><span class="cat-badge android">安卓</span></div>
          <div class="stat-value small green">${fmtNum(androidStock)}<span class="stat-unit">台</span></div>
          <div class="stat-sub">${androidCount} 款</div>
        </div>
        <div style="text-align:center;">
          <div class="stat-label" style="justify-content:center;"><span class="cat-badge other">其他</span></div>
          <div class="stat-value small">${fmtNum(otherStock)}<span class="stat-unit">台</span></div>
          <div class="stat-sub">${otherCount} 款</div>
        </div>
      </div>
    </div>

    <div class="analysis-block">
      <div class="analysis-title">销售收入<span class="tag">近 ${analysisRange} 天</span></div>
      <div class="time-tabs" id="timeTabs">
        <button data-range="7" class="${analysisRange === 7 ? 'active' : ''}">近 7 天</button>
        <button data-range="30" class="${analysisRange === 30 ? 'active' : ''}">近 30 天</button>
        <button data-range="90" class="${analysisRange === 90 ? 'active' : ''}">近 90 天</button>

          <div class="stat-label">销售总额</div>
          <div class="stat-value small green">¥${fmtNum(totalRevenue.toFixed(0))}</div>

          <div class="stat-label">毛利</div>
          <div class="stat-value small ${grossProfit >= 0 ? 'blue' : 'red'}">¥${fmtNum(grossProfit.toFixed(0))}</div>
        </div>
      </div>
      <div class="stat-sub" style="margin-top:8px;text-align:center;position:relative;z-index:1;">

      </div>
    </div>

    <div class="analysis-block">
      <div class="analysis-title">出入库汇总<span class="tag">近 ${analysisRange} 天</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1;">

          <div class="stat-value small red">-${fmtNum(totalOut)}<span class="stat-unit">台</span></div>

      </div>
      <div class="chart-bars" style="margin-top:14px;">
        ${dayBuckets.map((b, i) => {
          const hIn = b.in > 0 ? Math.max(2, Math.round((b.in / maxBarValue) * 70)) : 0;
          const hOut = b.out > 0 ? Math.max(2, Math.round((b.out / maxBarValue) * 70)) : 0;

          return `<div class="chart-bar-wrap" title="${dayLabels[i]} 入库${b.in} 出库${b.out}">

function downloadImportTemplate(){
  const rows = [
    ['商品名称','品牌','型号','规格','颜色','条码','进货价','销售价','预警值','库存量','备注'],
    ['iPhone 15 Pro Max','Apple','A3108','8+256G','原色钛金属','6901234567890','8000','8999','2','5','示例：可以删除本行'],
    ['华为 Mate 60 Pro','华为','ALN-AL00','12+512G','雅川青','','6500','6999','2','3','条码留空会自动生成'],
    ['小米 14','小米','23127PN0CC','12+256G','黑色','','3899','4299','2','0','']
  ];
  const csv = '\uFEFF' + rows.map(r => r.map(cell => {
    const s = String(cell ?? '');
    if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '商品批量导入模板.csv';

  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('模板已下载');
}

/* ==================== 批量导入商品 ==================== */
function generateInternalBarcode(){
  const ts = String(Date.now()).slice(-8) + String(Math.floor(Math.random()*100)).padStart(2,'0');
  const r = Math.floor(Math.random() * 10);
  return '2' + ts + r;
}
function parseImportText(text){
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if(lines.length === 0) return { rows: [], errors: [] };
  const firstLine = lines[0];
  let sep = ',';
  if(firstLine.includes('\t')) sep = '\t'; else if(firstLine.includes('，')) sep = '，';
  const firstCells = firstLine.split(sep).map(c => c.trim().toLowerCase());
  let startIdx = firstCells.some(c => c.includes('名称') || c === 'name' || c.includes('商品')) ? 1 : 0;
  const rows = []; const errors = [];
  for(let i = startIdx; i < lines.length; i++){
    const cells = lines[i].split(sep).map(c => c.replace(/^\uFEFF/, '').trim());
    if(cells.length < 1 || !cells[0]) continue;
    const [name, brand, model, spec, color, barcode, priceIn, priceOut, warnStock, stock, remark] = cells;
    if(!name){ errors.push({ line: i + 1, msg: '商品名称为空', raw: lines[i] }); continue; }
    const finalBarcode = (barcode && barcode.trim()) ? barcode.trim() : generateInternalBarcode();
    rows.push({ 
      lineNo: i + 1, name, brand: brand || '', model: model || '', spec: spec || '', color: color || '', barcode: finalBarcode, 
      priceIn: parseFloat(priceIn) || 0, priceOut: parseFloat(priceOut) || 0, 
      warnStock: parseInt(warnStock) || 2, stock: parseInt(stock) || 0,
      remark: remark || '', autoBarcode: !(barcode && barcode.trim()) 
    });
  }
  return { rows, errors };
}

/* ==================== 打印条码（系统打印） ==================== */
function printBarcode(p) {
  try {
    const qr = qrcode(0, 'M');
    qr.addData(p.barcode);
    qr.make();
    const qrSvg = qr.createSvgTag(3, 0).replace(/<svg[^>]*>/, '<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">');
    const configLine = buildConfigLine(p);
    const win = window.open('', '_blank');
    win.document.write(`
      <!DOCTYPE html><html><head><meta charset="UTF-8"><title>打印条码 - ${esc(p.name)}</title>
      <style>* { box-sizing: border-box; } body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; padding: 20px; margin: 0; }
      .label { display: inline-block; border: 1px dashed #ccc; padding: 12px 24px; margin: 10px; border-radius: 12px; background: #fff; }
      .name { font-size: 15px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; }
      .config { font-size: 12px; color: #555; margin-bottom: 6px; white-space: nowrap; }
      .qrcode { display: flex; justify-content: center; margin: 8px 0; }
      .qrcode svg { width: 120px; height: 120px; }
      .code { font-family: monospace; font-size: 13px; letter-spacing: 1px; margin-top: 4px; color: #333; }
      @media print { body { padding: 0; } .label { border: none; margin: 0; padding: 8px; } }</style>
      </head><body><div class="label"><div class="name">${esc(p.name)}</div>${configLine ? `<div class="config">${esc(configLine)}</div>` : ''}<div class="qrcode">${qrSvg}</div><div class="code">${esc(p.barcode)}</div></div>
      <script>window.onload = function() { setTimeout(function() { window.print(); }, 200); };<\/script></body></html>`);
    win.document.close();
  } catch (e) { toast('二维码格式不支持生成'); }
}

function buildConfigLine(p){
  const parts = [];
  const bm = [p.brand, p.model].filter(Boolean).join(' ');
  if(bm) parts.push(bm);
  if(p.spec) parts.push(p.spec);
  if(p.color) parts.push(p.color);
  return parts.join(' · ');
}

const B1_LABEL_SIZE = { w_px: 320, h_px: 240, offset_y_px: 0 };

function generateLabelCanvas(product) {
  const canvas = document.createElement('canvas');
  canvas.width = B1_LABEL_SIZE.w_px;
  canvas.height = B1_LABEL_SIZE.h_px;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  function fitTextToBox(text, maxWidth, maxHeight, fontWeight = 'normal', maxFontSize = 100) {
    let fontSize = Math.min(maxHeight, maxFontSize);
    let font = `${fontWeight} ${fontSize}px sans-serif`;
    ctx.font = font;
    while (fontSize > 8) {
      if (ctx.measureText(text).width <= maxWidth && fontSize <= maxHeight) {
        return { font: `${fontWeight} ${fontSize}px sans-serif`, size: fontSize };
      }
      fontSize--;
      ctx.font = `${fontWeight} ${fontSize}px sans-serif`;
    }
    return { font: `${fontWeight} 8px sans-serif`, size: 8 };
  }
  const padding = 8;
  const nameText = product.name || '';
  const nameH = 36;
  const nameFit = fitTextToBox(nameText, canvas.width - padding * 2, nameH, 'bold', 22);
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = nameFit.font;
  ctx.fillText(nameText, canvas.width / 2, padding + nameH / 2);
  const barcodeText = product.barcode || '';
  const codeH = 24;
  const codeY = canvas.height - codeH - padding;
  const codeFit = fitTextToBox(barcodeText, canvas.width - padding * 2, codeH, 'normal', 18);
  ctx.font = codeFit.font;
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(barcodeText, canvas.width / 2, codeY + codeH / 2);
  const midY = padding + nameH;
  const midH = codeY - midY;
  const infoLines = [];
  const bm = [product.brand, product.model].filter(Boolean).join(' ');
  if (bm) infoLines.push(bm);
  const sc = [product.spec, product.color].filter(Boolean).join(' / ');
  if (sc) infoLines.push(sc);
  if (product.remark) infoLines.push(product.remark);
  const qrSize = 110;
  const qrX = padding;
  const qrY = midY + (midH - qrSize) / 2;
  try {
    const qr = qrcode(0, 'M');
    qr.addData(barcodeText);
    qr.make();
    const qrCount = qr.getModuleCount();
    const cellSize = Math.floor(qrSize / qrCount);
    const actualQrSize = cellSize * qrCount;
    const offsetX = qrX + (qrSize - actualQrSize) / 2;
    const offsetY = qrY + (qrSize - actualQrSize) / 2;
    const qrCanvas = document.createElement('canvas');
    qrCanvas.width = actualQrSize;
    qrCanvas.height = actualQrSize;
    const qrCtx = qrCanvas.getContext('2d');
    qrCtx.fillStyle = '#FFFFFF';
    qrCtx.fillRect(0, 0, actualQrSize, actualQrSize);
    qrCtx.fillStyle = '#000000';
    for (let row = 0; row < qrCount; row++) {
      for (let col = 0; col < qrCount; col++) {
        if (qr.isDark(row, col)) {
          qrCtx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }
    ctx.drawImage(qrCanvas, offsetX, offsetY);
  } catch (e) {}
  if (infoLines.length > 0) {
    const textX = qrX + qrSize + 8;
    const textW = canvas.width - textX - padding;
    const lineHeight = midH / infoLines.length;
    infoLines.forEach((lineText, index) => {
      const lineY = midY + index * lineHeight;
      const textFit = fitTextToBox(lineText, textW, lineHeight * 0.8, 'normal', 20);
      ctx.font = textFit.font;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      ctx.fillText(lineText, textX, lineY + lineHeight / 2);
    });
  }
  return canvas;
}

async function blePrint(product) {
  if (!navigator.bluetooth) { toast('当前浏览器不支持蓝牙，请用安卓 Chrome 或 Edge'); return; }
  if (typeof Niimbot === 'undefined') { toast('蓝牙驱动未加载，请检查网络后刷新页面'); return; }
  const canvas = generateLabelCanvas(product);
  const dataUrl = canvas.toDataURL('image/png');
  toast('正在连接打印机...');
  try {
    const model = { name_prefixes: ['B1'], task: 'b1', density: 3, label_type: 1, speed: 1 };
    await Niimbot.printImage(dataUrl, { model: model, size: B1_LABEL_SIZE });
    toast('打印指令已发送');
  } catch (e) {
    console.error('蓝牙打印失败', e);
    if (e.name === 'NotFoundError') toast('未选择打印机，已取消');
    else if (e.name === 'SecurityError') toast('需要 HTTPS 才能使用蓝牙');
    else toast('打印失败：' + (e.message || '请重试'));
  }
}

function showPrintPreview(product) {
  const canvas = generateLabelCanvas(product);
  const dataUrl = canvas.toDataURL('image/png');
  const { mask, close } = showModal(`
    <div class="modal-title">打印预览</div>
    <div style="text-align:center; padding:14px; background:rgba(120,120,128,.06); border-radius:16px; margin-bottom:16px;">
      <img src="${dataUrl}" style="max-width:100%; height:auto; display:block; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.12);">
    </div>
    <div style="font-size:12.5px; color:var(--text2); text-align:center; margin-bottom:16px; line-height:1.7; letter-spacing:-.1px;">
      当前标签尺寸：40mm × 30mm<br>如果预览显示正常，可直接打印
    </div>
    <div class="modal-btns">
      <button data-act="cancel">取消</button>
      <button class="primary" data-act="print">立即打印</button>
    </div>`);
  mask.querySelector('[data-act="cancel"]').onclick = close;
  mask.querySelector('[data-act="print"]').onclick = () => {

}

function saveBarcodeImage(p) {
  const canvas = generateLabelCanvas(p);
  canvas.toBlob(blob => {
    if (!blob) { toast('生成图片失败'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `标签_${(p.name||'').replace(/[\\/:*?"<>|]/g,'_')}_${p.barcode}.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('已下载标签图片');
  }, 'image/png');
}

async function batchDownloadBarcodes() {
  if (products.length === 0) { toast('还没有商品，无法下载'); return; }
  if (typeof JSZip === 'undefined') { toast('打包组件未加载，请检查网络后刷新'); return; }
  const nameCount = {};
  const { mask, close } = showModal(`
    <div class="modal-title">批量下载标签</div>
    <div class="modal-body">正在生成 ${products.length} 张标签图片...<div id="batchProgress" style="margin-top:10px;font-size:13px;color:var(--text2);">准备中</div></div>`);
  const progressEl = mask.querySelector('#batchProgress');
  const zip = new JSZip(); const folder = zip.folder('标签图片');
  let ok = 0, fail = 0;
  for (let i = 0; i < products.length; i++) {
    const p = products[i];
    progressEl.textContent = `正在处理 ${i + 1} / ${products.length}：${p.name}`;
    try {
      const canvas = generateLabelCanvas(p);
      const safeName = (p.name || '未命名').replace(/[\\/:*?"<>|]/g, '_').slice(0, 30);
      const safeCode = (p.barcode || 'nocode').replace(/[\\/:*?"<>|]/g, '_');
      let baseName = `${safeName}_${safeCode}`;
      if (nameCount[baseName]) { nameCount[baseName]++; baseName = `${baseName}(${nameCount[baseName]})`; } else { nameCount[baseName] = 1; }
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (blob) { folder.file(`${baseName}.png`, blob); ok++; } else { fail++; }
    } catch (e) { fail++; }
    if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
  }
  progressEl.textContent = '正在打包 ZIP...';
  try {
    const zipBlob = await zip.generateAsync({ type: 'blob' }, meta => { progressEl.textContent = `正在打包... ${Math.round(meta.percent)}%`; });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    a.href = url; a.download = `标签打包_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.zip`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    close(); toast(`已完成：成功 ${ok} 张${fail ? `，失败 ${fail} 张` : ''}`);
  } catch (e) { console.error(e); close(); toast('打包失败，请重试'); }
}
$('#btnBatchBarcode').addEventListener('click', batchDownloadBarcodes);

function openBatchPrint(){
  if (products.length === 0) { toast('还没有商品，无法打印'); return; }
  const sortedProducts = [...products].sort((a,b) => b.createdAt - a.createdAt);
  const { mask, close } = showModal(`
    <div class="modal-title">批量打印标签</div>
    <div class="bp-toolbar">
      <label><input type="checkbox" id="bpSelectAll" checked> 全选</label>
      <span style="flex:1;text-align:right;color:var(--text2);">已选 <b id="bpCount">${sortedProducts.length}</b> / ${sortedProducts.length}</span>
    </div>
    <div class="bp-list" id="bpList">
      ${sortedProducts.map(p => `
        <label class="bp-item">
          <input type="checkbox" class="bp-check" data-id="${esc(p.id)}" checked>
          <span class="bp-name">${esc(p.name)}</span>
          <span class="bp-code">${esc(p.barcode)}</span>
        </label>
      `).join('')}
    </div>
    <div class="modal-btns" style="margin-top:16px;">
      <button data-act="cancel">取消</button>
      <button class="primary" data-act="print" id="bpStartBtn">开始打印 ${sortedProducts.length} 张</button>
    </div>`);
  const checkAll = mask.querySelector('#bpSelectAll');
  const checkboxes = mask.querySelectorAll('.bp-check');
  const countEl = mask.querySelector('#bpCount');
  const startBtn = mask.querySelector('#bpStartBtn');
  function updateCount(){
    const checked = [...checkboxes].filter(c => c.checked).length;
    countEl.textContent = checked;
    startBtn.textContent = `开始打印 ${checked} 张`;
    startBtn.disabled = checked === 0;
    checkAll.checked = checked === checkboxes.length && checked > 0;
    checkAll.indeterminate = checked > 0 && checked < checkboxes.length;
  }
  checkAll.onchange = () => {
    checkboxes.forEach(c => { c.checked = checkAll.checked; });
    updateCount();
  };
  checkboxes.forEach(c => { c.onchange = updateCount; });
  mask.querySelector('[data-act="cancel"]').onclick = close;
  startBtn.onclick = () => {
    const ids = [...checkboxes].filter(c => c.checked).map(c => c.dataset.id);
    if(ids.length === 0){ toast('请至少选择一个商品'); return; }
    close();
    setTimeout(() => startBatchPrint(ids), 280);
  };
}

async function startBatchPrint(ids){
  if (!navigator.bluetooth) { toast('当前浏览器不支持蓝牙，请用安卓 Chrome 或 Edge'); return; }
  if (typeof Niimbot === 'undefined') { toast('蓝牙驱动未加载，请检查网络后刷新页面'); return; }
  const { mask, close } = showModal(`
    <div class="modal-title">正在批量打印</div>
    <div class="bp-progress">
      <div id="bpProgressText">准备中...</div>
      <div class="bp-bar"><div class="bp-bar-inner" id="bpBarInner"></div></div>
      <div style="font-size:12.5px;color:var(--text2);margin-top:12px;">请不要关闭页面，也不要锁屏</div>
    </div>`);
  const textEl = mask.querySelector('#bpProgressText');
  const barEl = mask.querySelector('#bpBarInner');
  let ok = 0, fail = 0;
  const model = { name_prefixes: ['B1'], task: 'b1', density: 3, label_type: 1, speed: 1 };
  for (let i = 0; i < ids.length; i++){
    const p = findProduct(ids[i]);
    if(!p){ fail++; continue; }
    textEl.textContent = `正在打印 ${i + 1} / ${ids.length}：${p.name}`;
    barEl.style.width = `${Math.round(((i) / ids.length) * 100)}%`;
    try {
      const canvas = generateLabelCanvas(p);
      const dataUrl = canvas.toDataURL('image/png');
      await Niimbot.printImage(dataUrl, { model: model, size: B1_LABEL_SIZE });
      ok++;
    } catch (e){
      console.error('第 ' + (i+1) + ' 张打印失败', e);
      fail++;
      if (e.name === 'NotFoundError' || e.name === 'SecurityError') {
        toast('已取消打印');
        break;
      }
    }
    await new Promise(r => setTimeout(r, 400));
  }
  barEl.style.width = '100%';
  textEl.textContent = '打印完成';
  await new Promise(r => setTimeout(r, 800));
  close();
  if (fail === 0) {
    toast(`批量打印完成：共 ${ok} 张`);
  } else {
    toast(`完成：成功 ${ok} 张，失败 ${fail} 张`);
  }
}

$('#btnBatchPrint').addEventListener('click', openBatchPrint);
