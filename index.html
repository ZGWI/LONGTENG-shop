<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<title>龙腾手机库存</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/niimbot-web-bluetooth@2.6.0/src/niimbot.js"></script>
<style>
/* ==================== iOS 26 Liquid Glass 设计系统 ==================== */
:root{
  --ios-blue:#007AFF;
  --ios-blue-dark:#0051D5;
  --ios-green:#34C759;
  --ios-red:#FF3B30;
  --ios-orange:#FF9500;
  --ios-purple:#AF52DE;
  --ios-pink:#FF2D55;
  --ios-indigo:#5856D6;

  --text:#1C1C1E;
  --text2:rgba(60,60,67,.6);
  --text3:rgba(60,60,67,.3);

  --bg-system:#F2F2F7;
  --bg-elevated:rgba(255,255,255,.72);
  --bg-card:rgba(255,255,255,.78);
  --bg-input:rgba(120,120,128,.12);

  --separator:rgba(60,60,67,.29);
  --separator-soft:rgba(60,60,67,.12);

  --glass-border:rgba(255,255,255,.6);
  --glass-highlight:rgba(255,255,255,.9);

  --radius-lg:28px;
  --radius:22px;
  --radius-sm:16px;
  --radius-xs:12px;

  --shadow-1:0 1px 2px rgba(0,0,0,.04), 0 1px 4px rgba(0,0,0,.04);
  --shadow-2:0 2px 8px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --shadow-3:0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
  --shadow-blue:0 8px 24px rgba(0,122,255,.32), 0 2px 6px rgba(0,122,255,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#C7C7CC;
  color:var(--text);font-size:15px;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.01em;
}
/* 背景装饰光斑 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 0%, rgba(0,122,255,.15), transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(175,82,222,.12), transparent 60%),
    radial-gradient(ellipse 50% 30% at 0% 100%, rgba(52,199,89,.08), transparent 60%);
}
#app{
  max-width:640px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  background:linear-gradient(180deg, #F7F8FC 0%, #F2F2F7 100%);
  box-shadow:0 0 60px rgba(0,0,0,.1);
  z-index:1;
}

/* ==================== 顶栏：毛玻璃 ==================== */
#topbar{
  height:58px;flex:none;display:flex;align-items:center;
  padding:0 8px;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:.5px solid var(--separator-soft);
  z-index:10;position:relative;
}
#topbar .tb-btn{
  width:40px;height:40px;border:0;background:transparent;
  color:var(--ios-blue);font-size:19px;
  border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  font-weight:500;
}
#topbar .tb-btn:active{background:rgba(120,120,128,.12);transform:scale(.94);}
#topbar .tb-btn.hidden{visibility:hidden;}
#topbar h1{
  flex:1;text-align:center;font-size:17px;margin:0;
  font-weight:600;letter-spacing:-.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:6px;
}

/* ==================== 主体 ==================== */
#main{flex:1;position:relative;overflow:hidden;}
.view{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:none;padding-bottom:24px;
  animation:viewIn .28s cubic-bezier(.4,0,.2,1);
}
.view.active{display:block;}
@keyframes viewIn{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

/* ==================== 底部导航：毛玻璃 ==================== */
#tabbar{
  flex:none;height:58px;display:flex;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:.5px solid var(--separator-soft);
  z-index:10;position:relative;
  padding-bottom:env(safe-area-inset-bottom,0);
}
#tabbar.hidden{display:none;}
#tabbar button{
  flex:1;border:0;background:transparent;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;color:var(--text2);cursor:pointer;
  padding:4px 0;position:relative;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  font-weight:500;letter-spacing:-.2px;
}
#tabbar button .ic{
  font-size:22px;line-height:1;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  filter:grayscale(.6);
  opacity:.7;
}
#tabbar button.active{color:var(--ios-blue);font-weight:600;}
#tabbar button.active .ic{
  transform:scale(1.08);
  filter:none;opacity:1;
}

/* ==================== 搜索框 ==================== */
.search-wrap{padding:12px 16px 8px;position:relative;}
.search-wrap input{
  width:100%;height:38px;
  border:0;border-radius:12px;
  padding:0 16px 0 38px;font-size:16px;
  background:var(--bg-input);
  outline:none;color:var(--text);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  font-weight:400;letter-spacing:-.2px;
}
.search-wrap input::placeholder{color:var(--text3);}
.search-wrap input:focus{
  background:rgba(120,120,128,.16);
  box-shadow:0 0 0 4px rgba(0,122,255,.12);
}
.search-wrap::before{
  content:"";position:absolute;left:28px;top:50%;
  transform:translateY(-60%);
  width:15px;height:15px;
  background:
    radial-gradient(circle at 50% 50%, transparent 4.5px, rgba(60,60,67,.5) 4.5px, rgba(60,60,67,.5) 5.5px, transparent 5.5px);
  pointer-events:none;
  z-index:1;
}
.search-wrap::after{
  content:"";position:absolute;left:40px;top:58%;width:5px;height:1.5px;
  background:rgba(60,60,67,.5);transform:rotate(45deg);
  border-radius:2px;pointer-events:none;z-index:1;
}

/* ==================== 商品列表 ==================== */
.list{padding:6px 16px 100px;}
.card{
  background:var(--bg-card);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:10px;
  border:.5px solid var(--glass-border);
  box-shadow:var(--shadow-2);
  cursor:pointer;
  transition:all .22s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
/* 边缘高光 */
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 40%);
  opacity:.5;
}
.card:active{transform:scale(.98);box-shadow:var(--shadow-1);}
.product-item{display:flex;gap:12px;align-items:flex-start;position:relative;z-index:1;}
.pi-main{flex:1;min-width:0;}
.pi-name{
  font-size:16px;font-weight:600;margin-bottom:4px;
  color:var(--text);letter-spacing:-.3px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pi-sub{
  font-size:13px;color:var(--text2);margin-bottom:6px;
  letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pi-code{
  font-size:11.5px;color:var(--text2);
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pi-right{
  flex:none;display:flex;flex-direction:column;
  gap:6px;align-items:flex-end;
}
.pi-stock{
  font-size:13px;font-weight:600;
  padding:4px 11px;border-radius:100px;
  background:rgba(52,199,89,.14);color:var(--ios-green);
  letter-spacing:-.1px;
}
.pi-stock.ok{background:rgba(52,199,89,.14);color:var(--ios-green);}
.pi-stock.warn{background:rgba(255,149,0,.14);color:var(--ios-orange);}
.pi-stock.danger{background:rgba(255,59,48,.14);color:var(--ios-red);}
.pi-price{
  font-size:15px;color:var(--ios-blue);
  font-weight:700;letter-spacing:-.3px;
}

/* ==================== 空状态 ==================== */
.empty{
  text-align:center;color:var(--text2);font-size:14px;
  padding:80px 24px;line-height:2;letter-spacing:-.2px;
}
.empty b{color:var(--ios-blue);font-weight:600;}

/* ==================== FAB ==================== */
.fab{
  position:fixed;right:calc(50% - 320px + 20px);bottom:82px;
  width:56px;height:56px;border-radius:50%;border:0;
  background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%);
  color:#fff;font-size:30px;line-height:1;font-weight:300;
  box-shadow:var(--shadow-blue);
  cursor:pointer;z-index:9;
  display:flex;align-items:center;justify-content:center;
  transition:all .22s cubic-bezier(.4,0,.2,1);
  position:fixed;
}
@media (max-width:676px){ .fab{right:20px;} }
.fab:active{transform:scale(.9);box-shadow:0 4px 12px rgba(0,122,255,.24);}
.fab::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 50%);
  pointer-events:none;
}

/* ==================== 表单 ==================== */
.form-body{padding:20px 16px 60px;}
.field{margin-bottom:18px;flex:1;min-width:0;}
.field label{
  display:block;font-size:13px;color:var(--text2);
  margin-bottom:6px;font-weight:500;letter-spacing:-.1px;
  padding-left:4px;
}
.field .req{color:var(--ios-red);}
.field input,.field textarea{
  width:100%;border:0;border-radius:12px;
  padding:11px 14px;font-size:16px;
  background:var(--bg-input);outline:none;
  font-family:inherit;color:var(--text);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  font-weight:400;letter-spacing:-.2px;
}
.field input::placeholder,.field textarea::placeholder{color:var(--text3);}
.field input:focus,.field textarea:focus{
  background:rgba(120,120,128,.16);
  box-shadow:0 0 0 4px rgba(0,122,255,.12);
}
.field input:disabled{background:rgba(120,120,128,.08);color:var(--text3);cursor:not-allowed;}
.row2{display:flex;gap:12px;}
.input-with-actions{display:flex;gap:8px;align-items:center;}
.input-with-actions input{flex:1;min-width:0;}
.mini-btn{
  flex:none;height:38px;padding:0 16px;border:0;
  background:rgba(0,122,255,.1);color:var(--ios-blue);
  border-radius:12px;font-size:14px;font-weight:500;
  cursor:pointer;white-space:nowrap;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  letter-spacing:-.2px;
}
.mini-btn:active{background:rgba(0,122,255,.2);transform:scale(.96);}
.btn-primary{
  width:100%;height:50px;border:0;border-radius:14px;
  background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%);
  color:#fff;font-size:17px;font-weight:600;
  cursor:pointer;margin-top:14px;
  letter-spacing:-.3px;
  box-shadow:var(--shadow-blue);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.btn-primary::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%);
  pointer-events:none;
}
.btn-primary:active{transform:scale(.98);box-shadow:0 4px 12px rgba(0,122,255,.24);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn-plain{
  width:100%;height:46px;border:0;
  background:rgba(120,120,128,.12);
  color:var(--text);font-size:16px;font-weight:500;
  border-radius:12px;cursor:pointer;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  letter-spacing:-.2px;
}
.btn-plain:active{background:rgba(120,120,128,.2);transform:scale(.98);}

/* ==================== 商品详情 ==================== */
.detail-body{padding:20px 16px 60px;}
.d-name{
  font-size:26px;font-weight:700;
  margin:0 0 4px;letter-spacing:-.7px;line-height:1.2;
}
.d-sub{font-size:14px;color:var(--text2);margin-bottom:12px;letter-spacing:-.2px;}
.d-badge{
  display:inline-block;font-size:14px;font-weight:600;
  padding:6px 16px;border-radius:100px;
  background:rgba(52,199,89,.14);color:var(--ios-green);
  letter-spacing:-.2px;
}
.d-badge.ok{background:rgba(52,199,89,.14);color:var(--ios-green);}
.d-badge.warn{background:rgba(255,149,0,.14);color:var(--ios-orange);}
.d-badge.danger{background:rgba(255,59,48,.14);color:var(--ios-red);}
.barcode-box{
  background:var(--bg-card);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-radius:var(--radius);padding:22px;
  margin:18px 0;text-align:center;
  border:.5px solid var(--glass-border);
  box-shadow:var(--shadow-2);
  position:relative;overflow:hidden;
}
.barcode-box::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 50%);
  pointer-events:none;opacity:.5;
}
.barcode-box svg{width:100%;height:auto;max-height:140px;display:block;position:relative;z-index:1;}
.barcode-box img{max-width:160px;height:auto;display:block;margin:0 auto;position:relative;z-index:1;}
.barcode-text{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:13px;letter-spacing:1.5px;
  margin-top:10px;color:var(--text2);
  position:relative;z-index:1;
}
.d-actions{display:flex;gap:12px;margin-bottom:14px;}
.d-actions button{
  flex:1;height:50px;border:0;border-radius:14px;
  font-size:16px;font-weight:600;cursor:pointer;
  letter-spacing:-.2px;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.d-actions button::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%);
  pointer-events:none;
}
.d-actions button:active{transform:scale(.98);}
.btn-in{
  background:linear-gradient(180deg,#40D86E 0%,#34C759 100%);
  color:#fff;
  box-shadow:0 8px 24px rgba(52,199,89,.32),0 2px 6px rgba(52,199,89,.16);
}
.btn-out{
  background:rgba(255,255,255,.9);
  color:var(--ios-red);
  box-shadow:var(--shadow-1);
  border:.5px solid rgba(255,59,48,.2)!important;
}
.d-mini{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.d-mini button{
  flex:1;min-width:76px;height:40px;
  border:0;background:rgba(255,255,255,.9);
  border-radius:12px;
  font-size:12.5px;color:var(--text);cursor:pointer;
  font-weight:500;letter-spacing:-.2px;
  box-shadow:var(--shadow-1);
  transition:all .18s cubic-bezier(.4,0,.2,1);
}
.d-mini button:active{transform:scale(.96);box-shadow:none;}
.btn-ble{
  background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%)!important;
  color:#fff!important;
  font-weight:600!important;
  box-shadow:var(--shadow-blue)!important;
}
.section-title{
  font-size:13px;font-weight:600;
  margin:24px 0 10px;color:var(--text2);
  letter-spacing:.2px;
  padding-left:4px;
  text-transform:uppercase;
}
.info-box{
  background:var(--bg-card);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-radius:var(--radius);padding:16px 18px;
  font-size:15px;line-height:2;
  border:.5px solid var(--glass-border);
  box-shadow:var(--shadow-2);
  letter-spacing:-.2px;
}
.info-box b{color:var(--text2);font-weight:400;display:inline-block;min-width:68px;}
.info-box > div + div{border-top:.5px solid var(--separator-soft);padding-top:6px;margin-top:6px;}

/* ==================== 出入库记录 ==================== */
.rec-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;
  border-bottom:.5px solid var(--separator-soft);
}
.rec-item:last-child{border-bottom:0;}
.rec-type{
  flex:none;padding:3px 10px;border-radius:8px;
  font-size:11.5px;font-weight:700;letter-spacing:.2px;
}
.rec-type.in{color:var(--ios-green);background:rgba(52,199,89,.14);}
.rec-type.out{color:var(--ios-red);background:rgba(255,59,48,.14);}
.rec-main{flex:1;min-width:0;}
.rec-name{
  font-size:14.5px;font-weight:500;
  letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rec-time{font-size:12px;color:var(--text2);margin-top:2px;letter-spacing:-.1px;}
.rec-qty{
  flex:none;font-size:16px;font-weight:700;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  letter-spacing:-.3px;
}
.rec-qty.in{color:var(--ios-green);}
.rec-qty.out{color:var(--ios-red);}

/* ==================== 扫码 ==================== */
.scan-tabs{
  display:flex;gap:6px;padding:14px 16px 12px;
  background:rgba(120,120,128,.08);
  border-radius:12px;margin:12px 16px 0;
}
.scan-tabs button{
  flex:1;height:34px;border:0;background:transparent;
  border-radius:9px;font-size:13.5px;color:var(--text);
  cursor:pointer;font-weight:500;letter-spacing:-.2px;
  transition:all .22s cubic-bezier(.4,0,.2,1);
}
.scan-tabs button:active{transform:scale(.96);}
.scan-tabs button.active{
  background:#fff;
  color:var(--text);
  font-weight:600;
  box-shadow:0 3px 8px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
.scan-reader{
  width:calc(100% - 32px);
  margin:0 16px;
  min-height:280px;
  background:#000;
  border-radius:var(--radius);
  overflow:hidden;position:relative;
  box-shadow:var(--shadow-3);
}
.scan-reader video{width:100%!important;height:auto!important;}
.scan-tip{
  text-align:center;font-size:13.5px;color:var(--text2);
  padding:14px 24px;line-height:1.7;letter-spacing:-.2px;
}

/* ==================== 弹窗 ==================== */
.modal-mask{
  position:fixed;inset:0;
  background:rgba(0,0,0,.32);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;transition:opacity .24s cubic-bezier(.4,0,.2,1);
}
.modal-mask.show{opacity:1;}
.modal{
  width:100%;max-width:360px;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-radius:24px;
  padding:22px;
  transform:scale(.92);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  max-height:85vh;overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.24),0 0 0 .5px rgba(255,255,255,.6) inset;
  border:.5px solid rgba(255,255,255,.6);
}
.modal-mask.show .modal{transform:scale(1);}
.modal-title{
  font-size:17px;font-weight:600;
  margin-bottom:10px;text-align:center;
  color:var(--text);letter-spacing:-.3px;
}
.modal-body{
  font-size:14px;color:var(--text2);
  line-height:1.7;margin-bottom:18px;
  text-align:center;white-space:pre-line;
  letter-spacing:-.2px;
}
.modal-input{
  width:100%;height:44px;border:0;border-radius:12px;
  padding:0 14px;font-size:16px;
  background:var(--bg-input);
  outline:none;margin-bottom:10px;
  transition:all .2s;color:var(--text);
  font-family:inherit;letter-spacing:-.2px;
}
.modal-input:focus{
  background:rgba(120,120,128,.16);
  box-shadow:0 0 0 4px rgba(0,122,255,.12);
}
.modal-btns{display:flex;gap:8px;margin-top:8px;}
.modal-btns button{
  flex:1;height:46px;border-radius:12px;font-size:16px;
  cursor:pointer;border:0;
  background:rgba(120,120,128,.12);
  color:var(--text);font-weight:500;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  letter-spacing:-.3px;
}
.modal-btns button:active{transform:scale(.97);background:rgba(120,120,128,.2);}
.modal-btns button.primary{
  background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%);
  color:#fff;font-weight:600;
  box-shadow:0 6px 16px rgba(0,122,255,.28);
}
.modal-btns button.primary:active{box-shadow:0 2px 8px rgba(0,122,255,.2);}

/* ==================== Toast ==================== */
.toast{
  position:fixed;left:50%;bottom:110px;
  transform:translateX(-50%) translateY(16px) scale(.94);
  background:rgba(30,30,32,.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  color:#fff;font-size:14px;font-weight:500;
  padding:12px 22px;border-radius:100px;
  z-index:200;opacity:0;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  max-width:80vw;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.32);
  letter-spacing:-.2px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}

/* ==================== 批量导入 ==================== */
.import-tip{
  font-size:12.5px;color:var(--text2);
  background:rgba(0,122,255,.08);
  border-radius:12px;padding:12px 14px;
  line-height:1.7;margin-bottom:12px;
  letter-spacing:-.1px;
}
.import-tip code{
  background:rgba(255,255,255,.9);
  color:var(--ios-blue);
  padding:2px 6px;border-radius:5px;
  font-size:11px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
}
.import-area{
  width:100%;min-height:140px;max-height:280px;
  border:0;border-radius:12px;
  padding:12px;font-size:12.5px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  background:var(--bg-input);
  outline:none;resize:vertical;
  transition:all .2s;
  letter-spacing:-.1px;line-height:1.6;
}
.import-area:focus{
  background:rgba(120,120,128,.16);
  box-shadow:0 0 0 4px rgba(0,122,255,.12);
}
.import-preview{
  max-height:220px;overflow-y:auto;
  border:0;border-radius:12px;
  margin-top:12px;font-size:12.5px;
  background:rgba(120,120,128,.06);
}
.import-preview .row{
  display:flex;gap:8px;padding:8px 12px;
  border-bottom:.5px solid var(--separator-soft);
  align-items:center;
}
.import-preview .row:last-child{border-bottom:0;}
.import-preview .row .n{
  flex:1;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-weight:500;letter-spacing:-.1px;
}
.import-preview .row .c{
  color:var(--text2);
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:11px;
}
.import-preview .row.err{background:rgba(255,59,48,.08);color:var(--ios-red);}
.tpl-btn{
  width:100%;height:44px;border:0;
  border-radius:12px;
  background:rgba(0,122,255,.1);
  color:var(--ios-blue);
  font-size:14px;font-weight:600;
  cursor:pointer;margin-bottom:12px;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  letter-spacing:-.2px;
}
.tpl-btn:active{background:rgba(0,122,255,.2);transform:scale(.98);}

/* ==================== 批量打印 ==================== */
.bp-toolbar{
  display:flex;gap:8px;align-items:center;
  padding:10px 14px;
  background:rgba(120,120,128,.08);
  border-radius:12px;margin-bottom:10px;
  font-size:13.5px;
}
.bp-toolbar label{
  display:flex;align-items:center;gap:6px;
  cursor:pointer;user-select:none;
  font-weight:500;letter-spacing:-.2px;
}
.bp-list{
  max-height:320px;overflow-y:auto;
  border-radius:12px;
  background:rgba(120,120,128,.06);
}
.bp-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;
  border-bottom:.5px solid var(--separator-soft);
  font-size:14px;transition:background .15s;
  letter-spacing:-.2px;cursor:pointer;
}
.bp-item:hover{background:rgba(120,120,128,.06);}
.bp-item:last-child{border-bottom:0;}
.bp-item input[type="checkbox"]{
  width:20px;height:20px;flex:none;
  cursor:pointer;accent-color:var(--ios-blue);
  border-radius:50%;
}
.bp-item .bp-name{
  flex:1;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-weight:500;
}
.bp-item .bp-code{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:11px;color:var(--text2);flex:none;
}
.bp-progress{
  text-align:center;padding:20px 0;
  font-size:14.5px;color:var(--text);line-height:1.8;
  letter-spacing:-.2px;font-weight:500;
}
.bp-progress .bp-bar{
  height:6px;background:rgba(120,120,128,.16);
  border-radius:3px;overflow:hidden;margin-top:14px;
}
.bp-progress .bp-bar-inner{
  height:100%;
  background:linear-gradient(90deg,#3395FF,#007AFF);
  width:0;transition:width .4s cubic-bezier(.4,0,.2,1);
  border-radius:3px;
}

/* 小屏幕微调 */
@media (max-width:480px){
  .d-name{font-size:24px;}
  .field input,.field textarea{font-size:16px;}
  .modal{max-width:100%;}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="tb-btn hidden" id="btnBack">‹</button>
    <h1 id="tbTitle">龙腾手机库存</h1>
    <button class="tb-btn hidden" id="tbRight">⋯</button>
  </header>

  <main id="main">
    <section id="view-list" class="view active">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索">
      </div>
      <div id="productList" class="list"></div>
    </section>

    <section id="view-add" class="view">
      <div class="form-body">
        <div class="field"><label>商品名称 <span class="req">*</span></label><input id="fName" type="text" placeholder="如 iPhone 15 Pro Max"></div>
        <div class="row2">
          <div class="field"><label>品牌</label><input id="fBrand" placeholder="Apple"></div>
          <div class="field"><label>型号</label><input id="fModel" placeholder="A3108"></div>
        </div>
        <div class="row2">
          <div class="field"><label>规格</label><input id="fSpec" placeholder="8G+256G"></div>
          <div class="field"><label>颜色</label><input id="fColor" placeholder="原色钛金属"></div>
        </div>
        <div class="field">
          <label>商品条码 <span class="req">*</span></label>
          <div class="input-with-actions">
            <input id="fBarcode" placeholder="扫描 / 输入 / 生成">
            <button type="button" class="mini-btn" id="btnScanBarcode">扫描</button>
            <button type="button" class="mini-btn" id="btnGenBarcode">生成</button>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>进货价</label><input id="fPriceIn" type="number" inputmode="decimal" placeholder="0.00"></div>
          <div class="field"><label>销售价</label><input id="fPriceOut" type="number" inputmode="decimal" placeholder="0.00"></div>
        </div>
        <div class="row2">
          <div class="field"><label id="lbStock">初始库存</label><input id="fStock" type="number" inputmode="numeric" value="0"></div>
          <div class="field"><label>预警值</label><input id="fWarn" type="number" inputmode="numeric" value="2"></div>
        </div>
        <div class="field"><label>备注</label><textarea id="fRemark" rows="2" placeholder="可选"></textarea></div>
        <button class="btn-primary" id="btnSaveProduct">保存</button>
      </div>
    </section>

    <section id="view-detail" class="view">
      <div class="detail-body" id="detailBody"></div>
    </section>

    <section id="view-scan" class="view">
      <div class="scan-tabs">
        <button data-mode="query" class="active">扫码查询</button>
        <button data-mode="in">扫码入库</button>
        <button data-mode="out">扫码出库</button>
      </div>
      <div id="reader" class="scan-reader" style="margin-top:14px;"></div>
      <div class="scan-tip" id="scanTip">将条形码 / 二维码放入取景框内</div>
    </section>

    <section id="view-records" class="view">
      <div style="padding:16px;">
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="mini-btn" id="btnExport" style="flex:1;height:42px;">导出备份</button>
          <button class="mini-btn" id="btnImport" style="flex:1;height:42px;">导入备份</button>
          <button class="mini-btn" id="btnClearAll" style="flex:1;height:42px;background:rgba(255,59,48,.1);color:var(--ios-red);">清空数据</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="mini-btn" id="btnBatchImport" style="flex:1;height:42px;background:rgba(52,199,89,.12);color:var(--ios-green);">批量导入商品</button>
          <button class="mini-btn" id="btnBatchBarcode" style="flex:1;height:42px;">批量下载条码</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <button class="mini-btn" id="btnBatchPrint" style="flex:1;height:42px;background:rgba(175,82,222,.12);color:var(--ios-purple);font-weight:600;">🖨 批量打印标签</button>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none">
        <div class="section-title">全部出入库流水</div>
        <div class="card" style="padding:6px 16px;cursor:default;position:relative;z-index:1;">
          <div id="recordList"></div>
        </div>
      </div>
    </section>
  </main>

  <nav id="tabbar">
    <button data-tab="list" class="active"><span class="ic">📦</span>库存</button>
    <button data-tab="scan"><span class="ic">📷</span>扫码</button>
    <button data-tab="records"><span class="ic">📋</span>记录</button>
  </nav>
  <button class="fab" id="fabAdd">+</button>
</div>

<script>
/* ==================== 工具 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ return (Number(n)||0).toFixed(2); }
function fmtTime(ts){
  const d = new Date(ts), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),320); }, 2200);
}

/* ==================== 数据层 ==================== */
let products = [];
let records = [];

function loadData(){
  try{ products = JSON.parse(localStorage.getItem('ss_products') || '[]'); }catch(e){ products = []; }
  try{ records  = JSON.parse(localStorage.getItem('ss_records')  || '[]'); }catch(e){ records  = []; }
}
function saveProducts(){ localStorage.setItem('ss_products', JSON.stringify(products)); }
function saveRecords(){ localStorage.setItem('ss_records',  JSON.stringify(records)); }

function findProduct(id){ return products.find(p => p.id === id); }
function findByBarcode(code){ return products.find(p => p.barcode === code); }

function changeStock(productId, delta, remark = ''){
  if(!delta) return { ok:false, msg:'数量不能为 0' };
  const p = findProduct(productId);
  if(!p) return { ok:false, msg:'商品不存在' };
  const newStock = p.stock + delta;
  if(newStock < 0) return { ok:false, msg:`库存不足，当前库存 ${p.stock}` };
  p.stock = newStock;
  p.updatedAt = Date.now();
  records.unshift({
    id: uid(), productId: p.id, productName: p.name, barcode: p.barcode,
    type: delta > 0 ? 1 : -1, quantity: Math.abs(delta),
    remark: remark || '', time: Date.now()
  });
  saveProducts();
  saveRecords();
  return { ok:true, stock:newStock };
}

/* ==================== 视图管理 ==================== */
let currentView = 'list';
let editingId = null;
let currentProductId = null;

const TITLES = { list:'龙腾手机库存', add:'新增商品', detail:'商品详情', scan:'扫码', records:'出入库记录' };

function showView(name){
  if(currentView === 'scan' && name !== 'scan') stopScan();
  currentView = name;
  $$('.view').forEach(v => v.classList.remove('active'));
  const el = $('#view-' + name);
  if(el) el.classList.add('active');
  $('#tbTitle').textContent = TITLES[name] || '龙腾手机库存';
  const isRoot = (name === 'list' || name === 'scan' || name === 'records');
  $('#btnBack').classList.toggle('hidden', isRoot);
  $('#tabbar').classList.toggle('hidden', !isRoot);
  $('#fabAdd').style.display = (name === 'list') ? 'flex' : 'none';
  $$('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  if(name === 'list') renderProductList();
  if(name === 'records') renderRecords();
  if(name === 'scan') startScan();
}
$('#btnBack').addEventListener('click', ()=> showView('list'));

/* ==================== 商品列表 ==================== */
let searchKeyword = '';
$('#searchInput').addEventListener('input', e => { searchKeyword = e.target.value; renderProductList(); });

function renderProductList(){
  const kw = searchKeyword.trim().toLowerCase();
  const list = products.filter(p => {
    if(!kw) return true;
    return (p.name + p.brand + p.model + p.spec + p.color + p.barcode).toLowerCase().includes(kw);
  }).sort((a,b) => b.createdAt - a.createdAt);

  const el = $('#productList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty">${products.length === 0 ? '还没有商品<br>点击右下角 <b>+</b> 添加第一件商品' : '没有找到匹配的商品'}</div>`;
    return;
  }
  el.innerHTML = list.map(p => {
    const cls = p.stock <= 0 ? 'danger' : (p.stock <= p.warnStock ? 'warn' : 'ok');
    const sub = [p.brand, p.model, p.spec, p.color].filter(Boolean).join(' / ') || '—';
    return `<div class="card product-item" data-id="${esc(p.id)}">
      <div class="pi-main">
        <div class="pi-name">${esc(p.name)}</div>
        <div class="pi-sub">${esc(sub)}</div>
        <div class="pi-code">${esc(p.barcode)}</div>
      </div>
      <div class="pi-right">
        <div class="pi-stock ${cls}">库存 ${p.stock}</div>
        <div class="pi-price">¥${fmtMoney(p.priceOut)}</div>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.product-item').forEach(node => {
    const id = node.dataset.id;
    node.addEventListener('click', () => openDetail(id));
    let timer = null;
    const start = () => { timer = setTimeout(()=>{ timer = null; showQuickMenu(id); }, 600); };
    const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
    node.addEventListener('touchstart', start, {passive:true});
    node.addEventListener('touchend', cancel);
    node.addEventListener('touchmove', cancel, {passive:true});
    node.addEventListener('contextmenu', e => { e.preventDefault(); showQuickMenu(id); });
  });
}

function showQuickMenu(id){
  const p = findProduct(id);
  if(!p) return;
  const { mask, close } = showModal(`
    <div class="modal-title">${esc(p.name)}</div>
    <div class="modal-body">当前库存：${p.stock}</div>
    <div class="modal-btns" style="flex-direction:column;gap:8px;">
      <button class="primary" data-act="in">入库</button>
      <button data-act="out">出库</button>
      <button data-act="ble" style="background:linear-gradient(180deg,#3395FF,#007AFF);color:#fff;font-weight:600;">蓝牙打印</button>
      <button data-act="preview">打印预览</button>
      <button data-act="print">打印条码</button>
      <button data-act="saveImg">保存条码图</button>
      <button data-act="detail">查看详情</button>
      <button data-act="edit">编辑商品</button>
    </div>
  `);
  mask.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      close();
      if(act === 'in')       setTimeout(()=>promptQuantity(id, 1), 240);
      if(act === 'out')      setTimeout(()=>promptQuantity(id, -1), 240);
      if(act === 'ble')      setTimeout(()=>blePrint(p), 240);
      if(act === 'preview')  setTimeout(()=>showPrintPreview(p), 240);
      if(act === 'print')    setTimeout(()=>printBarcode(p), 240);
      if(act === 'saveImg')  setTimeout(()=>saveBarcodeImage(p), 240);
      if(act === 'detail')   setTimeout(()=>openDetail(id), 240);
      if(act === 'edit')     setTimeout(()=>openAdd(id), 240);
    });
  });
}

/* ==================== 新增 / 编辑 ==================== */
function openAdd(id = null, presetBarcode = ''){
  editingId = id;
  showView('add');
  $('#tbTitle').textContent = id ? '编辑商品' : '新增商品';

  const p = id ? findProduct(id) : null;
  if(id && !p){ toast('商品不存在'); showView('list'); return; }

  $('#fName').value     = p ? p.name : '';
  $('#fBrand').value    = p ? p.brand : '';
  $('#fModel').value    = p ? p.model : '';
  $('#fSpec').value     = p ? p.spec : '';
  $('#fColor').value    = p ? p.color : '';
  $('#fBarcode').value  = p ? p.barcode : (presetBarcode || '');
  $('#fPriceIn').value  = p && p.priceIn ? p.priceIn : '';
  $('#fPriceOut').value = p && p.priceOut ? p.priceOut : '';
  $('#fStock').value    = p ? p.stock : 0;
  $('#fWarn').value     = p ? p.warnStock : 2;
  $('#fRemark').value   = p ? p.remark : '';
  $('#lbStock').textContent = p ? '当前库存（通过出入库变更）' : '初始库存';
  $('#fStock').disabled = !!p;
  $('#btnSaveProduct').disabled = false;
  $('#btnSaveProduct').textContent = p ? '保存修改' : '保存';
}

$('#btnGenBarcode').addEventListener('click', ()=>{
  const ts = String(Date.now()).slice(-11);
  const r = Math.floor(Math.random() * 10);
  $('#fBarcode').value = '2' + ts + r;
  toast('已生成店内码');
});
$('#btnScanBarcode').addEventListener('click', ()=>{ scanOnce(code => { $('#fBarcode').value = code; }); });

$('#btnSaveProduct').addEventListener('click', ()=>{
  const name = $('#fName').value.trim();
  const barcode = $('#fBarcode').value.trim();
  if(!name){ toast('请输入商品名称'); return; }
  if(!barcode){ toast('请扫码、输入或生成商品条码'); return; }
  const exist = findByBarcode(barcode);
  if(exist && exist.id !== editingId){ toast(`条码已被「${exist.name}」占用`); return; }

  const data = {
    name, brand: $('#fBrand').value.trim(), model: $('#fModel').value.trim(),
    spec: $('#fSpec').value.trim(), color: $('#fColor').value.trim(), barcode,
    priceIn: parseFloat($('#fPriceIn').value) || 0,
    priceOut: parseFloat($('#fPriceOut').value) || 0,
    warnStock: parseInt($('#fWarn').value) || 2,
    remark: $('#fRemark').value.trim()
  };

  if(editingId){
    const p = findProduct(editingId);
    if(!p){ toast('商品不存在'); return; }
    Object.assign(p, data, { updatedAt: Date.now() });
    saveProducts(); toast('已保存');
  }else{
    const stock = parseInt($('#fStock').value) || 0;
    const p = { id: uid(), ...data, stock: 0, createdAt: Date.now(), updatedAt: Date.now() };
    products.push(p);
    saveProducts();
    if(stock > 0) changeStock(p.id, stock, '新建商品初始入库');
    toast('已添加');
  }
  showView('list');
});

/* ==================== 商品详情 ==================== */
function openDetail(id){
  const p = findProduct(id);
  if(!p){ toast('商品不存在'); return; }
  currentProductId = id;
  showView('detail');
  renderDetail(p);
}

function renderDetail(p){
  const cls = p.stock <= 0 ? 'danger' : (p.stock <= p.warnStock ? 'warn' : 'ok');
  const recs = records.filter(r => r.productId === p.id).slice(0, 100);
  $('#detailBody').innerHTML = `
    <div class="d-name">${esc(p.name)}</div>
    <div class="d-sub">${esc([p.brand, p.model].filter(Boolean).join(' ') || '—')}</div>
    <div class="d-badge ${cls}">库存 ${p.stock}</div>
    <div class="barcode-box"><svg id="barcodeSvg"></svg><div class="barcode-text">${esc(p.barcode)}</div></div>
    <div class="d-actions">
      <button class="btn-in"  id="dIn">入库</button>
      <button class="btn-out" id="dOut">出库</button>
    </div>
    <div class="d-mini">
      <button id="dBlePrint" class="btn-ble">蓝牙打印</button>
      <button id="dPreview">打印预览</button>
      <button id="dCopy">复制条码</button>
      <button id="dPrint">打印条码</button>
      <button id="dSaveImg">保存条码图</button>
      <button id="dEdit">编辑</button>
      <button id="dDel" style="color:var(--ios-red);">删除</button>
    </div>
    <div class="section-title">商品信息</div>
    <div class="info-box">
      <div><b>规格</b>${esc(p.spec || '—')}</div>
      <div><b>颜色</b>${esc(p.color || '—')}</div>
      <div><b>进货价</b>¥${fmtMoney(p.priceIn)}</div>
      <div><b>销售价</b>¥${fmtMoney(p.priceOut)}</div>
      <div><b>预警值</b>${p.warnStock}</div>
      <div><b>创建时间</b>${fmtTime(p.createdAt)}</div>
      ${p.remark ? `<div><b>备注</b>${esc(p.remark)}</div>` : ''}
    </div>
    <div class="section-title">出入库记录（${recs.length}）</div>
    <div class="card" style="padding:6px 16px;cursor:default;position:relative;z-index:1;">
      ${recs.length ? recs.map(r => `
        <div class="rec-item">

function copyText(text, msg){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fallbackCopy(text, msg));
  }else{ fallbackCopy(text, msg); }
}
function fallbackCopy(text, msg){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('复制失败'); }
  ta.remove();
}

/* ==================== 扫码 ==================== */
let scanner = null;
let scanMode = 'query';
let scanning = false;

$$('.scan-tabs button').forEach(btn => {
  btn.addEventListener('click', async () => {
    $$('.scan-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    scanMode = btn.dataset.mode;
    $('#scanTip').textContent = scanMode === 'query' ? '将条形码 / 二维码放入取景框内' : scanMode === 'in' ? '扫描商品条码 → 快速入库' : '扫描商品条码 → 快速出库';
    await stopScan();
    startScan();
  });
});

async function startScan(){
  if(scanning) return;
  const readerEl = $('#reader');
  if(!window.Html5Qrcode){ readerEl.innerHTML = '<div class="empty" style="color:#fff;">扫码组件加载失败<br>请检查网络后刷新</div>'; return; }
  readerEl.innerHTML = '';
  scanner = new Html5Qrcode('reader', { verbose: false });
  scanning = true;
  try{
    await scanner.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(h * 0.5) }), aspectRatio: 1.0 },
      onScanSuccess, () => {});
  }catch(e){
    scanning = false;
    readerEl.innerHTML = `<div class="empty" style="color:#fff;padding:30px 16px;">无法启动摄像头<br><br>请确认：<br>1. 使用 <b>HTTPS</b> 访问<br>2. 浏览器已允许摄像头权限<br>3. 设备有可用摄像头</div>`;
  }
}
async function stopScan(){
  if(!scanner) return;
  scanning = false;
  try{ await scanner.stop(); scanner.clear(); }catch(e){}
  scanner = null;
}
function onScanSuccess(text){
  if(!scanning) return;
  scanning = false;
  const code = String(text).trim();
  if(scanner){ scanner.stop().then(()=>{ try{ scanner.clear(); }catch(e){} scanner = null; }).catch(()=>{ scanner = null; }); }
  setTimeout(() => handleScanResult(code), 140);
}
function handleScanResult(code){
  const p = findByBarcode(code);
  if(!p){
    const { mask, close } = showModal(`
      <div class="modal-title">未找到商品</div>
      <div class="modal-body">条码 ${esc(code)} 尚未录入\n是否立即新增？</div>
      <div class="modal-btns">
        <button data-act="cancel">取消</button>
        <button class="primary" data-act="add">新增商品</button>
      </div>`);
    mask.querySelector('[data-act="cancel"]').onclick = () => { close(); setTimeout(startScan, 280); };
    mask.querySelector('[data-act="add"]').onclick = () => { close(); setTimeout(()=>openAdd(null, code), 240); };
    return;
  }
  if(scanMode === 'query') openDetail(p.id);
  else promptQuantity(p.id, scanMode === 'in' ? 1 : -1);
}

function downloadImportTemplate(){
  const rows = [
    ['商品名称','品牌','型号','规格','颜色','条码','进货价','销售价','预警值','库存量','备注'],
    ['iPhone 15 Pro Max','Apple','A3108','8+256G','原色钛金属','6901234567890','8000','8999','2','5','示例：可以删除本行'],
    ['华为 Mate 60 Pro','华为','ALN-AL00','12+512G','雅川青','','6500','6999','2','3','条码留空会自动生成'],
    ['小米 14','小米','23127PN0CC','12+256G','黑色','','3899','4299','2','0','']
  ];
  const csv = '\uFEFF' + rows.map(r => r.map(cell => {
    const s = String(cell ?? '');
    if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

/* ==================== 批量导入商品 ==================== */
function generateInternalBarcode(){
  const ts = String(Date.now()).slice(-8) + String(Math.floor(Math.random()*100)).padStart(2,'0');
  const r = Math.floor(Math.random() * 10);
  return '2' + ts + r;
}
function parseImportText(text){
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if(lines.length === 0) return { rows: [], errors: [] };
  const firstLine = lines[0];
  let sep = ',';
  if(firstLine.includes('\t')) sep = '\t'; else if(firstLine.includes('，')) sep = '，';
  const firstCells = firstLine.split(sep).map(c => c.trim().toLowerCase());
  let startIdx = firstCells.some(c => c.includes('名称') || c === 'name' || c.includes('商品')) ? 1 : 0;
  const rows = []; const errors = [];
  for(let i = startIdx; i < lines.length; i++){
    const cells = lines[i].split(sep).map(c => c.replace(/^\uFEFF/, '').trim());
    if(cells.length < 1 || !cells[0]) continue;
    const [name, brand, model, spec, color, barcode, priceIn, priceOut, warnStock, stock, remark] = cells;
    if(!name){ errors.push({ line: i + 1, msg: '商品名称为空', raw: lines[i] }); continue; }
    const finalBarcode = (barcode && barcode.trim()) ? barcode.trim() : generateInternalBarcode();
    rows.push({ 
      lineNo: i + 1, name, brand: brand || '', model: model || '', spec: spec || '', color: color || '', barcode: finalBarcode, 
      priceIn: parseFloat(priceIn) || 0, priceOut: parseFloat(priceOut) || 0, 
      warnStock: parseInt(warnStock) || 2, stock: parseInt(stock) || 0,
      remark: remark || '', autoBarcode: !(barcode && barcode.trim()) 
    });
  }
  return { rows, errors };
}

    <textarea class="import-area" id="importText" placeholder="例如：&#10;iPhone 15 Pro Max,Apple,A3108,8+256G,原色钛金属,6901234567890,8000,8999,2,5&#10;华为 Mate 60 Pro,华为,,12+512G,雅川青,,6500,6999,2,3"></textarea>

      <button class="mini-btn" id="btnParsePreview" style="flex:1;height:42px;background:rgba(52,199,89,.14);color:var(--ios-green);">解析预览</button>
    </div>
    <div id="importPreviewWrap" style="display:none;"><div class="import-preview" id="importPreview"></div></div>
    <div class="modal-btns" style="margin-top:14px;"><button data-act="cancel">取消</button><button class="primary" data-act="ok" id="btnConfirmImport" disabled>确认导入</button></div>`);
  let parsedRows = [];
  const textarea = mask.querySelector('#importText');
  const previewWrap = mask.querySelector('#importPreviewWrap');
  const preview = mask.querySelector('#importPreview');
  const fileInput = mask.querySelector('#batchFile');

  mask.querySelector('#btnParsePreview').onclick = () => {

    const result = parseImportText(text);
    parsedRows = result.rows;
    if(parsedRows.length === 0 && result.errors.length === 0){ toast('没有解析到任何商品'); return; }
    const existingCodes = new Set(products.map(p => p.barcode));
    const newCodes = new Set();
    let conflictCount = 0;
    const previewRows = parsedRows.map(r => {
      const isDup = existingCodes.has(r.barcode) || newCodes.has(r.barcode);
      if(isDup) conflictCount++;
      if(!isDup) newCodes.add(r.barcode);
      return { ...r, conflict: isDup };
    });
    previewWrap.style.display = 'block';
    preview.innerHTML = previewRows.slice(0, 50).map(r => `<div class="row ${r.conflict ? 'err' : ''}"><span class="n">${esc(r.name)}</span><span class="c">${esc(r.barcode)}</span>${r.conflict ? '<span style="color:var(--ios-red);">冲突</span>' : ''}</div>`).join('') + (previewRows.length > 50 ? `<div class="row" style="justify-content:center;color:var(--text2);">... 还有 ${previewRows.length - 50} 件未显示</div>` : '') + (result.errors.length > 0 ? `<div class="row err">跳过 ${result.errors.length} 行无效数据</div>` : '');
    parsedRows = previewRows.filter(r => !r.conflict);
    const okBtn = mask.querySelector('#btnConfirmImport');
    okBtn.disabled = parsedRows.length === 0;
    okBtn.textContent = `确认导入 ${parsedRows.length} 件` + (conflictCount ? ` (跳过 ${conflictCount} 件)` : '');
  };
  mask.querySelector('#btnConfirmImport').onclick = () => {
    if(parsedRows.length === 0) return;
    const now = Date.now(); let added = 0;
    parsedRows.forEach(r => {
      const p = { 
        id: uid(), name: r.name, brand: r.brand, model: r.model, spec: r.spec, color: r.color, 
        barcode: r.barcode, priceIn: r.priceIn, priceOut: r.priceOut, warnStock: r.warnStock, 
        remark: r.remark, stock: 0, createdAt: now, updatedAt: now 
      };
      products.push(p);
      added++;
      if (r.stock > 0) changeStock(p.id, r.stock, '批量导入初始库存');
    });
    saveProducts(); close(); toast(`成功导入 ${added} 件商品`); renderProductList(); showView('list');
  };
}

/* ==================== 打印条码（系统打印） ==================== */
function printBarcode(p) {
  try {
    const qr = qrcode(0, 'M');
    qr.addData(p.barcode);
    qr.make();
    const qrSvg = qr.createSvgTag(3, 0).replace(/<svg[^>]*>/, '<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">');
    const configLine = buildConfigLine(p);
    const win = window.open('', '_blank');
    win.document.write(`
      <!DOCTYPE html><html><head><meta charset="UTF-8"><title>打印条码 - ${esc(p.name)}</title>
      <style>* { box-sizing: border-box; } body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; padding: 20px; margin: 0; }
      .label { display: inline-block; border: 1px dashed #ccc; padding: 12px 24px; margin: 10px; border-radius: 12px; background: #fff; }
      .name { font-size: 15px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; }
      .config { font-size: 12px; color: #555; margin-bottom: 6px; white-space: nowrap; }
      .qrcode { display: flex; justify-content: center; margin: 8px 0; }
      .qrcode svg { width: 120px; height: 120px; }
      .code { font-family: monospace; font-size: 13px; letter-spacing: 1px; margin-top: 4px; color: #333; }
      @media print { body { padding: 0; } .label { border: none; margin: 0; padding: 8px; } }</style>
      </head><body><div class="label"><div class="name">${esc(p.name)}</div>${configLine ? `<div class="config">${esc(configLine)}</div>` : ''}<div class="qrcode">${qrSvg}</div><div class="code">${esc(p.barcode)}</div></div>
      <script>window.onload = function() { setTimeout(function() { window.print(); }, 200); };<\/script></body></html>`);
    win.document.close();
  } catch (e) { toast('二维码格式不支持生成'); }
}

/* ==================== 配置行 ==================== */
function buildConfigLine(p){
  const parts = [];
  const bm = [p.brand, p.model].filter(Boolean).join(' ');
  if(bm) parts.push(bm);
  if(p.spec) parts.push(p.spec);
  if(p.color) parts.push(p.color);
  return parts.join(' · ');
}

/* ==================== 生成标签 Canvas ==================== */
const B1_LABEL_SIZE = { w_px: 320, h_px: 240, offset_y_px: 0 };

function generateLabelCanvas(product) {
  const canvas = document.createElement('canvas');
  canvas.width = B1_LABEL_SIZE.w_px;
  canvas.height = B1_LABEL_SIZE.h_px;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  function fitTextToBox(text, maxWidth, maxHeight, fontWeight = 'normal', maxFontSize = 100) {
    let fontSize = Math.min(maxHeight, maxFontSize);
    let font = `${fontWeight} ${fontSize}px sans-serif`;
    ctx.font = font;
    while (fontSize > 8) {
      if (ctx.measureText(text).width <= maxWidth && fontSize <= maxHeight) {
        return { font: `${fontWeight} ${fontSize}px sans-serif`, size: fontSize };
      }
      fontSize--;
      ctx.font = `${fontWeight} ${fontSize}px sans-serif`;
    }
    return { font: `${fontWeight} 8px sans-serif`, size: 8 };
  }

  const padding = 8;

  const nameText = product.name || '';
  const nameH = 36;
  const nameFit = fitTextToBox(nameText, canvas.width - padding * 2, nameH, 'bold', 22);
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = nameFit.font;
  ctx.fillText(nameText, canvas.width / 2, padding + nameH / 2);

  const barcodeText = product.barcode || '';
  const codeH = 24;
  const codeY = canvas.height - codeH - padding;
  const codeFit = fitTextToBox(barcodeText, canvas.width - padding * 2, codeH, 'normal', 18);
  ctx.font = codeFit.font;
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(barcodeText, canvas.width / 2, codeY + codeH / 2);

  const midY = padding + nameH;
  const midH = codeY - midY;

  const infoLines = [];
  const bm = [product.brand, product.model].filter(Boolean).join(' ');
  if (bm) infoLines.push(bm);
  const sc = [product.spec, product.color].filter(Boolean).join(' / ');
  if (sc) infoLines.push(sc);
  if (product.remark) infoLines.push(product.remark);

  const qrSize = 110;
  const qrX = padding;
  const qrY = midY + (midH - qrSize) / 2;

  try {
    const qr = qrcode(0, 'M');
    qr.addData(barcodeText);
    qr.make();
    const qrCount = qr.getModuleCount();
    const cellSize = Math.floor(qrSize / qrCount);
    const actualQrSize = cellSize * qrCount;
    const offsetX = qrX + (qrSize - actualQrSize) / 2;
    const offsetY = qrY + (qrSize - actualQrSize) / 2;

    const qrCanvas = document.createElement('canvas');
    qrCanvas.width = actualQrSize;
    qrCanvas.height = actualQrSize;
    const qrCtx = qrCanvas.getContext('2d');
    qrCtx.fillStyle = '#FFFFFF';
    qrCtx.fillRect(0, 0, actualQrSize, actualQrSize);
    qrCtx.fillStyle = '#000000';
    for (let row = 0; row < qrCount; row++) {
      for (let col = 0; col < qrCount; col++) {
        if (qr.isDark(row, col)) {
          qrCtx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }
    ctx.drawImage(qrCanvas, offsetX, offsetY);
  } catch (e) {
    console.error('二维码生成失败', e);
  }

  if (infoLines.length > 0) {
    const textX = qrX + qrSize + 8;
    const textW = canvas.width - textX - padding;
    const lineHeight = midH / infoLines.length;

    infoLines.forEach((lineText, index) => {
      const lineY = midY + index * lineHeight;
      const textFit = fitTextToBox(lineText, textW, lineHeight * 0.8, 'normal', 20);
      ctx.font = textFit.font;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      ctx.fillText(lineText, textX, lineY + lineHeight / 2);
    });
  }
  return canvas;
}

/* ==================== 蓝牙打印 ==================== */
async function blePrint(product) {
  if (!navigator.bluetooth) { toast('当前浏览器不支持蓝牙，请用安卓 Chrome 或 Edge'); return; }
  if (typeof Niimbot === 'undefined') { toast('蓝牙驱动未加载，请检查网络后刷新页面'); return; }

  const canvas = generateLabelCanvas(product);
  const dataUrl = canvas.toDataURL('image/png');

  toast('正在连接打印机...');
  try {
    const model = { name_prefixes: ['B1'], task: 'b1', density: 3, label_type: 1, speed: 1 };
    await Niimbot.printImage(dataUrl, { model: model, size: B1_LABEL_SIZE });
    toast('打印指令已发送');
  } catch (e) {
    console.error('蓝牙打印失败', e);
    if (e.name === 'NotFoundError') toast('未选择打印机，已取消');
    else if (e.name === 'SecurityError') toast('需要 HTTPS 才能使用蓝牙');
    else toast('打印失败：' + (e.message || '请重试'));
  }
}

/* ==================== 打印预览弹窗 ==================== */
function showPrintPreview(product) {
  const canvas = generateLabelCanvas(product);
  const dataUrl = canvas.toDataURL('image/png');

  const { mask, close } = showModal(`
    <div class="modal-title">打印预览</div>
    <div style="text-align:center; padding:14px; background:rgba(120,120,128,.06); border-radius:16px; margin-bottom:16px;">
      <img src="${dataUrl}" style="max-width:100%; height:auto; display:block; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.12);">
    </div>
    <div style="font-size:12.5px; color:var(--text2); text-align:center; margin-bottom:16px; line-height:1.7; letter-spacing:-.1px;">
      当前标签尺寸：40mm × 30mm<br>如果预览显示正常，可直接打印
    </div>
    <div class="modal-btns">
      <button data-act="cancel">取消</button>
      <button class="primary" data-act="print">立即打印</button>
    </div>`);
  mask.querySelector('[data-act="cancel"]').onclick = close;
  mask.querySelector('[data-act="print"]').onclick = () => {

}

/* ==================== 保存单张条码图 ==================== */
function saveBarcodeImage(p) {
  const canvas = generateLabelCanvas(p);
  canvas.toBlob(blob => {
    if (!blob) { toast('生成图片失败'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `标签_${(p.name||'').replace(/[\\/:*?"<>|]/g,'_')}_${p.barcode}.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('已下载标签图片');
  }, 'image/png');
}

/* ==================== 批量下载所有条码（ZIP） ==================== */
async function batchDownloadBarcodes() {
  if (products.length === 0) { toast('还没有商品，无法下载'); return; }
  if (typeof JSZip === 'undefined') { toast('打包组件未加载，请检查网络后刷新'); return; }
  const nameCount = {};
  const { mask, close } = showModal(`
    <div class="modal-title">批量下载标签</div>
    <div class="modal-body">正在生成 ${products.length} 张标签图片...<div id="batchProgress" style="margin-top:10px;font-size:13px;color:var(--text2);">准备中</div></div>`);
  const progressEl = mask.querySelector('#batchProgress');
  const zip = new JSZip(); const folder = zip.folder('标签图片');
  let ok = 0, fail = 0;
  for (let i = 0; i < products.length; i++) {
    const p = products[i];
    progressEl.textContent = `正在处理 ${i + 1} / ${products.length}：${p.name}`;
    try {
      const canvas = generateLabelCanvas(p);
      const safeName = (p.name || '未命名').replace(/[\\/:*?"<>|]/g, '_').slice(0, 30);
      const safeCode = (p.barcode || 'nocode').replace(/[\\/:*?"<>|]/g, '_');
      let baseName = `${safeName}_${safeCode}`;
      if (nameCount[baseName]) { nameCount[baseName]++; baseName = `${baseName}(${nameCount[baseName]})`; } else { nameCount[baseName] = 1; }
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (blob) { folder.file(`${baseName}.png`, blob); ok++; } else { fail++; }
    } catch (e) { fail++; }
    if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
  }
  progressEl.textContent = '正在打包 ZIP...';
  try {
    const zipBlob = await zip.generateAsync({ type: 'blob' }, meta => { progressEl.textContent = `正在打包... ${Math.round(meta.percent)}%`; });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    a.href = url; a.download = `标签打包_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.zip`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    close(); toast(`已完成：成功 ${ok} 张${fail ? `，失败 ${fail} 张` : ''}`);
  } catch (e) { console.error(e); close(); toast('打包失败，请重试'); }
}
$('#btnBatchBarcode').addEventListener('click', batchDownloadBarcodes);

/* ==================== 批量打印标签 ==================== */
function openBatchPrint(){
  if (products.length === 0) { toast('还没有商品，无法打印'); return; }

  const sortedProducts = [...products].sort((a,b) => b.createdAt - a.createdAt);

  const { mask, close } = showModal(`
    <div class="modal-title">批量打印标签</div>
    <div class="bp-toolbar">
      <label><input type="checkbox" id="bpSelectAll" checked> 全选</label>
      <span style="flex:1;text-align:right;color:var(--text2);">已选 <b id="bpCount">${sortedProducts.length}</b> / ${sortedProducts.length}</span>
    </div>
    <div class="bp-list" id="bpList">
      ${sortedProducts.map(p => `
        <label class="bp-item">
          <input type="checkbox" class="bp-check" data-id="${esc(p.id)}" checked>
          <span class="bp-name">${esc(p.name)}</span>
          <span class="bp-code">${esc(p.barcode)}</span>
        </label>
      `).join('')}
    </div>
    <div class="modal-btns" style="margin-top:16px;">
      <button data-act="cancel">取消</button>
      <button class="primary" data-act="print" id="bpStartBtn">开始打印 ${sortedProducts.length} 张</button>
    </div>`);

  const checkAll = mask.querySelector('#bpSelectAll');
  const checkboxes = mask.querySelectorAll('.bp-check');
  const countEl = mask.querySelector('#bpCount');
  const startBtn = mask.querySelector('#bpStartBtn');

  function updateCount(){
    const checked = [...checkboxes].filter(c => c.checked).length;
    countEl.textContent = checked;
    startBtn.textContent = `开始打印 ${checked} 张`;
    startBtn.disabled = checked === 0;
    checkAll.checked = checked === checkboxes.length && checked > 0;
    checkAll.indeterminate = checked > 0 && checked < checkboxes.length;
  }

  checkAll.onchange = () => {
    checkboxes.forEach(c => { c.checked = checkAll.checked; });
    updateCount();
  };
  checkboxes.forEach(c => { c.onchange = updateCount; });

  mask.querySelector('[data-act="cancel"]').onclick = close;
  startBtn.onclick = () => {
    const ids = [...checkboxes].filter(c => c.checked).map(c => c.dataset.id);
    if(ids.length === 0){ toast('请至少选择一个商品'); return; }
    close();
    setTimeout(() => startBatchPrint(ids), 280);
  };
}

async function startBatchPrint(ids){
  if (!navigator.bluetooth) { toast('当前浏览器不支持蓝牙，请用安卓 Chrome 或 Edge'); return; }
  if (typeof Niimbot === 'undefined') { toast('蓝牙驱动未加载，请检查网络后刷新页面'); return; }

  const { mask, close } = showModal(`
    <div class="modal-title">正在批量打印</div>
    <div class="bp-progress">
      <div id="bpProgressText">准备中...</div>
      <div class="bp-bar"><div class="bp-bar-inner" id="bpBarInner"></div></div>
      <div style="font-size:12.5px;color:var(--text2);margin-top:12px;">请不要关闭页面，也不要锁屏</div>
    </div>`);

  const textEl = mask.querySelector('#bpProgressText');
  const barEl = mask.querySelector('#bpBarInner');

  let ok = 0, fail = 0;
  const model = { name_prefixes: ['B1'], task: 'b1', density: 3, label_type: 1, speed: 1 };

  for (let i = 0; i < ids.length; i++){
    const p = findProduct(ids[i]);
    if(!p){ fail++; continue; }

    textEl.textContent = `正在打印 ${i + 1} / ${ids.length}：${p.name}`;
    barEl.style.width = `${Math.round(((i) / ids.length) * 100)}%`;

    try {
      const canvas = generateLabelCanvas(p);
      const dataUrl = canvas.toDataURL('image/png');
      await Niimbot.printImage(dataUrl, { model: model, size: B1_LABEL_SIZE });
      ok++;
    } catch (e){
      console.error('第 ' + (i+1) + ' 张打印失败', e);
      fail++;
      if (e.name === 'NotFoundError' || e.name === 'SecurityError') {
        toast('已取消打印');
        break;
      }
    }

    await new Promise(r => setTimeout(r, 400));
  }

  barEl.style.width = '100%';
  textEl.textContent = '打印完成';
  await new Promise(r => setTimeout(r, 800));
  close();

  if (fail === 0) {
    toast(`批量打印完成：共 ${ok} 张`);
  } else {
    toast(`完成：成功 ${ok} 张，失败 ${fail} 张`);
  }
}

$('#btnBatchPrint').addEventListener('click', openBatchPrint);
