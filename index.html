<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1565C0">
<title>龙腾手机库存</title>
<!-- 引入二维码生成库 -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/niimbot-web-bluetooth@2.6.0/src/niimbot.js"></script>
<style>
:root{
  --primary:#1565C0; --primary-dark:#0D47A1;
  --green:#2E7D32; --red:#C62828; --orange:#EF6C00;
  --bg:#F4F6F9; --card:#FFF; --text:#1A1A1A; --text2:#6B7280; --border:#E5E7EB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#DFE4EA;color:var(--text);font-size:15px;overflow:hidden;
}
#app{
  max-width:640px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;background:var(--bg);
  position:relative;overflow:hidden;
}
#topbar{
  height:56px;flex:none;display:flex;align-items:center;
  padding:0 8px;background:var(--primary);color:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:10;
}
#topbar .tb-btn{
  width:44px;height:44px;border:0;background:transparent;color:#fff;
  font-size:20px;border-radius:50%;cursor:pointer;display:flex;
  align-items:center;justify-content:center;
}
#topbar .tb-btn:active{background:rgba(255,255,255,.18);}
#topbar .tb-btn.hidden{visibility:hidden;}
#topbar h1{
  flex:1;text-align:center;font-size:17px;margin:0;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#main{flex:1;position:relative;overflow:hidden;}
.view{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:none;padding-bottom:24px;
}
.view.active{display:block;}
#tabbar{
  flex:none;height:58px;display:flex;background:#fff;
  border-top:1px solid var(--border);z-index:10;
}
#tabbar.hidden{display:none;}
#tabbar button{
  flex:1;border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:11px;
  color:var(--text2);cursor:pointer;padding:6px 0;
}
#tabbar button .ic{font-size:19px;line-height:1;}
#tabbar button.active{color:var(--primary);font-weight:600;}
.search-wrap{padding:10px 12px 6px;}
.search-wrap input{
  width:100%;height:42px;border:1px solid var(--border);border-radius:10px;
  padding:0 14px;font-size:14px;background:#fff;outline:none;
}
.search-wrap input:focus{border-color:var(--primary);}
.list{padding:4px 12px 90px;}
.card{
  background:var(--card);border-radius:12px;padding:12px 14px;
  margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);
  cursor:pointer;transition:transform .1s;
}
.card:active{transform:scale(.985);}
.product-item{display:flex;gap:10px;align-items:flex-start;}
.pi-main{flex:1;min-width:0;}
.pi-name{font-size:15px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pi-sub{font-size:12.5px;color:var(--text2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pi-code{font-size:11.5px;color:#9AA0A6;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pi-right{flex:none;text-align:right;}
.pi-stock{font-size:14px;font-weight:700;margin-bottom:5px;}
.pi-stock.ok{color:var(--green);}
.pi-stock.warn{color:var(--orange);}
.pi-stock.danger{color:var(--red);}
.pi-price{font-size:13px;color:var(--primary);font-weight:600;}
.empty{text-align:center;color:var(--text2);font-size:14px;padding:60px 24px;line-height:1.8;}
.fab{
  position:fixed;right:calc(50% - 320px + 18px);bottom:78px;
  width:56px;height:56px;border-radius:50%;border:0;
  background:var(--primary);color:#fff;font-size:28px;line-height:1;
  box-shadow:0 4px 14px rgba(21,101,192,.42);cursor:pointer;z-index:9;
  display:flex;align-items:center;justify-content:center;
}
@media (max-width:676px){ .fab{right:18px;} }
.fab:active{transform:scale(.94);}
.form-body{padding:16px 14px 40px;}
.field{margin-bottom:14px;flex:1;min-width:0;}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;}
.field .req{color:var(--red);}
.field input,.field textarea{
  width:100%;border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;font-size:15px;background:#fff;outline:none;font-family:inherit;color:var(--text);
}
.field input:focus,.field textarea:focus{border-color:var(--primary);}
.field input:disabled{background:#F0F1F3;color:#9AA0A6;}
.row2{display:flex;gap:12px;}
.input-with-actions{display:flex;gap:8px;align-items:center;}
.input-with-actions input{flex:1;min-width:0;}
.mini-btn{
  flex:none;height:42px;padding:0 14px;border:1px solid var(--primary);
  background:#fff;color:var(--primary);border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap;
}
.mini-btn:active{background:#E8F0FE;}
.btn-primary{
  width:100%;height:50px;border:0;border-radius:12px;
  background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;
}
.btn-primary:active{background:var(--primary-dark);}
.btn-primary:disabled{opacity:.6;}
.btn-plain{
  width:100%;height:44px;border:1px solid var(--border);border-radius:10px;
  background:#fff;color:var(--text2);font-size:14px;cursor:pointer;
}
.detail-body{padding:16px 14px 40px;}
.d-name{font-size:22px;font-weight:700;margin:0 0 4px;}
.d-sub{font-size:14px;color:var(--text2);margin-bottom:10px;}
.d-badge{display:inline-block;font-size:15px;font-weight:700;padding:4px 12px;border-radius:20px;background:#F0F1F3;}
.d-badge.ok{color:var(--green);background:#E8F5E9;}
.d-badge.warn{color:var(--orange);background:#FFF3E0;}
.d-badge.danger{color:var(--red);background:#FFEBEE;}
.barcode-box{background:#fff;border-radius:12px;padding:14px;margin:14px 0;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.barcode-box svg{width:100%;height:auto;max-height:130px;display:block;}
.barcode-text{font-family:monospace;font-size:13px;letter-spacing:1px;margin-top:6px;color:#374151;}
.d-actions{display:flex;gap:10px;margin-bottom:12px;}
.d-actions button{flex:1;height:48px;border:0;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-in{background:var(--green);color:#fff;}
.btn-out{background:#fff;color:var(--red);border:1.5px solid var(--red)!important;}
.d-mini{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.d-mini button{
  flex:1;min-width:72px;height:38px;border:1px solid var(--border);background:#fff;
  border-radius:9px;font-size:12.5px;color:var(--text2);cursor:pointer;
}
.btn-ble{background:#1565C0!important;color:#fff!important;border-color:#1565C0!important;font-weight:600!important;}
.section-title{font-size:14px;font-weight:700;margin:18px 0 8px;color:#374151;}
.info-box{background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.9;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.info-box b{color:var(--text2);font-weight:400;}
.rec-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F1F3;}
.rec-item:last-child{border-bottom:0;}
.rec-type{flex:none;width:42px;font-size:12.5px;font-weight:700;}
.rec-type.in{color:var(--green);}
.rec-type.out{color:var(--red);}
.rec-main{flex:1;min-width:0;}
.rec-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec-time{font-size:11.5px;color:var(--text2);}
.rec-qty{flex:none;font-size:16px;font-weight:700;}
.rec-qty.in{color:var(--green);}
.rec-qty.out{color:var(--red);}
.scan-tabs{display:flex;gap:8px;padding:12px 14px 8px;}
.scan-tabs button{
  flex:1;height:40px;border:1px solid var(--border);background:#fff;
  border-radius:10px;font-size:13.5px;color:var(--text2);cursor:pointer;
}
.scan-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
.scan-reader{width:100%;min-height:260px;background:#000;border-radius:12px;overflow:hidden;position:relative;}
.scan-reader video{width:100%!important;height:auto!important;}
.scan-tip{text-align:center;font-size:13px;color:var(--text2);padding:12px 20px;line-height:1.7;}
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;transition:opacity .18s;
}
.modal-mask.show{opacity:1;}
.modal{
  width:100%;max-width:380px;background:#fff;border-radius:16px;
  padding:20px;transform:scale(.94);transition:transform .18s;
  max-height:85vh;overflow-y:auto;
}
.modal-mask.show .modal{transform:scale(1);}
.modal-title{font-size:17px;font-weight:700;margin-bottom:10px;text-align:center;}
.modal-body{font-size:14px;color:#374151;line-height:1.7;margin-bottom:16px;text-align:center;white-space:pre-line;}
.modal-input{width:100%;height:46px;border:1px solid var(--border);border-radius:10px;padding:0 13px;font-size:16px;outline:none;margin-bottom:10px;}
.modal-input:focus{border-color:var(--primary);}
.modal-btns{display:flex;gap:10px;margin-top:6px;}
.modal-btns button{flex:1;height:44px;border-radius:10px;font-size:15px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text2);}
.modal-btns button.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);
  background:rgba(30,30,30,.92);color:#fff;font-size:14px;
  padding:11px 20px;border-radius:22px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.import-tip{font-size:12px;color:var(--text2);background:#F8FAFC;border-radius:8px;padding:10px 12px;line-height:1.7;margin-bottom:10px;}
.import-tip code{background:#E8F0FE;color:#1565C0;padding:1px 5px;border-radius:3px;font-size:11px;}
.import-area{width:100%;min-height:140px;max-height:280px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px;font-family:monospace;outline:none;resize:vertical;}
.import-area:focus{border-color:var(--primary);}
.import-preview{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:10px;font-size:12px;}
.import-preview .row{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid #F0F1F3;}
.import-preview .row:last-child{border-bottom:0;}
.import-preview .row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.import-preview .row .c{color:var(--text2);font-family:monospace;}
.import-preview .row.err{background:#FFF5F5;color:var(--red);}
.tpl-btn{width:100%;height:40px;border:1px dashed #1565C0;border-radius:10px;background:#F0F7FF;color:#1565C0;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;}
.tpl-btn:active{background:#E1EFFF;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="tb-btn hidden" id="btnBack">←</button>
    <h1 id="tbTitle">龙腾手机库存</h1>
    <button class="tb-btn hidden" id="tbRight">⋯</button>
  </header>

  <main id="main">
    <section id="view-list" class="view active">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索 名称 / 品牌 / 型号 / 条码">
      </div>
      <div id="productList" class="list"></div>
    </section>

    <section id="view-add" class="view">
      <div class="form-body">
        <div class="field"><label>商品名称 <span class="req">*</span></label><input id="fName" type="text" placeholder="如 iPhone 15 Pro Max"></div>
        <div class="row2">
          <div class="field"><label>品牌</label><input id="fBrand" placeholder="Apple"></div>
          <div class="field"><label>型号</label><input id="fModel" placeholder="A3108"></div>
        </div>
        <div class="row2">
          <div class="field"><label>规格</label><input id="fSpec" placeholder="8G+256G"></div>
          <div class="field"><label>颜色</label><input id="fColor" placeholder="原色钛金属"></div>
        </div>
        <div class="field">
          <label>商品条码 <span class="req">*</span></label>
          <div class="input-with-actions">
            <input id="fBarcode" placeholder="扫描 / 输入 / 生成">
            <button type="button" class="mini-btn" id="btnScanBarcode">扫描</button>
            <button type="button" class="mini-btn" id="btnGenBarcode">生成</button>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>进货价</label><input id="fPriceIn" type="number" inputmode="decimal" placeholder="0.00"></div>
          <div class="field"><label>销售价</label><input id="fPriceOut" type="number" inputmode="decimal" placeholder="0.00"></div>
        </div>
        <div class="row2">
          <div class="field"><label id="lbStock">初始库存</label><input id="fStock" type="number" inputmode="numeric" value="0"></div>
          <div class="field"><label>预警值</label><input id="fWarn" type="number" inputmode="numeric" value="2"></div>
        </div>
        <div class="field"><label>备注</label><textarea id="fRemark" rows="2" placeholder="可选"></textarea></div>
        <button class="btn-primary" id="btnSaveProduct">保存</button>
      </div>
    </section>

    <section id="view-detail" class="view">
      <div class="detail-body" id="detailBody"></div>
    </section>

    <section id="view-scan" class="view">
      <div class="scan-tabs">
        <button data-mode="query" class="active">扫码查询</button>
        <button data-mode="in">扫码入库</button>
        <button data-mode="out">扫码出库</button>
      </div>
      <div style="padding:0 14px;"><div id="reader" class="scan-reader"></div></div>
      <div class="scan-tip" id="scanTip">将条形码 / 二维码放入取景框内</div>
    </section>

    <section id="view-records" class="view">
      <div style="padding:14px;">
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="mini-btn" id="btnExport" style="flex:1;">导出备份</button>
          <button class="mini-btn" id="btnImport" style="flex:1;">导入备份</button>
          <button class="mini-btn" id="btnClearAll" style="flex:1;border-color:#F3C6C6;color:var(--red);">清空数据</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <button class="mini-btn" id="btnBatchImport" style="flex:1;background:#2E7D32;color:#fff;border-color:#2E7D32;">批量导入商品</button>
          <button class="mini-btn" id="btnBatchBarcode" style="flex:1;background:#1565C0;color:#fff;border-color:#1565C0;">批量下载条码</button>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none">
        <div class="section-title">全部出入库流水</div>
        <div class="card" style="padding:6px 14px;"><div id="recordList"></div></div>
      </div>
    </section>
  </main>

  <nav id="tabbar">
    <button data-tab="list" class="active"><span class="ic">📦</span>库存</button>
    <button data-tab="scan"><span class="ic">📷</span>扫码</button>
    <button data-tab="records"><span class="ic">📋</span>记录</button>
  </nav>
  <button class="fab" id="fabAdd">+</button>
</div>

<script>
/* ==================== 工具 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtMoney(n){ return (Number(n)||0).toFixed(2); }
function fmtTime(ts){
  const d = new Date(ts), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 2200);
}

/* ==================== 数据层 ==================== */
let products = [];
let records = [];

function loadData(){
  try{ products = JSON.parse(localStorage.getItem('ss_products') || '[]'); }catch(e){ products = []; }
  try{ records  = JSON.parse(localStorage.getItem('ss_records')  || '[]'); }catch(e){ records  = []; }
}
function saveProducts(){ localStorage.setItem('ss_products', JSON.stringify(products)); }
function saveRecords(){ localStorage.setItem('ss_records',  JSON.stringify(records)); }

function findProduct(id){ return products.find(p => p.id === id); }
function findByBarcode(code){ return products.find(p => p.barcode === code); }

function changeStock(productId, delta, remark = ''){
  if(!delta) return { ok:false, msg:'数量不能为 0' };
  const p = findProduct(productId);
  if(!p) return { ok:false, msg:'商品不存在' };
  const newStock = p.stock + delta;
  if(newStock < 0) return { ok:false, msg:`库存不足，当前库存 ${p.stock}` };
  p.stock = newStock;
  p.updatedAt = Date.now();
  records.unshift({
    id: uid(), productId: p.id, productName: p.name, barcode: p.barcode,
    type: delta > 0 ? 1 : -1, quantity: Math.abs(delta),
    remark: remark || '', time: Date.now()
  });
  saveProducts();
  saveRecords();
  return { ok:true, stock:newStock };
}

/* ==================== 视图管理 ==================== */
let currentView = 'list';
let editingId = null;
let currentProductId = null;

const TITLES = { list:'龙腾手机库存', add:'新增商品', edit:'编辑商品', detail:'商品详情', scan:'扫码', records:'出入库记录' };

function showView(name){
  if(currentView === 'scan' && name !== 'scan') stopScan();
  currentView = name;
  $$('.view').forEach(v => v.classList.remove('active'));
  const el = $('#view-' + name);
  if(el) el.classList.add('active');
  $('#tbTitle').textContent = TITLES[name] || '龙腾手机库存';
  const isRoot = (name === 'list' || name === 'scan' || name === 'records');
  $('#btnBack').classList.toggle('hidden', isRoot);
  $('#tabbar').classList.toggle('hidden', !isRoot);
  $('#fabAdd').style.display = (name === 'list') ? 'flex' : 'none';
  $$('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  if(name === 'list') renderProductList();
  if(name === 'records') renderRecords();
  if(name === 'scan') startScan();
}
$('#btnBack').addEventListener('click', ()=> showView('list'));

/* ==================== 商品列表 ==================== */
let searchKeyword = '';
$('#searchInput').addEventListener('input', e => { searchKeyword = e.target.value; renderProductList(); });

function renderProductList(){
  const kw = searchKeyword.trim().toLowerCase();
  const list = products.filter(p => {
    if(!kw) return true;
    return (p.name + p.brand + p.model + p.spec + p.color + p.barcode).toLowerCase().includes(kw);
  }).sort((a,b) => b.createdAt - a.createdAt);

  const el = $('#productList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty">${products.length === 0 ? '还没有商品<br>点击右下角 <b>+</b> 添加第一件商品' : '没有找到匹配的商品'}</div>`;
    return;
  }
  el.innerHTML = list.map(p => {
    const cls = p.stock <= 0 ? 'danger' : (p.stock <= p.warnStock ? 'warn' : 'ok');
    const sub = [p.brand, p.model, p.spec, p.color].filter(Boolean).join(' / ') || '—';
    return `<div class="card product-item" data-id="${esc(p.id)}">
      <div class="pi-main">
        <div class="pi-name">${esc(p.name)}</div>
        <div class="pi-sub">${esc(sub)}</div>
        <div class="pi-code">条码：${esc(p.barcode)}</div>
      </div>
      <div class="pi-right">
        <div class="pi-stock ${cls}">库存 ${p.stock}</div>
        <div class="pi-price">¥${fmtMoney(p.priceOut)}</div>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.product-item').forEach(node => {
    const id = node.dataset.id;
    node.addEventListener('click', () => openDetail(id));
    let timer = null;
    const start = () => { timer = setTimeout(()=>{ timer = null; showQuickMenu(id); }, 600); };
    const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
    node.addEventListener('touchstart', start, {passive:true});
    node.addEventListener('touchend', cancel);
    node.addEventListener('touchmove', cancel, {passive:true});
    node.addEventListener('contextmenu', e => { e.preventDefault(); showQuickMenu(id); });
  });
}

function copyText(text, msg){

}
function fallbackCopy(text, msg){

  try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('复制失败'); }

}

/* ==================== 扫码 ==================== */
let scanner = null;
let scanMode = 'query';
let scanning = false;

$$('.scan-tabs button').forEach(btn => {
  btn.addEventListener('click', async () => {
    $$('.scan-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    scanMode = btn.dataset.mode;
    $('#scanTip').textContent = scanMode === 'query' ? '将条形码 / 二维码放入取景框内' : scanMode === 'in' ? '扫描商品条码 → 快速入库' : '扫描商品条码 → 快速出库';
    await stopScan();
    startScan();
  });
});

async function startScan(){
  if(scanning) return;
  const readerEl = $('#reader');
  if(!window.Html5Qrcode){ readerEl.innerHTML = '<div class="empty" style="color:#fff;">扫码组件加载失败<br>请检查网络后刷新</div>'; return; }
  readerEl.innerHTML = '';
  scanner = new Html5Qrcode('reader', { verbose: false });
  scanning = true;
  try{
    await scanner.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(h * 0.5) }), aspectRatio: 1.0 },
      onScanSuccess, () => {});
  }catch(e){
    scanning = false;
    readerEl.innerHTML = `<div class="empty" style="color:#fff;padding:30px 16px;">无法启动摄像头<br><br>请确认：<br>1. 使用 <b>HTTPS</b> 访问<br>2. 浏览器已允许摄像头权限<br>3. 设备有可用摄像头</div>`;
  }
}
async function stopScan(){
  if(!scanner) return;
  scanning = false;
  try{ await scanner.stop(); scanner.clear(); }catch(e){}
  scanner = null;
}
function onScanSuccess(text){
  if(!scanning) return;
  scanning = false;
  const code = String(text).trim();
  if(scanner){ scanner.stop().then(()=>{ try{ scanner.clear(); }catch(e){} scanner = null; }).catch(()=>{ scanner = null; }); }
  setTimeout(() => handleScanResult(code), 120);
}
function handleScanResult(code){
  const p = findByBarcode(code);
  if(!p){
    const { mask, close } = showModal(`
      <div class="modal-title">未找到商品</div>
      <div class="modal-body">条码 ${esc(code)} 尚未录入\n是否立即新增？</div>
      <div class="modal-btns">
        <button data-act="cancel">取消</button>
        <button class="primary" data-act="add">新增商品</button>
      </div>`);
    mask.querySelector('[data-act="cancel"]').onclick = () => { close(); setTimeout(startScan, 250); };
    mask.querySelector('[data-act="add"]').onclick = () => { close(); setTimeout(()=>openAdd(null, code), 220); };
    return;
  }
  if(scanMode === 'query') openDetail(p.id);
  else promptQuantity(p.id, scanMode === 'in' ? 1 : -1);
}

/* ==================== 下载 CSV 导入模板 ==================== */
function downloadImportTemplate(){
  const rows = [
    ['商品名称','品牌','型号','规格','颜色','条码','进货价','销售价','预警值','备注'],
    ['iPhone 15 Pro Max','Apple','A3108','8+256G','原色钛金属','6901234567890','8000','8999','2','示例：可以删除本行'],
    ['华为 Mate 60 Pro','华为','ALN-AL00','12+512G','雅川青','','6500','6999','2','条码留空会自动生成'],
    ['小米 14','小米','23127PN0CC','12+256G','黑色','','3899','4299','2','']
  ];
  const csv = '\uFEFF' + rows.map(r => r.map(cell => {
    const s = String(cell ?? '');
    if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '商品批量导入模板.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('模板已下载，用 Excel 打开填写后另存为 CSV');
}

/* ==================== 批量导入商品 ==================== */
function generateInternalBarcode(){
  const ts = String(Date.now()).slice(-8) + String(Math.floor(Math.random()*100)).padStart(2,'0');
  const r = Math.floor(Math.random() * 10);
  return '2' + ts + r;
}
function parseImportText(text){
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if(lines.length === 0) return { rows: [], errors: [] };
  const firstLine = lines[0];
  let sep = ',';
  if(firstLine.includes('\t')) sep = '\t'; else if(firstLine.includes('，')) sep = '，';
  const firstCells = firstLine.split(sep).map(c => c.trim().toLowerCase());
  let startIdx = firstCells.some(c => c.includes('名称') || c === 'name' || c.includes('商品')) ? 1 : 0;
  const rows = []; const errors = [];
  for(let i = startIdx; i < lines.length; i++){
    const cells = lines[i].split(sep).map(c => c.replace(/^\uFEFF/, '').trim());
    if(cells.length < 1 || !cells[0]) continue;
    const [name, brand, model, spec, color, barcode, priceIn, priceOut, warnStock, remark] = cells;
    if(!name){ errors.push({ line: i + 1, msg: '商品名称为空', raw: lines[i] }); continue; }
    const finalBarcode = (barcode && barcode.trim()) ? barcode.trim() : generateInternalBarcode();
    rows.push({ lineNo: i + 1, name, brand: brand || '', model: model || '', spec: spec || '', color: color || '', barcode: finalBarcode, priceIn: parseFloat(priceIn) || 0, priceOut: parseFloat(priceOut) || 0, warnStock: parseInt(warnStock) || 2, remark: remark || '', autoBarcode: !(barcode && barcode.trim()) });
  }
  return { rows, errors };
}
function openBatchImport(){
  const { mask, close } = showModal(`
    <div class="modal-title">批量导入商品</div>
    <button class="tpl-btn" id="btnDownloadTpl">⬇ 下载 CSV 导入模板（用 Excel 填写）</button>
    <div class="import-tip">每行一件商品，用逗号或制表符分隔。列顺序：<br><code>名称,品牌,型号,规格,颜色,条码,进货价,销售价,预警值,备注</code><br>除<b>名称</b>外，其他列都可以省略；不填条码会自动生成。</div>
    <textarea class="import-area" id="importText" placeholder="例如：&#10;iPhone 15 Pro Max,Apple,A3108,8+256G,原色钛金属,6901234567890,8000,8999,2&#10;华为 Mate 60 Pro,华为,,12+512G,雅川青,,6500,6999,2&#10;小米 14,小米,,12+256G,黑色"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <input type="file" id="batchFile" accept=".csv,.txt" style="display:none">
      <button class="mini-btn" id="btnPickFile" style="flex:1;">选择 CSV 文件</button>
      <button class="mini-btn" id="btnParsePreview" style="flex:1;background:#2E7D32;color:#fff;border-color:#2E7D32;">解析预览</button>
    </div>
    <div id="importPreviewWrap" style="display:none;"><div class="import-preview" id="importPreview"></div></div>
    <div class="modal-btns" style="margin-top:12px;"><button data-act="cancel">取消</button><button class="primary" data-act="ok" id="btnConfirmImport" disabled>确认导入</button></div>`);
  let parsedRows = [];
  const textarea = mask.querySelector('#importText');
  const previewWrap = mask.querySelector('#importPreviewWrap');
  const preview = mask.querySelector('#importPreview');
  const fileInput = mask.querySelector('#batchFile');
  mask.querySelector('[data-act="cancel"]').onclick = close;
  mask.querySelector('#btnDownloadTpl').onclick = downloadImportTemplate;
  mask.querySelector('#btnPickFile').onclick = () => fileInput.click();
  fileInput.onchange = e => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = () => { textarea.value = String(reader.result || ''); toast('已读取文件，点「解析预览」查看'); }; reader.readAsText(file, 'UTF-8'); e.target.value = ''; };
  mask.querySelector('#btnParsePreview').onclick = () => {
    const text = textarea.value.trim();
    if(!text){ toast('请先粘贴文本或选择文件'); return; }
    const result = parseImportText(text);
    parsedRows = result.rows;
    if(parsedRows.length === 0 && result.errors.length === 0){ toast('没有解析到任何商品'); return; }
    const existingCodes = new Set(products.map(p => p.barcode));
    const newCodes = new Set();
    let conflictCount = 0;
    const previewRows = parsedRows.map(r => {
      const isDup = existingCodes.has(r.barcode) || newCodes.has(r.barcode);
      if(isDup) conflictCount++;
      if(!isDup) newCodes.add(r.barcode);
      return { ...r, conflict: isDup };
    });
    previewWrap.style.display = 'block';
    preview.innerHTML = previewRows.slice(0, 50).map(r => `<div class="row ${r.conflict ? 'err' : ''}"><span class="n">${esc(r.name)}</span><span class="c">${esc(r.barcode)}</span>${r.conflict ? '<span style="color:var(--red);">条码冲突</span>' : ''}</div>`).join('') + (previewRows.length > 50 ? `<div class="row" style="justify-content:center;color:var(--text2);">... 还有 ${previewRows.length - 50} 件未显示</div>` : '') + (result.errors.length > 0 ? `<div class="row err">跳过 ${result.errors.length} 行无效数据</div>` : '');
    parsedRows = previewRows.filter(r => !r.conflict);
    const okBtn = mask.querySelector('#btnConfirmImport');
    okBtn.disabled = parsedRows.length === 0;
    okBtn.textContent = `确认导入 ${parsedRows.length} 件` + (conflictCount ? ` (跳过 ${conflictCount} 件冲突)` : '');
  };
  mask.querySelector('#btnConfirmImport').onclick = () => {
    if(parsedRows.length === 0) return;
    const now = Date.now(); let added = 0;
    parsedRows.forEach(r => {
      products.push({ id: uid(), name: r.name, brand: r.brand, model: r.model, spec: r.spec, color: r.color, barcode: r.barcode, priceIn: r.priceIn, priceOut: r.priceOut, warnStock: r.warnStock, remark: r.remark, stock: 0, createdAt: now, updatedAt: now });
      added++;
    });
    saveProducts(); close(); toast(`成功导入 ${added} 件商品`); renderProductList(); showView('list');
  };
}
$('#btnBatchImport').addEventListener('click', openBatchImport);

/* ==================== 通用弹窗 ==================== */
function showModal(html){
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(mask);
  requestAnimationFrame(()=> mask.classList.add('show'));
  const close = () => { mask.classList.remove('show'); setTimeout(()=> mask.remove(), 200); };
  mask.addEventListener('click', e => { if(e.target === mask) close(); });
  return { mask, close };
}

/* ==================== 单次扫码 ==================== */
async function scanOnce(onResult){
  const { mask, close } = showModal(`
    <div class="modal-title">扫描条码</div>
    <div id="scanOnceReader" style="width:100%;min-height:220px;background:#000;border-radius:10px;overflow:hidden;"></div>
    <div style="height:12px;"></div>
    <button class="btn-plain" id="scanOnceCancel">取消</button>`);
  const q = new Html5Qrcode('scanOnceReader', { verbose:false });
  let done = false;
  const stop = async () => { if(done) return; done = true; try{ await q.stop(); q.clear(); }catch(e){} };
  mask.querySelector('#scanOnceCancel').onclick = async () => { await stop(); close(); };
  try{
    await q.start({ facingMode:'environment' }, { fps:12, qrbox:(w,h)=>({width:Math.floor(w*0.9),height:Math.floor(h*0.5)}), aspectRatio:1.0 },
      async (text) => { await stop(); close(); setTimeout(()=>onResult(String(text).trim()), 200); }, () => {});
  }catch(e){
    mask.querySelector('#scanOnceReader').innerHTML = '<div class="empty" style="color:#fff;padding:30px 16px;">无法启动摄像头<br>请使用 HTTPS 访问并允许权限</div>';
  }
}

/* ==================== 打印条码（系统打印） ==================== */
function printBarcode(p) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  try {
    // 使用二维码生成器生成 SVG
    const qr = qrcode(0, 'M');
    qr.addData(p.barcode);
    qr.make();
    const qrSvg = qr.createSvgTag(3, 0).replace(/<svg[^>]*>/, '<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">');
    const configLine = buildConfigLine(p);
    const win = window.open('', '_blank');
    win.document.write(`
      <!DOCTYPE html><html><head><meta charset="UTF-8"><title>打印条码 - ${esc(p.name)}</title>
      <style>* { box-sizing: border-box; } body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; padding: 20px; margin: 0; }
      .label { display: inline-block; border: 1px dashed #ccc; padding: 12px 24px; margin: 10px; border-radius: 6px; background: #fff; }
      .name { font-size: 15px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; }
      .config { font-size: 12px; color: #555; margin-bottom: 6px; white-space: nowrap; }
      .qrcode { display: flex; justify-content: center; margin: 8px 0; }
      .qrcode svg { width: 120px; height: 120px; }
      .code { font-family: monospace; font-size: 13px; letter-spacing: 1px; margin-top: 4px; color: #333; }
      @media print { body { padding: 0; } .label { border: none; margin: 0; padding: 8px; } }</style>
      </head><body><div class="label"><div class="name">${esc(p.name)}</div>${configLine ? `<div class="config">${esc(configLine)}</div>` : ''}<div class="qrcode">${qrSvg}</div><div class="code">${esc(p.barcode)}</div></div>
      <script>window.onload = function() { setTimeout(function() { window.print(); }, 200); };<\/script></body></html>`);
    win.document.close();
  } catch (e) { toast('二维码格式不支持生成'); }
}

/* ==================== 生成标签 Canvas（供预览和打印共用） ==================== */
// ⚠️ 请根据你的实际标签纸尺寸修改以下参数（1mm ≈ 8px）
// 50mm × 30mm：w_px = 384, h_px = 240
const B1_LABEL_SIZE = { w_px: 384, h_px: 240, offset_y_px: 0 };

function generateLabelCanvas(product) {
  const canvas = document.createElement('canvas');
  canvas.width = B1_LABEL_SIZE.w_px;
  canvas.height = B1_LABEL_SIZE.h_px;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 文字自适应函数
  function fitTextToBox(text, maxWidth, maxHeight, fontWeight = 'normal') {
    let fontSize = Math.min(maxHeight, 100);
    let font = `${fontWeight} ${fontSize}px sans-serif`;
    ctx.font = font;
    while (fontSize > 8) {
      if (ctx.measureText(text).width <= maxWidth && fontSize <= maxHeight) {
        return { font: `${fontWeight} ${fontSize}px sans-serif`, size: fontSize };
      }
      fontSize--;
      ctx.font = `${fontWeight} ${fontSize}px sans-serif`;
    }
    return { font: `${fontWeight} 8px sans-serif`, size: 8 };
  }

  // ================= 1. 顶部：商品名称 =================
  const nameText = product.name || '';
  const nameH = 45;      // 名称区域高度
  const nameY = 8;       // 名称区域起始 Y
  const nameFit = fitTextToBox(nameText, canvas.width - 20, nameH, 'bold');
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = nameFit.font;
  ctx.fillText(nameText, canvas.width / 2, nameY + nameH / 2);

  // ================= 2. 底部：条码数字 =================
  const barcodeText = product.barcode || '';
  const codeH = 25;      // 数字区域高度
  const codeY = canvas.height - codeH - 8;
  const codeFit = fitTextToBox(barcodeText, canvas.width - 20, codeH);
  ctx.font = codeFit.font;
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(barcodeText, canvas.width / 2, codeY + codeH / 2);

  // ================= 3. 中间：左侧二维码 + 右侧文字 =================
  const midY = nameY + nameH;      // 中间区域起始 Y
  const midH = codeY - midY;       // 中间区域高度

  // 构造右侧文字行
  const infoLines = [];
  const bm = [product.brand, product.model].filter(Boolean).join(' ');
  if (bm) infoLines.push(bm);
  const sc = [product.spec, product.color].filter(Boolean).join(' / ');
  if (sc) infoLines.push(sc);
  if (product.remark) infoLines.push('备注: ' + product.remark);

  // 二维码尺寸和位置
  const qrSize = 140;
  const qrX = 10;
  const qrY = midY + (midH - qrSize) / 2;

  // 生成二维码
  try {
    const qr = qrcode(0, 'M');
    qr.addData(barcodeText);
    qr.make();
    const qrCount = qr.getModuleCount();
    const cellSize = Math.floor(qrSize / qrCount);
    const actualQrSize = cellSize * qrCount;
    const offsetX = qrX + (qrSize - actualQrSize) / 2;
    const offsetY = qrY + (qrSize - actualQrSize) / 2;

    const qrCanvas = document.createElement('canvas');
    qrCanvas.width = actualQrSize;
    qrCanvas.height = actualQrSize;
    const qrCtx = qrCanvas.getContext('2d');
    qrCtx.fillStyle = '#FFFFFF';
    qrCtx.fillRect(0, 0, actualQrSize, actualQrSize);
    qrCtx.fillStyle = '#000000';
    for (let row = 0; row < qrCount; row++) {
      for (let col = 0; col < qrCount; col++) {
        if (qr.isDark(row, col)) {
          qrCtx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }
    ctx.drawImage(qrCanvas, offsetX, offsetY);
  } catch (e) {
    console.error('二维码生成失败', e);
  }

  // 绘制右侧文字
  if (infoLines.length > 0) {
    const textX = qrX + qrSize + 10; // 10 + 140 + 10 = 160
    const textW = canvas.width - textX - 10; // 384 - 160 - 10 = 214
    const lineHeight = midH / infoLines.length;

    infoLines.forEach((lineText, index) => {
      const lineY = midY + index * lineHeight;
      const textFit = fitTextToBox(lineText, textW, lineHeight * 0.8);
      ctx.font = textFit.font;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000000';
      ctx.fillText(lineText, textX, lineY + lineHeight / 2);
    });
  }
  return canvas;
}

/* ==================== 蓝牙打印（精臣 NIMBOT B1） ==================== */
async function blePrint(product) {
  if (!navigator.bluetooth) { toast('当前浏览器不支持蓝牙，请用安卓 Chrome 或 Edge'); return; }
  if (typeof Niimbot === 'undefined') { toast('蓝牙驱动未加载，请检查网络后刷新页面'); return; }

  const canvas = generateLabelCanvas(product);
  const dataUrl = canvas.toDataURL('image/png');

  toast('正在连接打印机...');
  try {
    const model = { name_prefixes: ['B1'], task: 'b1', density: 3, label_type: 1, speed: 1 };
    await Niimbot.printImage(dataUrl, { model: model, size: B1_LABEL_SIZE });
    toast('打印指令已发送');
  } catch (e) {
    console.error('蓝牙打印失败', e);
    if (e.name === 'NotFoundError') toast('未选择打印机，已取消');
    else if (e.name === 'SecurityError') toast('需要 HTTPS 才能使用蓝牙');
    else toast('打印失败：' + (e.message || '请重试'));
  }
}

/* ==================== 打印预览弹窗 ==================== */
function showPrintPreview(product) {
  const canvas = generateLabelCanvas(product);
  const dataUrl = canvas.toDataURL('image/png');

  const { mask, close } = showModal(`
    <div class="modal-title">打印预览</div>
    <div style="text-align:center; padding:10px 0; background:#f8fafc; border-radius:8px; border:1px dashed #cbd5e1; margin-bottom:16px;">
      <img src="${dataUrl}" style="max-width:100%; height:auto; display:block; margin:0 auto; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
    </div>
    <div style="font-size:12px; color:#6B7280; text-align:center; margin-bottom:16px;">
      当前标签尺寸：50mm × 30mm<br>如果预览显示正常，可直接打印
    </div>
    <div class="modal-btns">
      <button data-act="cancel">取消</button>
      <button class="primary" data-act="print">立即打印</button>
    </div>`);
  mask.querySelector('[data-act="cancel"]').onclick = close;

}

/* ==================== 保存单张条码图 ==================== */
function saveBarcodeImage(p) {
  const canvas = generateLabelCanvas(p);
  canvas.toBlob(blob => {
    if (!blob) { toast('生成图片失败'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `标签_${(p.name||'').replace(/[\\/:*?"<>|]/g,'_')}_${p.barcode}.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('已下载标签图片');
  }, 'image/png');
}

/* ==================== 批量下载所有条码（ZIP） ==================== */
async function batchDownloadBarcodes() {
  if (products.length === 0) { toast('还没有商品，无法下载'); return; }
  if (typeof JSZip === 'undefined') { toast('打包组件未加载，请检查网络后刷新'); return; }
  const nameCount = {};
  const { mask, close } = showModal(`
    <div class="modal-title">批量下载标签</div>
    <div class="modal-body">正在生成 ${products.length} 张标签图片...<div id="batchProgress" style="margin-top:10px;font-size:13px;color:#6B7280;">准备中</div></div>`);
  const progressEl = mask.querySelector('#batchProgress');
  const zip = new JSZip(); const folder = zip.folder('标签图片');
  let ok = 0, fail = 0;
  for (let i = 0; i < products.length; i++) {
    const p = products[i];
    progressEl.textContent = `正在处理 ${i + 1} / ${products.length}：${p.name}`;
    try {
      const canvas = generateLabelCanvas(p);
      const safeName = (p.name || '未命名').replace(/[\\/:*?"<>|]/g, '_').slice(0, 30);
      const safeCode = (p.barcode || 'nocode').replace(/[\\/:*?"<>|]/g, '_');
      let baseName = `${safeName}_${safeCode}`;
      if (nameCount[baseName]) { nameCount[baseName]++; baseName = `${baseName}(${nameCount[baseName]})`; } else { nameCount[baseName] = 1; }
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (blob) { folder.file(`${baseName}.png`, blob); ok++; } else { fail++; }
    } catch (e) {
      fail++;
    }
    if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
  }
  progressEl.textContent = '正在打包 ZIP...';
  try {
    const zipBlob = await zip.generateAsync({ type: 'blob' }, meta => { progressEl.textContent = `正在打包... ${Math.round(meta.percent)}%`; });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    a.href = url; a.download = `标签打包_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.zip`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    close(); toast(`已完成：成功 ${ok} 张${fail ? `，失败 ${fail} 张` : ''}`);
  } catch (e) { console.error(e); close(); toast('打包失败，请重试'); }
}
$('#btnBatchBarcode').addEventListener('click', batchDownloadBarcodes);
