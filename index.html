:root{--ios-blue:#007AFF;--ios-green:#34C759;--ios-red:#FF3B30;--ios-orange:#FF9500;--ios-purple:#AF52DE;--text:#1C1C1E;--text2:rgba(60,60,67,.6);--text3:rgba(60,60,67,.3);--bg-input:rgba(120,120,128,.12);--separator:rgba(60,60,67,.29);--separator-soft:rgba(60,60,67,.12);--glass-border:rgba(255,255,255,.6);--radius:22px;--shadow-1:0 1px 2px rgba(0,0,0,.04);--shadow-2:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);--shadow-3:0 8px 32px rgba(0,0,0,.12);--shadow-blue:0 8px 24px rgba(0,122,255,.32);}

.group-header{font-size:12px;font-weight:700;color:var(--text2);padding:8px 4px 4px;margin:0 -16px 4px;padding-left:20px;background:linear-gradient(180deg,rgba(242,242,247,.98) 70%,rgba(242,242,247,0));position:sticky;top:0;z-index:2;letter-spacing:.5px;display:flex;align-items:center;gap:6px;}.group-header .group-count{font-size:10.5px;font-weight:500;color:var(--text3);}.empty{text-align:center;color:var(--text2);font-size:14px;padding:80px 24px;line-height:2;letter-spacing:-.2px;}.empty b{color:var(--ios-blue);font-weight:600;}
.index-bar{position:absolute;right:3px;top:50%;transform:translateY(-50%);z-index:20;display:none;flex-direction:column;gap:0;padding:6px 2px;background:rgba(255,255,255,.62);backdrop-filter:blur(15px);border-radius:100px;box-shadow:0 4px 14px rgba(0,0,0,.08);user-select:none;touch-action:none;max-height:75vh;overflow:hidden;}.index-bar.show{display:flex;}.index-bar .idx{width:20px;height:15px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ios-blue);cursor:pointer;border-radius:5px;transition:all .12s;letter-spacing:-.3px;}.index-bar .idx.active{background:linear-gradient(180deg,#3395FF,#007AFF);color:#fff;transform:scale(1.15);box-shadow:0 2px 6px rgba(0,122,255,.3);}
.fab{position:fixed;right:calc(50% - 320px + 20px);bottom:82px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%);color:#fff;font-size:30px;line-height:1;font-weight:300;box-shadow:var(--shadow-blue);cursor:pointer;z-index:9;display:flex;align-items:center;justify-content:center;transition:all .22s;}@media (max-width:676px){.fab{right:20px;}}.fab:active{transform:scale(.9);box-shadow:0 4px 12px rgba(0,122,255,.24);}.fab::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 50%);pointer-events:none;}

.d-mini{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}.d-mini button{flex:1;min-width:76px;height:40px;border:0;background:rgba(255,255,255,.9);border-radius:12px;font-size:12.5px;color:var(--text);cursor:pointer;font-weight:500;letter-spacing:-.2px;box-shadow:var(--shadow-1);transition:all .18s;}.d-mini button:active{transform:scale(.96);box-shadow:none;}.btn-ble{background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%)!important;color:#fff!important;font-weight:600!important;box-shadow:var(--shadow-blue)!important;}
.section-title{font-size:13px;font-weight:600;margin:24px 0 10px;color:var(--text2);letter-spacing:.2px;padding-left:4px;text-transform:uppercase;}.info-box{background:rgba(255,255,255,.78);backdrop-filter:blur(20px);border-radius:var(--radius);padding:16px 18px;font-size:15px;line-height:2;border:.5px solid var(--glass-border);box-shadow:var(--shadow-2);letter-spacing:-.2px;}.info-box b{color:var(--text2);font-weight:400;display:inline-block;min-width:68px;}.info-box > div + div{border-top:.5px solid var(--separator-soft);padding-top:6px;margin-top:6px;}

.modal-btns{display:flex;gap:8px;margin-top:8px;}.modal-btns button{flex:1;height:46px;border-radius:12px;font-size:16px;cursor:pointer;border:0;background:rgba(120,120,128,.12);color:var(--text);font-weight:500;transition:all .18s;letter-spacing:-.3px;}.modal-btns button:active{transform:scale(.97);background:rgba(120,120,128,.2);}.modal-btns button.primary{background:linear-gradient(180deg,#3395FF 0%,#007AFF 100%);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(0,122,255,.28);}.modal-btns button.danger{background:linear-gradient(180deg,#FF6961 0%,#FF3B30 100%);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(255,59,48,.28);}
.sort-list{display:flex;flex-direction:column;background:rgba(120,120,128,.06);border-radius:14px;margin-bottom:16px;overflow:hidden;}.sort-option{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:15px;cursor:pointer;border-bottom:.5px solid var(--separator-soft);transition:background .15s;letter-spacing:-.2px;}.sort-option:last-child{border-bottom:0;}.sort-option:active{background:rgba(120,120,128,.1);}.sort-option .check{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--separator);display:flex;align-items:center;justify-content:center;transition:all .18s;}.sort-option.active .check{background:linear-gradient(180deg,#3395FF,#007AFF);border-color:transparent;}.sort-option.active .check::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}.sort-option .label{flex:1;}.sort-option.active .label{color:var(--ios-blue);font-weight:600;}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px) scale(.94);background:rgba(30,30,32,.92);backdrop-filter:blur(20px);color:#fff;font-size:14px;font-weight:500;padding:12px 22px;border-radius:100px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:80vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.32);letter-spacing:-.2px;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
.import-tip{font-size:12.5px;color:var(--text2);background:rgba(0,122,255,.08);border-radius:12px;padding:12px 14px;line-height:1.7;margin-bottom:12px;letter-spacing:-.1px;}.import-tip code{background:rgba(255,255,255,.9);color:var(--ios-blue);padding:2px 6px;border-radius:5px;font-size:11px;font-family:monospace;}.import-area{width:100%;min-height:140px;max-height:280px;border:0;border-radius:12px;padding:12px;font-size:12.5px;font-family:monospace;background:var(--bg-input);outline:none;resize:vertical;transition:all .2s;letter-spacing:-.1px;line-height:1.6;}.import-area:focus{background:rgba(120,120,128,.16);box-shadow:0 0 0 4px rgba(0,122,255,.12);}.import-preview{max-height:220px;overflow-y:auto;border:0;border-radius:12px;margin-top:12px;font-size:12.5px;background:rgba(120,120,128,.06);}.import-preview .row{display:flex;gap:8px;padding:8px 12px;border-bottom:.5px solid var(--separator-soft);align-items:center;}.import-preview .row:last-child{border-bottom:0;}.import-preview .row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;letter-spacing:-.1px;}.import-preview .row .c{color:var(--text2);font-family:monospace;font-size:11px;}.import-preview .row.err{background:rgba(255,59,48,.08);color:var(--ios-red);}.tpl-btn{width:100%;height:44px;border:0;border-radius:12px;background:rgba(0,122,255,.1);color:var(--ios-blue);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:12px;transition:all .18s;letter-spacing:-.2px;}.tpl-btn:active{background:rgba(0,122,255,.2);transform:scale(.98);}
.bp-toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:rgba(120,120,128,.08);border-radius:12px;margin-bottom:10px;font-size:13.5px;}.bp-toolbar label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-weight:500;letter-spacing:-.2px;}.bp-list{max-height:320px;overflow-y:auto;border-radius:12px;background:rgba(120,120,128,.06);}.bp-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:.5px solid var(--separator-soft);font-size:14px;transition:background .15s;letter-spacing:-.2px;cursor:pointer;}.bp-item:hover{background:rgba(120,120,128,.06);}.bp-item:last-child{border-bottom:0;}.bp-item input[type="checkbox"]{width:20px;height:20px;flex:none;cursor:pointer;accent-color:var(--ios-blue);border-radius:50%;}.bp-item .bp-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}.bp-item .bp-code{font-family:monospace;font-size:11px;color:var(--text2);flex:none;}.bp-progress{text-align:center;padding:20px 0;font-size:14.5px;color:var(--text);line-height:1.8;letter-spacing:-.2px;font-weight:500;}.bp-progress .bp-bar{height:6px;background:rgba(120,120,128,.16);border-radius:3px;overflow:hidden;margin-top:14px;}.bp-progress .bp-bar-inner{height:100%;background:linear-gradient(90deg,#3395FF,#007AFF);width:0;transition:width .4s;border-radius:3px;}
.analysis-body{padding:16px 16px 100px;}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}.stat-card{background:rgba(255,255,255,.78);backdrop-filter:blur(20px);border-radius:var(--radius);padding:14px 16px;border:.5px solid var(--glass-border);box-shadow:var(--shadow-2);position:relative;overflow:hidden;}.stat-card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 50%);pointer-events:none;opacity:.5;}.stat-card.full{grid-column:1/-1;}.stat-label{font-size:12px;color:var(--text2);font-weight:500;letter-spacing:-.1px;margin-bottom:6px;position:relative;z-index:1;display:flex;align-items:center;gap:4px;}.stat-value{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.5px;position:relative;z-index:1;font-variant-numeric:tabular-nums;}.stat-value.small{font-size:20px;}.stat-value.blue{color:var(--ios-blue);}.stat-value.green{color:var(--ios-green);}.stat-value.orange{color:var(--ios-orange);}.stat-value.red{color:var(--ios-red);}.stat-unit{font-size:13px;font-weight:500;color:var(--text2);margin-left:4px;}.stat-sub{font-size:11.5px;color:var(--text2);margin-top:4px;position:relative;z-index:1;letter-spacing:-.1px;}
.analysis-block{background:rgba(255,255,255,.78);backdrop-filter:blur(20px);border-radius:var(--radius);padding:16px;border:.5px solid var(--glass-border);box-shadow:var(--shadow-2);margin-bottom:14px;position:relative;overflow:hidden;}.analysis-block::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 30%);pointer-events:none;opacity:.5;}.analysis-title{font-size:14px;font-weight:600;margin:0 0 14px;color:var(--text);letter-spacing:-.2px;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;}.analysis-title .tag{font-size:11px;font-weight:500;color:var(--text2);background:rgba(120,120,128,.1);padding:3px 8px;border-radius:8px;letter-spacing:-.1px;}.rank-list{position:relative;z-index:1;}.rank-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--separator-soft);}.rank-item:last-child{border-bottom:0;}.rank-no{flex:none;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(120,120,128,.1);color:var(--text2);letter-spacing:-.2px;}.rank-info{flex:1;min-width:0;}.rank-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}.rank-sub{font-size:11.5px;color:var(--text2);margin-top:2px;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.rank-value{flex:none;font-size:14px;font-weight:700;color:var(--ios-blue);font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:8px;position:relative;z-index:1;padding-bottom:20px;}.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;}.chart-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#3395FF,#007AFF);transition:all .3s;min-height:2px;box-shadow:0 2px 6px rgba(0,122,255,.2);position:relative;}.chart-bar.out{background:linear-gradient(180deg,#FF6961,#FF3B30);box-shadow:0 2px 6px rgba(255,59,48,.2);}.chart-bar-label{font-size:9.5px;color:var(--text2);position:absolute;bottom:-18px;white-space:nowrap;letter-spacing:-.1px;}.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--text2);position:relative;z-index:1;}.chart-legend span{display:flex;align-items:center;gap:5px;}.chart-legend .dot{width:8px;height:8px;border-radius:2px;}.chart-legend .dot.blue{background:#007AFF;}.chart-legend .dot.red{background:#FF3B30;}
.progress-line{height:8px;background:rgba(120,120,128,.1);border-radius:4px;overflow:hidden;margin-top:6px;position:relative;z-index:1;}.progress-line-inner{height:100%;border-radius:4px;background:linear-gradient(90deg,#3395FF,#007AFF);transition:width .4s;}.progress-line-inner.green{background:linear-gradient(90deg,#40D86E,#34C759);}
.time-tabs{display:flex;gap:6px;background:rgba(120,120,128,.08);border-radius:10px;padding:3px;margin-bottom:14px;position:relative;z-index:1;}.time-tabs button{flex:1;height:30px;border:0;background:transparent;border-radius:7px;font-size:12.5px;color:var(--text);cursor:pointer;font-weight:500;letter-spacing:-.2px;transition:all .18s;}.time-tabs button.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.snap-list{max-height:400px;overflow-y:auto;border-radius:14px;background:rgba(120,120,128,.06);margin-bottom:12px;}.snap-item{padding:12px 14px;border-bottom:.5px solid var(--separator-soft);cursor:pointer;transition:background .15s;}.snap-item:last-child{border-bottom:0;}.snap-item:active{background:rgba(120,120,128,.1);}.snap-item .snap-time{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;letter-spacing:-.2px;}.snap-item .snap-meta{font-size:12px;color:var(--text2);letter-spacing:-.1px;}.snap-item .snap-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:100px;font-size:10.5px;font-weight:600;}.snap-item .snap-badge.auto{background:rgba(0,122,255,.14);color:var(--ios-blue);}.snap-item .snap-badge.manual{background:rgba(52,199,89,.14);color:var(--ios-green);}.snap-item .snap-badge.before{background:rgba(255,149,0,.14);color:var(--ios-orange);}
@media (max-width:480px){.d-name{font-size:24px;}.field input,.field textarea{font-size:16px;}.modal{max-width:100%;}.stat-value{font-size:22px;}}
</style>

<body>
<div id="app">
  <header id="topbar">
    <button class="tb-btn hidden" id="btnBack">‹</button>
    <h1 id="tbTitle"><span class="sync-dot"></span>龙腾手机库存</h1>
    <button class="tb-btn" id="btnSyncNow" title="本地模式">⟳</button>
  </header>
  <div id="syncBar"></div>
  <main id="main">
    <section id="view-list" class="view active">
      <div class="search-wrap"><input id="searchInput" type="search" placeholder="搜索 名称 / 品牌 / 型号 / 条码"></div>
      <div class="filter-bar">
        <div class="cat-tabs" id="catTabs">
          <button data-cat="all" class="active">全部 <span class="count" id="catCountAll">0</span></button>
          <button data-cat="apple">苹果区 <span class="count" id="catCountApple">0</span></button>
          <button data-cat="android">安卓区 <span class="count" id="catCountAndroid">0</span></button>
          <button data-cat="other">其他 <span class="count" id="catCountOther">0</span></button>
        </div>
        <button class="sort-btn" id="sortBtn" title="排序">⇅</button>
      </div>
      <div id="productList" class="list"></div>
    </section>
    <section id="view-add" class="view">
      <div class="form-body">
        <div class="field"><label>商品名称 <span class="req">*</span></label><input id="fName" type="text" placeholder="如 iPhone 15 Pro Max"></div>
        <div class="row2"><div class="field"><label>品牌</label><input id="fBrand" placeholder="Apple"></div><div class="field"><label>型号</label><input id="fModel" placeholder="A3108"></div></div>
        <div class="row2"><div class="field"><label>规格</label><input id="fSpec" placeholder="8G+256G"></div><div class="field"><label>颜色</label><input id="fColor" placeholder="原色钛金属"></div></div>
        <div class="field"><label>商品条码 <span class="req">*</span></label><div class="input-with-actions"><input id="fBarcode" placeholder="扫描 / 输入 / 生成"><button type="button" class="mini-btn" id="btnScanBarcode">扫描</button><button type="button" class="mini-btn" id="btnGenBarcode">生成</button></div></div>
        <div class="row2"><div class="field"><label>进货价</label><input id="fPriceIn" type="number" inputmode="decimal" placeholder="0.00"></div><div class="field"><label>销售价</label><input id="fPriceOut" type="number" inputmode="decimal" placeholder="0.00"></div></div>
        <div class="row2"><div class="field"><label id="lbStock">初始库存</label><input id="fStock" type="number" inputmode="numeric" value="0"></div><div class="field"><label>预警值</label><input id="fWarn" type="number" inputmode="numeric" value="2"></div></div>
        <div class="field"><label>备注</label><textarea id="fRemark" rows="2" placeholder="可选"></textarea></div>
        <button class="btn-primary" id="btnSaveProduct">保存</button>
      </div>
    </section>
    <section id="view-detail" class="view"><div class="detail-body" id="detailBody"></div></section>
    <section id="view-scan" class="view">
      <div class="scan-tabs"><button data-mode="query" class="active">扫码查询</button><button data-mode="in">扫码入库</button><button data-mode="out">扫码出库</button></div>
      <div id="reader" class="scan-reader"></div>
      <div class="scan-tip" id="scanTip">将二维码放入取景框内<span class="scan-hint">画面模糊时，点击取景框手动对焦</span><button class="focus-btn" id="btnRefocus">重新对焦</button></div>
    </section>
    <section id="view-analysis" class="view"><div class="analysis-body" id="analysisBody"></div></section>
    <section id="view-records" class="view">
      <div style="padding:16px;">
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="mini-btn" id="btnExport" style="flex:1;height:42px;">导出备份</button>
          <button class="mini-btn" id="btnImport" style="flex:1;height:42px;">导入备份</button>
          <button class="mini-btn" id="btnClearAll" style="flex:1;height:42px;background:rgba(255,59,48,.1);color:var(--ios-red);">清空数据</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="mini-btn" id="btnBatchImport" style="flex:1;height:42px;background:rgba(52,199,89,.12);color:var(--ios-green);">批量导入商品</button>
          <button class="mini-btn" id="btnBatchBarcode" style="flex:1;height:42px;">批量下载条码</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="mini-btn" id="btnBatchPrint" style="flex:1;height:42px;background:rgba(175,82,222,.12);color:var(--ios-purple);font-weight:600;">🖨 批量打印标签</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <button class="mini-btn" id="btnHistory" style="flex:1;height:42px;background:rgba(0,122,255,.12);color:var(--ios-blue);font-weight:600;">🕐 历史快照</button>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none">
        <div class="section-title">全部出入库流水（点击可查看详情）</div>
        <div class="card" style="padding:6px 16px;cursor:default;position:relative;z-index:1;"><div id="recordList"></div></div>
      </div>
    </section>
  </main>
  <div class="index-bar" id="indexBar"></div>
  <nav id="tabbar">
    <button data-tab="list" class="active"><span class="ic">📦</span>库存</button>
    <button data-tab="scan"><span class="ic">📷</span>扫码</button>
    <button data-tab="analysis"><span class="ic">📊</span>分析</button>
    <button data-tab="records"><span class="ic">📋</span>记录</button>
  </nav>
  <button class="fab" id="fabAdd">+</button>
</div>

<script>
/* ==================== 工具 ==================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtMoney(n){return(Number(n)||0).toFixed(2);}
function fmtNum(n){return(Number(n)||0).toLocaleString('zh-CN');}
function fmtTime(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtTimeFull(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),320);},2200);}
function highlight(text,kw){const s=String(text??'');if(!kw)return esc(s);const lower=s.toLowerCase();const idx=lower.indexOf(kw);if(idx===-1)return esc(s);return esc(s.slice(0,idx))+'<mark>'+esc(s.slice(idx,idx+kw.length))+'</mark>'+esc(s.slice(idx+kw.length));}
function showModal(html){const mask=document.createElement('div');mask.className='modal-mask';mask.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(mask);requestAnimationFrame(()=>mask.classList.add('show'));const close=()=>{mask.classList.remove('show');setTimeout(()=>mask.remove(),260);};mask.addEventListener('click',e=>{if(e.target===mask)close();});return{mask,close};}
function copyText(text,msg){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fallbackCopy(text,msg));}else fallbackCopy(text,msg);}
function fallbackCopy(text,msg){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg);}catch(e){toast('复制失败');}ta.remove();}

/* ==================== 分类 & 首字母 ==================== */
const APPLE_KEYS=['apple','苹果','iphone','ipad','macbook','airpods','apple watch','imac','mac mini','mac pro','mac studio'];
const ANDROID_KEYS=['华为','huawei','小米','xiaomi','红米','redmi','oppo','vivo','荣耀','honor','三星','samsung','galaxy','一加','oneplus','realme','真我','魅族','meizu','努比亚','nubia','联想','lenovo','摩托罗拉','motorola','诺基亚','nokia','索尼','sony','谷歌','google pixel','pixel','中兴','zte','传音','tecno','infinix','金立','gionee','美图','meitu','锤子','smartisan','坚果','乐视','letv','酷派','coolpad','天语','k-touch','波导','bird','夏新','amoi','朵唯','doov','小辣椒','8848','青橙','大可乐','ivvi','尼采','卓普','黑鲨','black shark','红魔','red magic','rog','玩家国度','iqoo','拯救者','legion','htc','lg','黑莓','blackberry','阿尔卡特','alcatel','夏普','sharp','富士通','fujitsu','京瓷','kyocera','tcl','海信','hisense','长虹','康佳','飞利浦','philips','微软','lumia','索尼爱立信','步步高','华硕','asus','小天才','科大讯飞','大疆','dji','360手机'];
function getProductCategory(p){const t=((p.brand||'')+' '+(p.name||'')+' '+(p.model||'')).toLowerCase();if(APPLE_KEYS.some(k=>t.includes(k)))return'apple';if(ANDROID_KEYS.some(k=>t.includes(k)))return'android';return'other';}
function getCategoryLabel(cat){return cat==='apple'?{text:'苹果',cls:'apple'}:cat==='android'?{text:'安卓',cls:'android'}:{text:'其他',cls:'other'};}
const BRAND_INITIALS={'apple':'A','苹果':'A','iphone':'I','ipad':'I','macbook':'M','imac':'I','mac mini':'M','mac pro':'M','mac studio':'M','airpods':'A','apple watch':'A','华为':'H','huawei':'H','荣耀':'R','honor':'R','小米':'X','xiaomi':'X','红米':'H','redmi':'H','黑鲨':'H','black shark':'H','oppo':'O','一加':'Y','oneplus':'Y','realme':'R','真我':'Z','vivo':'V','iqoo':'I','三星':'S','samsung':'S','galaxy':'G','魅族':'M','meizu':'M','努比亚':'N','nubia':'N','红魔':'H','red magic':'H','联想':'L','lenovo':'L','摩托罗拉':'M','motorola':'M','拯救者':'Z','legion':'L','诺基亚':'N','nokia':'N','索尼':'S','sony':'S','索尼爱立信':'S','谷歌':'G','google':'G','pixel':'P','中兴':'Z','zte':'Z','传音':'C','tecno':'T','infinix':'I','金立':'J','gionee':'J','美图':'M','meitu':'M','锤子':'C','smartisan':'S','坚果':'J','乐视':'L','letv':'L','酷派':'K','coolpad':'K','天语':'T','k-touch':'T','波导':'B','bird':'B','夏新':'X','amoi':'A','朵唯':'D','doov':'D','小辣椒':'X','8848':'#','青橙':'Q','大可乐':'D','ivvi':'I','尼采':'N','卓普':'Z','玩家国度':'W','rog':'R','华硕':'H','asus':'A','小天才':'X','科大讯飞':'K','大疆':'D','dji':'D','htc':'H','lg':'L','黑莓':'H','blackberry':'H','阿尔卡特':'A','alcatel':'A','夏普':'X','sharp':'X','富士通':'F','fujitsu':'F','京瓷':'J','kyocera':'K','tcl':'T','海信':'H','hisense':'H','长虹':'C','康佳':'K','飞利浦':'F','philips':'F','微软':'W','lumia':'L','步步高':'B','360手机':'S'};
function getProductInitial(p){const brand=(p.brand||'').toLowerCase().trim();const name=(p.name||'').toLowerCase().trim();const model=(p.model||'').toLowerCase().trim();const full=brand+' '+name+' '+model;if(brand){if(BRAND_INITIALS[brand])return BRAND_INITIALS[brand];for(const k in BRAND_INITIALS){if(brand.includes(k))return BRAND_INITIALS[k];}if(/^[a-z]/i.test(brand))return brand[0].toUpperCase();}const sorted=Object.keys(BRAND_INITIALS).sort((a,b)=>b.length-a.length);for(const k of sorted){if(full.includes(k))return BRAND_INITIALS[k];}if(name&&/^[a-z]/i.test(name))return name[0].toUpperCase();return'#';}

/* ==================== 搜索打分 ==================== */
function getMatchScore(p,kw){const name=(p.name||'').toLowerCase(),brand=(p.brand||'').toLowerCase(),model=(p.model||'').toLowerCase(),barcode=(p.barcode||'').toLowerCase(),spec=(p.spec||'').toLowerCase(),color=(p.color||'').toLowerCase();if(name===kw)return 100;if(name.startsWith(kw))return 90;if(name.includes(kw))return 80;const parts=kw.split(/\s+/).filter(Boolean);if(parts.length>1&&parts.every(pt=>name.includes(pt)))return 75;if(brand===kw)return 65;if(brand.startsWith(kw))return 62;if(brand.includes(kw))return 60;if(model===kw)return 55;if(model.includes(kw))return 50;if(barcode===kw)return 45;if(barcode.includes(kw))return 40;if(spec.includes(kw))return 30;if(color.includes(kw))return 25;return 0;}

/* ==================== 摄像头优化 ==================== */
function getVideoTrack(){const v=document.querySelector('#reader video')||document.querySelector('#scanOnceReader video');if(!v)return null;const s=v.srcObject;if(!s)return null;return s.getVideoTracks()[0]||null;}
async function applyCameraOptimization(){const t=getVideoTrack();if(!t)return;try{const caps=t.getCapabilities?.()||{};const c={};if(caps.focusMode&&caps.focusMode.includes('continuous'))c.focusMode='continuous';if(caps.whiteBalanceMode&&caps.whiteBalanceMode.includes('continuous'))c.whiteBalanceMode='continuous';if(caps.exposureCompensation){const r=caps.exposureCompensation;c.exposureCompensation=Math.max(r.min,Math.min(r.max,-1));}if(Object.keys(c).length>0)await t.applyConstraints({advanced:[c]});}catch(e){}}
async function triggerRefocus(){const t=getVideoTrack();if(!t)return;const caps=t.getCapabilities?.()||{};if(!caps.focusMode)return;try{if(caps.focusMode.includes('manual')){await t.applyConstraints({advanced:[{focusMode:'manual'}]});await new Promise(r=>setTimeout(r,80));}if(caps.focusMode.includes('continuous')){await t.applyConstraints({advanced:[{focusMode:'continuous'}]});}else if(caps.focusMode.includes('single-shot')){await t.applyConstraints({advanced:[{focusMode:'single-shot'}]});}}catch(e){}}

/* ==================== 数据层 ==================== */
let products=[],records=[];
function loadLocal(){try{products=JSON.parse(localStorage.getItem('ss_products')||'[]');}catch(e){products=[];}try{records=JSON.parse(localStorage.getItem('ss_records')||'[]');}catch(e){records=[];}}
function saveLocal(){localStorage.setItem('ss_products',JSON.stringify(products));localStorage.setItem('ss_records',JSON.stringify(records));}
let snapshotScheduled=false;
function scheduleSnapshot(){if(snapshotScheduled)return;snapshotScheduled=true;setTimeout(()=>{snapshotScheduled=false;try{pushSnapshot('auto');}catch(e){}},2000);}
function findProduct(id){return products.find(p=>p.id===id);}
function findByBarcode(code){return products.find(p=>p.barcode===code);}
function changeStock(productId,delta,remark='',actualPrice=null){
  if(!delta)return{ok:false,msg:'数量不能为 0'};
  const p=findProduct(productId);if(!p)return{ok:false,msg:'商品不存在'};
  const newStock=p.stock+delta;if(newStock<0)return{ok:false,msg:`库存不足，当前库存 ${p.stock}`};
  p.stock=newStock;p.updatedAt=Date.now();
  const rec={id:uid(),productId:p.id,productName:p.name,barcode:p.barcode,type:delta>0?1:-1,quantity:Math.abs(delta),remark:remark||'',time:Date.now()};
  if(delta<0&&actualPrice!=null&&!isNaN(actualPrice)){rec.actualPrice=actualPrice;rec.priceIn=p.priceIn||0;}
  records.unshift(rec);saveLocal();scheduleSnapshot();return{ok:true,stock:newStock};
}
function undoRecord(recId){
  const idx=records.findIndex(r=>r.id===recId);if(idx===-1)return{ok:false,msg:'记录不存在'};
  const rec=records[idx];const p=findProduct(rec.productId);let newStock=0;
  if(p){const delta=rec.type>0?-rec.quantity:rec.quantity;newStock=p.stock+delta;if(newStock<0)return{ok:false,msg:`无法撤销：库存将变为负数（当前 ${p.stock} 台）`};p.stock=newStock;p.updatedAt=Date.now();}
  records.splice(idx,1);saveLocal();scheduleSnapshot();return{ok:true,stock:newStock,product:p,record:rec};
}

/* ==================== 历史快照 ==================== */
const SNAPSHOT_KEY='ss_history',MAX_SNAPSHOTS=20;
function getHistory(){try{return JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||'[]');}catch(e){return[];}}
function saveHistory(list){try{localStorage.setItem(SNAPSHOT_KEY,JSON.stringify(list));}catch(e){}}
function getDataHash(){const sumStock=products.reduce((s,p)=>s+(p.stock||0),0);const names=products.map(p=>p.name).join('|');return`${products.length}-${records.length}-${sumStock}-${names.length}-${names.slice(0,200)}`;}
function pushSnapshot(type){
  const list=getHistory(),now=Date.now(),hash=getDataHash();
  if(type==='auto'&&list.length>0&&list[0].hash===hash&&(now-list[0].time)<3*60*1000)return;
  list.unshift({id:uid(),time:now,type,hash,productsCount:products.length,recordsCount:records.length,totalStock:products.reduce((s,p)=>s+(p.stock||0),0),products:JSON.parse(JSON.stringify(products)),records:JSON.parse(JSON.stringify(records))});
  if(list.length>MAX_SNAPSHOTS)list.length=MAX_SNAPSHOTS;
  saveHistory(list);
}
function restoreSnapshot(snapId){
  const list=getHistory();const snap=list.find(s=>s.id===snapId);
  if(!snap)return{ok:false,msg:'快照不存在'};
  pushSnapshot('before-restore');
  products=JSON.parse(JSON.stringify(snap.products||[]));
  records=JSON.parse(JSON.stringify(snap.records||[]));
  saveLocal();
  return{ok:true,snapshot:snap};
}
async function openHistoryDialog(){
  const list=getHistory();
  const content=list.length===0
    ?`<div class="empty" style="padding:40px 20px;">暂无历史快照<br>每次修改数据后会自动保存快照</div>`
    :`<div class="snap-list">${list.map(snap=>{
      const d=new Date(snap.time),p=n=>String(n).padStart(2,'0');
      const timeStr=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      const badge=snap.type==='manual'?'<span class="snap-badge manual">手动</span>':snap.type==='before-clear'?'<span class="snap-badge before">清空前</span>':snap.type==='before-restore'?'<span class="snap-badge before">恢复前</span>':'<span class="snap-badge auto">自动</span>';
      return`<div class="snap-item" data-id="${esc(snap.id)}"><div class="snap-time">${timeStr}${badge}</div><div class="snap-meta">${snap.productsCount} 件商品 · 库存 ${snap.totalStock} 台 · ${snap.recordsCount} 条流水</div></div>`;
    }).join('')}</div>`;
  const{mask,close}=showModal(`<div class="modal-title">历史快照（最近 ${list.length}/${MAX_SNAPSHOTS}）</div><div style="font-size:12.5px;color:var(--text2);text-align:center;margin-bottom:12px;line-height:1.7;">点击任意快照即可恢复该时刻的数据<br>恢复前会先自动保存当前状态</div>${content}<div class="modal-btns" style="margin-top:12px;"><button data-act="manual">立即保存快照</button><button class="primary" data-act="cancel">关闭</button></div>`);
  mask.querySelector('[data-act="cancel"]').onclick=close;
  mask.querySelector('[data-act="manual"]').onclick=()=>{pushSnapshot('manual');toast('已保存当前快照（本地）');close();setTimeout(openHistoryDialog,500);};
  mask.querySelectorAll('.snap-item').forEach(item=>{
    item.onclick=()=>{
      const snap=list.find(s=>s.id===item.dataset.id);if(!snap)return;
      const d=new Date(snap.time),p=n=>String(n).padStart(2,'0');
      const timeStr=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      const{mask:m2,close:c2}=showModal(`<div class="modal-title">恢复快照</div><div class="modal-body">将恢复到 ${timeStr} 的状态：\n${snap.productsCount} 件商品 · 库存 ${snap.totalStock} 台 · ${snap.recordsCount} 条流水\n\n⚠️ 当前数据会先被保存为一个新快照，可以随时撤销此次恢复。</div><div class="modal-btns"><button data-act="cancel">取消</button><button class="primary" data-act="ok">确认恢复</button></div>`);
      m2.querySelector('[data-act="cancel"]').onclick=c2;
      m2.querySelector('[data-act="ok"]').onclick=()=>{
        const res=restoreSnapshot(snap.id);c2();
        if(res.ok){toast('已恢复快照（本地）');close();refreshCurrentView();}else toast(res.msg||'恢复失败');
      };
    };
  });
}
$('#btnHistory').addEventListener('click',openHistoryDialog);

/* ==================== 视图管理 ==================== */
let currentView='list',editingId=null,currentProductId=null;
const TITLES={list:'龙腾手机库存',add:'新增商品',detail:'商品详情',scan:'扫码',analysis:'数据分析',records:'出入库记录'};
function showView(name){
  if(currentView==='scan'&&name!=='scan')stopScan();
  currentView=name;$$('.view').forEach(v=>v.classList.remove('active'));
  const el=$('#view-'+name);if(el)el.classList.add('active');
  $('#tbTitle').innerHTML='<span class="sync-dot"></span>'+(TITLES[name]||'龙腾手机库存');
  const isRoot=(name==='list'||name==='scan'||name==='analysis'||name==='records');
  $('#btnBack').classList.toggle('hidden',isRoot);$('#tabbar').classList.toggle('hidden',!isRoot);
  $('#fabAdd').style.display=(name==='list')?'flex':'none';
  $$('#tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  if(name==='list')renderProductList();if(name==='records')renderRecords();if(name==='scan')startScan();if(name==='analysis')renderAnalysis();updateIndexBarVisibility();
}
$('#btnBack').addEventListener('click',()=>showView('list'));
$('#btnSyncNow').addEventListener('click',()=>toast('当前为本地模式，数据已自动保存在本机'));

/* ==================== 商品列表 ==================== */
let searchKeyword='',currentCategory='all',currentSort=localStorage.getItem('ss_sort_mode')||'default';
$('#searchInput').addEventListener('input',e=>{searchKeyword=e.target.value;renderProductList();});
$$('#catTabs button').forEach(btn=>{btn.addEventListener('click',()=>{$$('#catTabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCategory=btn.dataset.cat;renderProductList();});});
$('#sortBtn').addEventListener('click',openSortMenu);updateSortBtnUI();
function updateSortBtnUI(){const btn=$('#sortBtn');if(btn)btn.classList.toggle('has-custom',currentSort!=='default');}
function openSortMenu(){
  const options=[{key:'default',label:'默认（最近添加）'},{key:'name_asc',label:'名称 A→Z（含首字母索引）'},{key:'name_desc',label:'名称 Z→A（含首字母索引）'},{key:'stock_asc',label:'库存 少 → 多'},{key:'stock_desc',label:'库存 多 → 少'},{key:'price_asc',label:'售价 低 → 高'},{key:'price_desc',label:'售价 高 → 低'}];
  const{mask,close}=showModal(`<div class="modal-title">排序方式</div><div class="sort-list">${options.map(o=>`<div class="sort-option ${currentSort===o.key?'active':''}" data-key="${o.key}"><div class="check"></div><div class="label">${o.label}</div></div>`).join('')}</div><div class="modal-btns"><button data-act="cancel" style="flex:1;">取消</button></div>`);
  mask.querySelector('[data-act="cancel"]').onclick=close;
  mask.querySelectorAll('.sort-option').forEach(el=>{el.onclick=()=>{currentSort=el.dataset.key;localStorage.setItem('ss_sort_mode',currentSort);updateSortBtnUI();close();renderProductList();const label=options.find(o=>o.key===currentSort)?.label||'';toast('已按「'+label.split('（')[0]+'」排序');};});
}
function updateCategoryCounts(){let apple=0,android=0,other=0;products.forEach(p=>{const cat=getProductCategory(p);if(cat==='apple')apple++;else if(cat==='android')android++;else other++;});$('#catCountAll').textContent=products.length;$('#catCountApple').textContent=apple;$('#catCountAndroid').textContent=android;$('#catCountOther').textContent=other;}
function shouldShowIndex(){return currentView==='list'&&!searchKeyword.trim()&&(currentSort==='name_asc'||currentSort==='name_desc');}
let indexBarBound=false;
function updateIndexBarVisibility(){
  const bar=$('#indexBar');if(!bar)return;
  if(shouldShowIndex()&&$$('.group-header').length>0){
    bar.classList.add('show');
    bar.innerHTML=$$('.group-header').map(h=>`<div class="idx" data-idx="${esc(h.dataset.idx)}">${esc(h.dataset.idx)}</div>`).join('');
    if(!indexBarBound){bindIndexBarEvents();indexBarBound=true;}
    updateIndexHighlight();
  }else{bar.classList.remove('show');bar.innerHTML='';}
}
function bindIndexBarEvents(){
  const bar=$('#indexBar');
  const jump=e=>{const t=e.target.closest('.idx');if(!t)return;const h=document.querySelector(`.group-header[data-idx="${CSS.escape(t.dataset.idx)}"]`);if(h)h.scrollIntoView({behavior:'smooth',block:'start'});};
  bar.addEventListener('click',jump);
  let touching=false;
  const move=e=>{const t=e.touches[0]||e.changedTouches[0];if(!t)return;const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&el.classList.contains('idx')){const h=document.querySelector(`.group-header[data-idx="${CSS.escape(el.dataset.idx)}"]`);if(h)h.scrollIntoView({block:'start'});}};
  bar.addEventListener('touchstart',e=>{touching=true;move(e);},{passive:false});
  bar.addEventListener('touchmove',e=>{if(!touching)return;e.preventDefault();move(e);},{passive:false});
  bar.addEventListener('touchend',()=>{touching=false;});
  $('#view-list').addEventListener('scroll',updateIndexHighlight,{passive:true});
}
function updateIndexHighlight(){
  const bar=$('#indexBar');if(!bar||!bar.classList.contains('show'))return;
  const headers=$$('.group-header');if(!headers.length)return;
  let activeIdx=headers[0].dataset.idx;
  for(const h of headers){if(h.getBoundingClientRect().top<=80)activeIdx=h.dataset.idx;else break;}
  bar.querySelectorAll('.idx').forEach(el=>el.classList.toggle('active',el.dataset.idx===activeIdx));
}
function renderProductList(){
  updateCategoryCounts();
  const rawKw=searchKeyword.trim(),kw=rawKw.toLowerCase();
  let list=products.filter(p=>{
    if(currentCategory!=='all'&&getProductCategory(p)!==currentCategory)return false;
    return !kw||getMatchScore(p,kw)>0;
  });
  if(kw){list.sort((a,b)=>{const sa=getMatchScore(a,kw),sb=getMatchScore(b,kw);return sb!==sa?sb-sa:b.createdAt-a.createdAt;});}
  else{switch(currentSort){
    case'name_asc':list.sort((a,b)=>{const ia=getProductInitial(a),ib=getProductInitial(b);if(ia!==ib)return ia==='#'?1:ib==='#'?-1:ia.localeCompare(ib);return(a.name||'').localeCompare(b.name||'','zh-Hans-CN');});break;
    case'name_desc':list.sort((a,b)=>{const ia=getProductInitial(a),ib=getProductInitial(b);if(ia!==ib)return ia==='#'?1:ib==='#'?-1:ib.localeCompare(ia);return(b.name||'').localeCompare(a.name||'','zh-Hans-CN');});break;
    case'stock_asc':list.sort((a,b)=>(a.stock||0)-(b.stock||0));break;
    case'stock_desc':list.sort((a,b)=>(b.stock||0)-(a.stock||0));break;
    case'price_asc':list.sort((a,b)=>(a.priceOut||0)-(b.priceOut||0));break;
    case'price_desc':list.sort((a,b)=>(b.priceOut||0)-(a.priceOut||0));break;
    default:list.sort((a,b)=>b.createdAt-a.createdAt);
  }}
  const el=$('#productList');
  if(!list.length){
    let emptyMsg='';
    if(!products.length)emptyMsg='还没有商品<br>点击右下角 <b>+</b> 添加第一件商品';
    else if(rawKw)emptyMsg=`没有找到「${esc(rawKw)}」相关的商品<br>试试搜索名称、品牌或型号`;
    else if(currentCategory==='apple')emptyMsg='苹果区暂无商品<br>添加 Apple/iPhone 相关商品后会自动归入';
    else if(currentCategory==='android')emptyMsg='安卓区暂无商品<br>添加华为、小米等品牌后会自动归入';
    else if(currentCategory==='other')emptyMsg='其他区暂无商品<br>非苹果/安卓设备会归入此区';
    else emptyMsg='没有找到匹配的商品';
    el.innerHTML=`<div class="empty">${emptyMsg}</div>`;updateIndexBarVisibility();return;
  }
  const grouped=!kw&&(currentSort==='name_asc'||currentSort==='name_desc');
  if(grouped){
    const groups=new Map();
    list.forEach(p=>{const i=getProductInitial(p);if(!groups.has(i))groups.set(i,[]);groups.get(i).push(p);});
    const keys=Array.from(groups.keys()).sort((a,b)=>a==='#'?1:b==='#'?-1:a.localeCompare(b));
    el.innerHTML=keys.map(k=>`<div class="group-header" data-idx="${esc(k)}">${esc(k)}<span class="group-count">${groups.get(k).length} 款</span></div>${groups.get(k).map(p=>renderProductCard(p,kw)).join('')}`).join('');
  }else el.innerHTML=list.map(p=>renderProductCard(p,kw)).join('');
  el.querySelectorAll('.product-item').forEach(node=>{
    const id=node.dataset.id;
    node.addEventListener('click',()=>openDetail(id));
    let timer=null;
    const start=()=>{timer=setTimeout(()=>{timer=null;showQuickMenu(id);},600);};
    const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}};
    node.addEventListener('touchstart',start,{passive:true});
    node.addEventListener('touchend',cancel);
    node.addEventListener('touchmove',cancel,{passive:true});
    node.addEventListener('contextmenu',e=>{e.preventDefault();showQuickMenu(id);});
  });
  updateIndexBarVisibility();
}
function renderProductCard(p,kw){
  const cls=p.stock<=0?'danger':(p.stock<=p.warnStock?'warn':'ok');
  const sub=[p.brand,p.model,p.spec,p.color].filter(Boolean).join(' / ')||'—';
  const catLabel=getCategoryLabel(getProductCategory(p));
  const nameHtml=kw?highlight(p.name,kw):esc(p.name);
  return`<div class="card product-item" data-id="${esc(p.id)}"><div class="pi-main"><div class="pi-name-row"><span class="cat-badge ${catLabel.cls}">${catLabel.text}</span><span class="pi-name">${nameHtml}</span></div><div class="pi-sub">${esc(sub)}</div><div class="pi-code">${esc(p.barcode)}</div></div><div class="pi-right"><div class="pi-stock ${cls}">库存 ${p.stock}</div><div class="pi-price">¥${fmtMoney(p.priceOut)}</div></div></div>`;
}
function showQuickMenu(id){
  const p=findProduct(id);if(!p)return;
  const catLabel=getCategoryLabel(getProductCategory(p));

let analysisRange=7;
function renderAnalysis(){
  const el=$('#analysisBody');
  let appleCount=0,androidCount=0,otherCount=0,appleStock=0,androidStock=0,otherStock=0;
  products.forEach(p=>{const cat=getProductCategory(p);if(cat==='apple'){appleCount++;appleStock+=p.stock||0;}else if(cat==='android'){androidCount++;androidStock+=p.stock||0;}else{otherCount++;otherStock+=p.stock||0;}});
  const totalProducts=products.length,totalStock=products.reduce((s,p)=>s+(p.stock||0),0);
  const costValue=products.reduce((s,p)=>s+(p.stock||0)*(p.priceIn||0),0),saleValue=products.reduce((s,p)=>s+(p.stock||0)*(p.priceOut||0),0);
  const lowStockProducts=products.filter(p=>p.stock<=p.warnStock),outOfStockProducts=products.filter(p=>p.stock<=0);
  const topByValue=[...products].map(p=>({...p,value:(p.stock||0)*(p.priceIn||0)})).filter(p=>p.value>0).sort((a,b)=>b.value-a.value).slice(0,5);
  const maxValue=topByValue[0]?.value||1;
  const topByStock=[...products].filter(p=>p.stock>0).sort((a,b)=>b.stock-a.stock).slice(0,5);
  const maxStock=topByStock[0]?.stock||1;
  const lowList=lowStockProducts.slice(0,5);
  const now=Date.now(),rangeMs=analysisRange*24*60*60*1000;
  const rangeRecords=records.filter(r=>now-r.time<=rangeMs);
  const totalIn=rangeRecords.filter(r=>r.type>0).reduce((s,r)=>s+r.quantity,0);
  const totalOut=rangeRecords.filter(r=>r.type<0).reduce((s,r)=>s+r.quantity,0);
  const saleRecords=rangeRecords.filter(r=>r.type<0&&r.actualPrice!=null);
  const totalRevenue=saleRecords.reduce((s,r)=>s+(r.actualPrice||0)*r.quantity,0);
  const totalCost=saleRecords.reduce((s,r)=>s+(r.priceIn||0)*r.quantity,0);
  const grossProfit=totalRevenue-totalCost;
  const dayBuckets=[],dayLabels=[];
  for(let i=analysisRange-1;i>=0;i--){
    const dayStart=new Date();dayStart.setHours(0,0,0,0);dayStart.setDate(dayStart.getDate()-i);
    const start=dayStart.getTime(),end=start+86400000;
    dayBuckets.push({in:records.filter(r=>r.type>0&&r.time>=start&&r.time<end).reduce((s,r)=>s+r.quantity,0),out:records.filter(r=>r.type<0&&r.time>=start&&r.time<end).reduce((s,r)=>s+r.quantity,0)});
    dayLabels.push(`${dayStart.getMonth()+1}/${dayStart.getDate()}`);
  }
  const maxBarValue=Math.max(1,...dayBuckets.map(b=>Math.max(b.in,b.out)));
  const outMap={};records.filter(r=>r.type<0).forEach(r=>{outMap[r.productId]=(outMap[r.productId]||0)+r.quantity;});
  const topOut=Object.keys(outMap).map(pid=>{const p=findProduct(pid);return p?{name:p.name,barcode:p.barcode,qty:outMap[pid]}:null;}).filter(Boolean).sort((a,b)=>b.qty-a.qty).slice(0,5);
  const profitMap={};

/* ==================== 批量导入商品 ==================== */
function generateInternalBarcode(){return'2'+String(Date.now()).slice(-8)+String(Math.floor(Math.random()*100)).padStart(2,'0')+Math.floor(Math.random()*10);}
function parseImportText(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return{rows:[],errors:[]};
  const firstLine=lines[0];let sep=',';
  if(firstLine.includes('\t'))sep='\t';else if(firstLine.includes('，'))sep='，';
  const startIdx=firstLine.split(sep).map(c=>c.trim().toLowerCase()).some(c=>c.includes('名称')||c==='name'||c.includes('商品'))?1:0;
  const rows=[],errors=[];
  for(let i=startIdx;i<lines.length;i++){
    const cells=lines[i].split(sep).map(c=>c.replace(/^\uFEFF/,'').trim());
    if(!cells[0])continue;
    const [name,brand,model,spec,color,barcode,priceIn,priceOut,warnStock,stock,remark]=cells;
    if(!name){errors.push({line:i+1,msg:'商品名称为空',raw:lines[i]});continue;}
    rows.push({name,brand:brand||'',model:model||'',spec:spec||'',color:color||'',barcode:(barcode&&barcode.trim())?barcode.trim():generateInternalBarcode(),priceIn:parseFloat(priceIn)||0,priceOut:parseFloat(priceOut)||0,warnStock:parseInt(warnStock)||2,stock:parseInt(stock)||0,remark:remark||''});
  }
  return{rows,errors};
}
function openBatchImport(){
  const{mask,close}=showModal(`<div class="modal-title">批量导入商品</div><button class="tpl-btn" id="btnDownloadTpl">⬇ 下载 CSV 导入模板</button><div class="import-tip">每行一件商品，列顺序：<br><code>名称,品牌,型号,规格,颜色,条码,进货价,销售价,预警值,库存量,备注</code><br>除<b>名称</b>外可省略，不填条码会自动生成。</div><textarea class="import-area" id="importText" placeholder="例如：&#10;iPhone 15 Pro Max,Apple,A3108,8+256G,原色钛金属,6901234567890,8000,8999,2,5&#10;华为 Mate 60 Pro,华为,,12+512G,雅川青,,6500,6999,2,3"></textarea><div style="display:flex;gap:8px;margin-top:12px;"><input type="file" id="batchFile" accept=".csv,.txt" style="display:none"><button class="mini-btn" id="btnPickFile" style="flex:1;height:42px;">选择 CSV 文件</button><button class="mini-btn" id="btnParsePreview" style="flex:1;height:42px;background:rgba(52,199,89,.14);color:var(--ios-green);">解析预览</button></div><div id="importPreviewWrap" style="display:none;"><div class="import-preview" id="importPreview"></div></div><div class="modal-btns" style="margin-top:14px;"><button data-act="cancel">取消</button><button class="primary" data-act="ok" id="btnConfirmImport" disabled>确认导入</button></div>`);
  let parsedRows=[];
  const textarea=mask.querySelector('#importText'),previewWrap=mask.querySelector('#importPreviewWrap'),preview=mask.querySelector('#importPreview'),fileInput=mask.querySelector('#batchFile');
  mask.querySelector('[data-act="cancel"]').onclick=close;
  mask.querySelector('#btnDownloadTpl').onclick=downloadImportTemplate;
  mask.querySelector('#btnPickFile').onclick=()=>fileInput.click();
  fileInput.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{textarea.value=String(reader.result||'');toast('已读取文件，点「解析预览」查看');};reader.readAsText(file,'UTF-8');e.target.value='';};
  mask.querySelector('#btnParsePreview').onclick=()=>{
    const text=textarea.value.trim();
    if(!text){toast('请先粘贴文本或选择文件');return;}
    const result=parseImportText(text);
    if(!result.rows.length&&!result.errors.length){toast('没有解析到任何商品');return;}
    const existingCodes=new Set(products.map(p=>p.barcode)),newCodes=new Set();
    let conflictCount=0;
    const previewRows=result.rows.map(r=>{const dup=existingCodes.has(r.barcode)||newCodes.has(r.barcode);if(dup)conflictCount++;else newCodes.add(r.barcode);return{...r,conflict:dup};});
    previewWrap.style.display='block';
    preview.innerHTML=previewRows.slice(0,50).map(r=>{const catLabel=getCategoryLabel(getProductCategory(r));return`<div class="row ${r.conflict?'err':''}"><span class="cat-badge ${catLabel.cls}" style="flex:none;">${catLabel.text}</span><span class="n">${esc(r.name)}</span><span class="c">${esc(r.barcode)}</span>${r.conflict?'<span style="color:var(--ios-red);">冲突</span>':''}</div>`;}).join('')
      +(previewRows.length>50?`<div class="row" style="justify-content:center;color:var(--text2);">... 还有 ${previewRows.length-50} 件未显示</div>`:'')
      +(result.errors.length?`<div class="row err">跳过 ${result.errors.length} 行无效数据</div>`:'');
    parsedRows=previewRows.filter(r=>!r.conflict);
    const okBtn=mask.querySelector('#btnConfirmImport');
    okBtn.disabled=!parsedRows.length;
    okBtn.textContent=`确认导入 ${parsedRows.length} 件`+(conflictCount?` (跳过 ${conflictCount} 件)`:'');
  };
  mask.querySelector('#btnConfirmImport').onclick=()=>{
    if(!parsedRows.length)return;
    const now=Date.now();let added=0;
    parsedRows.forEach(r=>{
      const p={id:uid(),name:r.name,brand:r.brand,model:r.model,spec:r.spec,color:r.color,barcode:r.barcode,priceIn:r.priceIn,priceOut:r.priceOut,warnStock:r.warnStock,remark:r.remark,stock:0,createdAt:now,updatedAt:now};
      products.push(p);added++;
      if(r.stock>0)changeStock(p.id,r.stock,'批量导入初始库存');
    });
    saveLocal();scheduleSnapshot();close();toast(`成功导入 ${added} 件商品`);renderProductList();showView('list');
  };
}

function buildConfigLine(p){const parts=[];const bm=[p.brand,p.model].filter(Boolean).join(' ');if(bm)parts.push(bm);if(p.spec)parts.push(p.spec);if(p.color)parts.push(p.color);return parts.join(' · ');}
function printBarcode(p){
  try{
    const qr=qrcode(0,'M');qr.addData(p.barcode);qr.make();
    const qrSvg=qr.createSvgTag(3,0).replace(/<svg[^>]*>/,'<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">');
    const configLine=buildConfigLine(p);
    const win=window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>打印条码 - ${esc(p.name)}</title><style>* { box-sizing: border-box; } body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; padding: 20px; margin: 0; }.label { display: inline-block; border: 1px dashed #ccc; padding: 12px 24px; margin: 10px; border-radius: 12px; background: #fff; }.name { font-size: 15px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; }.config { font-size: 12px; color: #555; margin-bottom: 6px; white-space: nowrap; }.qrcode { display: flex; justify-content: center; margin: 8px 0; }.qrcode svg { width: 120px; height: 120px; }.code { font-family: monospace; font-size: 13px; letter-spacing: 1px; margin-top: 4px; color: #333; }@media print { body { padding: 0; } .label { border: none; margin: 0; padding: 8px; } }</style></head><body><div class="label"><div class="name">${esc(p.name)}</div>${configLine?`<div class="config">${esc(configLine)}</div>`:''}<div class="qrcode">${qrSvg}</div><div class="code">${esc(p.barcode)}</div></div><script>window.onload = function() { setTimeout(function() { window.print(); }, 200); };<\/script></body></html>`);
    win.document.close();
  }catch(e){toast('二维码格式不支持生成');}
}

function generateLabelCanvas(product){
  const canvas=document.createElement('canvas');canvas.width=B1_LABEL_SIZE.w_px;canvas.height=B1_LABEL_SIZE.h_px;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,canvas.width,canvas.height);
  function fitTextToBox(text,maxWidth,maxHeight,fontWeight='normal',maxFontSize=100){let fontSize=Math.min(maxHeight,maxFontSize);ctx.font=`${fontWeight} ${fontSize}px sans-serif`;while(fontSize>8){if(ctx.measureText(text).width<=maxWidth)return{font:`${fontWeight} ${fontSize}px sans-serif`};fontSize--;ctx.font=`${fontWeight} ${fontSize}px sans-serif`;}return{font:`${fontWeight} 8px sans-serif`};}
  const padding=8,nameText=product.name||'',nameH=36;
  ctx.fillStyle='#000000';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=fitTextToBox(nameText,canvas.width-padding*2,nameH,'bold',22).font;
  ctx.fillText(nameText,canvas.width/2,padding+nameH/2);
  const barcodeText=product.barcode||'',codeH=24,codeY=canvas.height-codeH-padding;
  ctx.font=fitTextToBox(barcodeText,canvas.width-padding*2,codeH,'normal',18).font;
  ctx.fillText(barcodeText,canvas.width/2,codeY+codeH/2);
  const midY=padding+nameH,midH=codeY-midY;
  const infoLines=[];const bm=[product.brand,product.model].filter(Boolean).join(' ');if(bm)infoLines.push(bm);
  const sc=[product.spec,product.color].filter(Boolean).join(' / ');if(sc)infoLines.push(sc);
  if(product.remark)infoLines.push(product.remark);
  const qrSize=110,qrX=padding,qrY=midY+(midH-qrSize)/2;
  try{
    const qr=qrcode(0,'M');qr.addData(barcodeText);qr.make();
    const qrCount=qr.getModuleCount(),cellSize=Math.floor(qrSize/qrCount),actualSize=cellSize*qrCount;
    const qrCanvas=document.createElement('canvas');qrCanvas.width=actualSize;qrCanvas.height=actualSize;
    const qrCtx=qrCanvas.getContext('2d');qrCtx.fillStyle='#FFFFFF';qrCtx.fillRect(0,0,actualSize,actualSize);qrCtx.fillStyle='#000000';
    for(let row=0;row<qrCount;row++)for(let col=0;col<qrCount;col++)if(qr.isDark(row,col))qrCtx.fillRect(col*cellSize,row*cellSize,cellSize,cellSize);
    ctx.drawImage(qrCanvas,qrX+(qrSize-actualSize)/2,qrY+(qrSize-actualSize)/2);
  }catch(e){}
  if(infoLines.length){
    const textX=qrX+qrSize+8,textW=canvas.width-textX-padding,lineHeight=midH/infoLines.length;
    ctx.textAlign='left';ctx.fillStyle='#000000';
    infoLines.forEach((lineText,index)=>{
      ctx.font=fitTextToBox(lineText,textW,lineHeight*0.8,'normal',20).font;
      ctx.fillText(lineText,textX,midY+index*lineHeight+lineHeight/2);
    });
  }
  return canvas;
}
async function blePrint(product){
  if(!navigator.bluetooth){toast('当前浏览器不支持蓝牙，请用安卓 Chrome 或 Edge');return;}
  if(typeof Niimbot==='undefined'){toast('蓝牙驱动未加载，请检查网络后刷新页面');return;}
  const canvas=generateLabelCanvas(product),dataUrl=canvas.toDataURL('image/png');
  toast('正在连接打印机...');
  try{const model={name_prefixes:['B1'],task:'b1',density:3,label_type:1,speed:1};await Niimbot.printImage(dataUrl,{model,size:B1_LABEL_SIZE});toast('打印指令已发送');}
  catch(e){console.error('蓝牙打印失败',e);if(e.name==='NotFoundError')toast('未选择打印机，已取消');else if(e.name==='SecurityError')toast('需要 HTTPS 才能使用蓝牙');else toast('打印失败：'+(e.message||'请重试'));}
}
function showPrintPreview(product){
  const canvas=generateLabelCanvas(product),dataUrl=canvas.toDataURL('image/png');
  const{mask,close}=showModal(`<div class="modal-title">打印预览</div><div style="text-align:center; padding:14px; background:rgba(120,120,128,.06); border-radius:16px; margin-bottom:16px;"><img src="${dataUrl}" style="max-width:100%; height:auto; display:block; margin:0 auto; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.12);"></div><div style="font-size:12.5px; color:var(--text2); text-align:center; margin-bottom:16px; line-height:1.7; letter-spacing:-.1px;">当前标签尺寸：40mm × 30mm<br>如果预览显示正常，可直接打印</div><div class="modal-btns"><button data-act="cancel">取消</button><button class="primary" data-act="print">立即打印</button></div>`);
  mask.querySelector('[data-act="cancel"]').onclick=close;
  mask.querySelector('[data-act="print"]').onclick=()=>{close();setTimeout(()=>blePrint(product),240);};
}
function saveBarcodeImage(p){
  const canvas=generateLabelCanvas(p);
  canvas.toBlob(blob=>{
    if(!blob){toast('生成图片失败');return;}
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`标签_${(p.name||'').replace(/[\\/:*?"<>|]/g,'_')}_${p.barcode}.png`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载标签图片');
  },'image/png');
}
async function batchDownloadBarcodes(){
  if(!products.length){toast('还没有商品，无法下载');return;}
  if(typeof JSZip==='undefined'){toast('打包组件未加载，请检查网络后刷新');return;}
  const nameCount={};
  const{mask,close}=showModal(`<div class="modal-title">批量下载标签</div><div class="modal-body">正在生成 ${products.length} 张标签图片...<div id="batchProgress" style="margin-top:10px;font-size:13px;color:var(--text2);">准备中</div></div>`);
  const progressEl=mask.querySelector('#batchProgress'),zip=new JSZip(),folder=zip.folder('标签图片');
  let ok=0,fail=0;
  for(let i=0;i<products.length;i++){
    const p=products[i];progressEl.textContent=`正在处理 ${i+1} / ${products.length}：${p.name}`;
    try{
      const canvas=generateLabelCanvas(p);
      const safeName=(p.name||'未命名').replace(/[\\/:*?"<>|]/g,'_').slice(0,30);
      const safeCode=(p.barcode||'nocode').replace(/[\\/:*?"<>|]/g,'_');
      let baseName=`${safeName}_${safeCode}`;
      if(nameCount[baseName]){nameCount[baseName]++;baseName=`${baseName}(${nameCount[baseName]})`;}else nameCount[baseName]=1;
      const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
      if(blob){folder.file(`${baseName}.png`,blob);ok++;}else fail++;
    }catch(e){fail++;}
    if(i%5===0)await new Promise(r=>setTimeout(r,0));
  }
  progressEl.textContent='正在打包 ZIP...';
  try{
    const zipBlob=await zip.generateAsync({type:'blob'},meta=>{progressEl.textContent=`正在打包... ${Math.round(meta.percent)}%`;});
    const url=URL.createObjectURL(zipBlob),a=document.createElement('a');
    const d=new Date(),pad=n=>String(n).padStart(2,'0');
    a.href=url;a.download=`标签打包_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.zip`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    close();toast(`已完成：成功 ${ok} 张${fail?`，失败 ${fail} 张`:''}`);
  }catch(e){console.error(e);close();toast('打包失败，请重试');}
}
$('#btnBatchBarcode').addEventListener('click',batchDownloadBarcodes);
function openBatchPrint(){
  if(!products.length){toast('还没有商品，无法打印');return;}
  const sorted=[...products].sort((a,b)=>b.createdAt-a.createdAt);
  const{mask,close}=showModal(`<div class="modal-title">批量打印标签</div><div class="bp-toolbar"><label><input type="checkbox" id="bpSelectAll" checked> 全选</label><span style="flex:1;text-align:right;color:var(--text2);">已选 <b id="bpCount">${sorted.length}</b> / ${sorted.length}</span></div><div class="bp-list" id="bpList">${sorted.map(p=>`<label class="bp-item"><input type="checkbox" class="bp-check" data-id="${esc(p.id)}" checked><span class="bp-name">${esc(p.name)}</span><span class="bp-code">${esc(p.barcode)}</span></label>`).join('')}</div><div class="modal-btns" style="margin-top:16px;"><button data-act="cancel">取消</button><button class="primary" data-act="print" id="bpStartBtn">开始打印 ${sorted.length} 张</button></div>`);
  const checkAll=mask.querySelector('#bpSelectAll'),checkboxes=mask.querySelectorAll('.bp-check'),countEl=mask.querySelector('#bpCount'),startBtn=mask.querySelector('#bpStartBtn');
  function updateCount(){const c=[...checkboxes].filter(x=>x.checked).length;countEl.textContent=c;startBtn.textContent=`开始打印 ${c} 张`;startBtn.disabled=c===0;checkAll.checked=c===checkboxes.length&&c>0;checkAll.indeterminate=c>0&&c<checkboxes.length;}
  checkAll.onchange=()=>{checkboxes.forEach(c=>c.checked=checkAll.checked);updateCount();};
  checkboxes.forEach(c=>c.onchange=updateCount);
  mask.querySelector('[data-act="cancel"]').onclick=close;
  startBtn.onclick=()=>{
    const ids=[...checkboxes].filter(c=>c.checked).map(c=>c.dataset.id);
    if(!ids.length){toast('请至少选择一个商品');return;}
    close();setTimeout(()=>startBatchPrint(ids),280);
  };
}
async function startBatchPrint(ids){
  if(!navigator.bluetooth){toast('当前浏览器不支持蓝牙，请用安卓 Chrome 或 Edge');return;}
  if(typeof Niimbot==='undefined'){toast('蓝牙驱动未加载，请检查网络后刷新页面');return;}
  const{mask,close}=showModal(`<div class="modal-title">正在批量打印</div><div class="bp-progress"><div id="bpProgressText">准备中...</div><div class="bp-bar"><div class="bp-bar-inner" id="bpBarInner"></div></div><div style="font-size:12.5px;color:var(--text2);margin-top:12px;">请不要关闭页面，也不要锁屏</div></div>`);
  const textEl=mask.querySelector('#bpProgressText'),barEl=mask.querySelector('#bpBarInner');
  let ok=0,fail=0;
  const model={name_prefixes:['B1'],task:'b1',density:3,label_type:1,speed:1};
  for(let i=0;i<ids.length;i++){
    const p=findProduct(ids[i]);
    if(!p){fail++;continue;}
    textEl.textContent=`正在打印 ${i+1} / ${ids.length}：${p.name}`;
    barEl.style.width=`${Math.round((i/ids.length)*100)}%`;
    try{await Niimbot.printImage(generateLabelCanvas(p).toDataURL('image/png'),{model,size:B1_LABEL_SIZE});ok++;}
    catch(e){console.error('第 '+(i+1)+' 张打印失败',e);fail++;if(e.name==='NotFoundError'||e.name==='SecurityError'){toast('已取消打印');break;}}
    await new Promise(r=>setTimeout(r,400));
  }
  barEl.style.width='100%';textEl.textContent='打印完成';
  await new Promise(r=>setTimeout(r,800));close();
  toast(fail===0?`批量打印完成：共 ${ok} 张`:`完成：成功 ${ok} 张，失败 ${fail} 张`);
}
$('#btnBatchPrint').addEventListener('click',openBatchPrint);

loadLocal();
showView('list');
